["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp169"},{"domain":"architecture","objective":"1.2","tag":"Snowflake Interfaces","front":"Which tool runs deployment commands in CI/CD without a browser?","back":"Snowflake CLI","why":"Snowflake CLI supports command-line resource management and development workflows.","trap":"Snowpipe REST API only addresses ingestion.","code":"","doc":"https://docs.snowflake.com/en/developer-guide/snowflake-cli/index","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp170"},{"domain":"architecture","objective":"1.2","tag":"Snowflake Interfaces","front":"Can VS Code execute Snowflake work through supported extensions?","back":"Yes","why":"Developer tools and Snowflake extensions can integrate SQL and Snowflake workflows into IDEs.","trap":"An IDE is not a substitute for account authentication and grants.","code":"","doc":"https://docs.snowflake.com/en/developer-guide/snowflake-cli/index","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp171"},{"domain":"architecture","objective":"1.3","tag":"Object hierarchy","front":"Which level contains Snowflake accounts?","back":"An organization","why":"An organization can contain multiple Snowflake accounts across supported regions/clouds.","trap":"A database is inside an account, not above it.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/ddl-database","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp172"},{"domain":"architecture","objective":"1.3","tag":"Object hierarchy","front":"What contains schemas, which contain tables and views?","back":"A database","why":"Snowflake organizes tables, views, stages, functions and related objects inside schemas.","trap":"Virtual warehouses are account-level compute, not schema children.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/ddl-database","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp173"},{"domain":"architecture","objective":"1.3","tag":"Object hierarchy","front":"Are warehouses created inside database schemas?","back":"No; they are account-level objects","why":"Warehouses allocate compute and are independent of databases and schemas.","trap":"SELECT on a table does not imply warehouse USAGE.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/ddl-database","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp174"},{"domain":"architecture","objective":"1.3","tag":"Object hierarchy","front":"Which object controls reusable CSV and JSON parsing options?","back":"Named file format","why":"File format objects store parsing rules for data loads/unloads.","trap":"A storage integration supplies cloud access, not CSV delimiter rules.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/create-file-format","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp175"},{"domain":"architecture","objective":"1.3","tag":"Object hierarchy","front":"Which Snowflake object generates monotonically advancing unique numbers?","back":"Sequence","why":"Sequences generate values with NEXTVAL, though gaps and ordering guarantees require care.","trap":"Do not assume no gaps under rollback or concurrency.","code":"SELECT my_sequence.NEXTVAL;","doc":"https://docs.snowflake.com/en/sql-reference/ddl-database","priority":2,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp176"},{"domain":"architecture","objective":"1.3","tag":"Stored procedures","front":"Default Snowflake stored-procedure privilege context?","back":"Owner rights (unless configured otherwise)","why":"Stored procedures default to running with owner privileges, subject to documented restrictions.","trap":"Granting CALL to a role does not necessarily give underlying-table SELECT.","code":"","doc":"https://docs.snowflake.com/en/developer-guide/stored-procedure/stored-procedures-rights","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp177"},{"domain":"architecture","objective":"1.3","tag":"Stored procedures","front":"What forces a procedure to check the caller’s table grants?","back":"EXECUTE AS CALLER","why":"Caller-rights procedures use the privileges of the calling role rather than owner authority.","trap":"EXECUTE AS OWNER is the default for many procedure types.","code":"CREATE PROCEDURE p() RETURNS VARCHAR LANGUAGE SQL EXECUTE AS CALLER AS $$ BEGIN RETURN 'ok'; END; $$;","doc":"https://docs.snowflake.com/en/developer-guide/stored-procedure/stored-procedures-rights","priority":3,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp178"},{"domain":"architecture","objective":"1.3","tag":"Stored procedures","front":"SQL command used to invoke a stored procedure?","back":"CALL","why":"Stored procedures run as procedural operations via CALL.","trap":"A scalar UDF is commonly used in SELECT expressions instead.","code":"CALL proc_name();","doc":"https://docs.snowflake.com/en/developer-guide/stored-procedure/stored-procedures-rights","priority":2,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp179"},{"domain":"architecture","objective":"1.3","tag":"Parameters","front":"If session and account parameter values differ, which wins?","back":"The session value","why":"An explicit session-level parameter generally overrides user and account settings for that session.","trap":"Some parameters have restricted scopes and special inheritance rules.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/parameters","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp180"},{"domain":"architecture","objective":"1.3","tag":"Parameters","front":"How do you inspect current session parameter settings?","back":"SHOW PARAMETERS IN SESSION","why":"SHOW PARAMETERS can inspect parameter values at relevant object scopes.","trap":"Do not assume every parameter is an account parameter.","code":"SHOW PARAMETERS IN SESSION;","doc":"https://docs.snowflake.com/en/sql-reference/parameters","priority":2,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp181"},{"domain":"architecture","objective":"1.3","tag":"Parameters","front":"Which context function returns the active primary role?","back":"CURRENT_ROLE()","why":"CURRENT_ROLE returns the primary role, not necessarily every enabled secondary or inherited role.","trap":"Use IS_ROLE_IN_SESSION when hierarchy membership matters.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/functions/current_role","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp182"},{"domain":"architecture","objective":"1.4","tag":"Warehouse types","front":"What hardware pattern makes Snowpark-optimized warehouses distinctive?","back":"Additional memory per compute unit","why":"Snowpark-optimized warehouses are tailored for memory-intensive Snowpark workloads.","trap":"A larger standard warehouse is not identical in memory-to-CPU ratio.","code":"","doc":"https://docs.snowflake.com/en/user-guide/warehouses-snowpark-optimized","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp183"},{"domain":"architecture","objective":"1.4","tag":"Warehouse types","front":"Are Standard Gen 1 and Gen 2 warehouse types identical?","back":"No","why":"Gen 2 offers newer execution infrastructure for supported workloads and can have different cost/performance tradeoffs.","trap":"Evaluate credits and benchmark actual queries, not names alone.","code":"","doc":"https://docs.snowflake.com/en/user-guide/warehouses-gen2","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp184"},{"domain":"architecture","objective":"1.4","tag":"Warehouses","front":"To make one memory-intensive query faster, scale up or out?","back":"Scale up","why":"Increasing warehouse size gives more resources to a single query; scale-out adds concurrency clusters.","trap":"Multi-cluster is not a guaranteed fix for a single spilling query.","code":"","doc":"https://docs.snowflake.com/en/user-guide/warehouses-overview","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp185"},{"domain":"architecture","objective":"1.4","tag":"Warehouses","front":"To reduce queueing from hundreds of simultaneous queries, scale up or out?","back":"Scale out using multi-cluster","why":"Adding clusters addresses concurrent workloads, though query characteristics still matter.","trap":"Scaling up can help too, but scale-out targets concurrency directly.","code":"","doc":"https://docs.snowflake.com/en/user-guide/warehouses-multicluster","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp186"},{"domain":"architecture","objective":"1.4","tag":"Warehouses","front":"Which multi-cluster policy favors lower credit use over queue latency?","back":"ECONOMY","why":"ECONOMY is conservative about starting extra clusters compared with STANDARD.","trap":"STANDARD favors faster response to concurrency demand.","code":"","doc":"https://docs.snowflake.com/en/user-guide/warehouses-multicluster","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp187"},{"domain":"architecture","objective":"1.4","tag":"Warehouses","front":"What option wakes a suspended warehouse when a query needs it?","back":"AUTO_RESUME = TRUE","why":"Auto-resume allows eligible SQL execution to start a suspended warehouse.","trap":"AUTO_SUSPEND determines when idle warehouses stop.","code":"ALTER WAREHOUSE wh SET AUTO_RESUME=TRUE;","doc":"https://docs.snowflake.com/en/user-guide/warehouses-overview","priority":2,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp188"},{"domain":"architecture","objective":"1.4","tag":"Warehouses","front":"What does AUTO_SUSPEND control?","back":"Idle shutdown delay","why":"The setting specifies how long a warehouse may be idle before suspension.","trap":"It does not interrupt actively running queries at the idle threshold.","code":"","doc":"https://docs.snowflake.com/en/user-guide/warehouses-overview","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp189"},{"domain":"architecture","objective":"1.4","tag":"Warehouses","front":"Why might AUTO_SUSPEND=0 be undesirable?","back":"It disables automatic suspension","why":"An always-running idle warehouse can keep accruing compute cost.","trap":"AUTO_SUSPEND is measured in seconds for relevant warehouse settings.","code":"","doc":"https://docs.snowflake.com/en/user-guide/warehouses-overview","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp190"},{"domain":"architecture","objective":"1.4","tag":"Warehouses","front":"What happens on resume to the warehouse local disk cache?","back":"It is not preserved","why":"A restarted warehouse must warm its local data cache again.","trap":"Persisted query result cache is a different service.","code":"","doc":"https://docs.snowflake.com/en/user-guide/warehouses-overview","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp191"},{"domain":"architecture","objective":"1.5","tag":"Storage","front":"What metadata enables micro-partition pruning?","back":"Value ranges and other column statistics","why":"Snowflake can skip partitions known not to satisfy supported filters.","trap":"It is not a user-created B-tree index on every column.","code":"","doc":"https://docs.snowflake.com/en/user-guide/tables-clustering-micropartitions","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp192"},{"domain":"architecture","objective":"1.5","tag":"Storage","front":"Does UPDATE rewrite rows in existing micro-partition files in place?","back":"No; new partition versions are written","why":"Micro-partitions are immutable.","trap":"Old versions can contribute to Time Travel and Fail-safe storage.","code":"","doc":"https://docs.snowflake.com/en/user-guide/tables-clustering-micropartitions","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp193"},{"domain":"architecture","objective":"1.5","tag":"Table types","front":"Which table type has no Fail-safe but lasts across sessions?","back":"Transient table","why":"Transient tables persist until dropped while omitting Fail-safe.","trap":"Temporary tables end with the session.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp194"},{"domain":"architecture","objective":"1.5","tag":"Table types","front":"Which table object can read remote Parquet files but is not normally writable?","back":"External table","why":"External tables expose read-only SQL representations over external files.","trap":"Iceberg table capabilities depend on table/catalog configuration.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp195"},{"domain":"architecture","objective":"1.5","tag":"Table types","front":"What distinguishes Iceberg tables from ordinary external tables?","back":"Open table format and supported transactional table operations","why":"Iceberg includes snapshots and metadata with supported read/write semantics.","trap":"Do not treat all Iceberg catalog configurations as identical.","code":"","doc":"https://docs.snowflake.com/en/user-guide/tables-iceberg","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp196"},{"domain":"architecture","objective":"1.5","tag":"Iceberg","front":"What connects Iceberg table metadata to a non-Snowflake catalog?","back":"Catalog integration","why":"A catalog integration connects Snowflake to supported externally managed Iceberg catalogs.","trap":"An external volume configures storage access instead.","code":"","doc":"https://docs.snowflake.com/en/user-guide/tables-iceberg-configure-catalog-integration","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp197"},{"domain":"architecture","objective":"1.5","tag":"Table types","front":"What is a dynamic table’s TARGET_LAG?","back":"Desired freshness relative to its upstream sources","why":"Snowflake refreshes declarative transformations aiming for the configured lag.","trap":"TARGET_LAG is not the same as task CRON frequency.","code":"","doc":"https://docs.snowflake.com/en/user-guide/dynamic-tables-about","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp198"},{"domain":"architecture","objective":"1.5","tag":"Views","front":"Which view type stores maintained query results?","back":"Materialized view","why":"Materialized views persist supported query results and require maintenance.","trap":"A regular view is only a query definition.","code":"","doc":"https://docs.snowflake.com/en/user-guide/views-materialized","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp199"},{"domain":"architecture","objective":"1.5","tag":"Views","front":"Which view hides its definition from unauthorized consumers?","back":"Secure view","why":"Secure views protect underlying logic and are commonly used for governed sharing.","trap":"A standard view should not be assumed equivalent.","code":"","doc":"https://docs.snowflake.com/en/user-guide/views-introduction","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp200"},{"domain":"architecture","objective":"1.5","tag":"Streams and clones","front":"Do pending stream change records transfer into a cloned stream?","back":"No","why":"A cloned stream begins at the cloned object’s offset point rather than inheriting pending records.","trap":"Do not expect backlog in a freshly cloned schema stream.","code":"","doc":"https://docs.snowflake.com/en/user-guide/streams-intro","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp201"},{"domain":"architecture","objective":"1.6","tag":"AI application features","front":"Which Snowflake tool combines SQL/Python code and interactive analysis in notebooks?","back":"Snowflake Notebooks","why":"Notebooks support interactive data and ML workflows within Snowflake.","trap":"Notebooks are not the same as scalar SQL UDFs.","code":"","doc":"https://docs.snowflake.com/en/user-guide/ui-snowsight/notebooks","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp202"},{"domain":"architecture","objective":"1.6","tag":"AI application features","front":"What is Streamlit in Snowflake used to build?","back":"Interactive data apps","why":"Streamlit provides an app UI connected to Snowflake data and computation.","trap":"It is not a query optimizer or table format.","code":"","doc":"https://docs.snowflake.com/en/developer-guide/streamlit/about-streamlit","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp203"},{"domain":"architecture","objective":"1.6","tag":"Cortex","front":"Which Snowflake feature turns business questions into SQL over tables?","back":"Cortex Analyst","why":"Cortex Analyst uses semantic representations for structured-data question answering.","trap":"Cortex Search retrieves relevant textual records instead.","code":"","doc":"https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-analyst","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp204"},{"domain":"architecture","objective":"1.6","tag":"Cortex","front":"Which feature retrieves relevant document chunks for RAG?","back":"Cortex Search","why":"Cortex Search supports managed retrieval over textual knowledge.","trap":"RAG retrieval differs from natural-language-to-SQL.","code":"","doc":"https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-search/cortex-search-overview","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp205"},{"domain":"architecture","objective":"1.6","tag":"Cortex","front":"Name a Snowflake SQL feature for summarizing text with an LLM.","back":"AI_SUMMARIZE","why":"Snowflake supports Cortex AI SQL functions for tasks including summarization.","trap":"Do not confuse model registry inference with built-in AI SQL functions.","code":"SELECT AI_SUMMARIZE(review_text) FROM reviews;","doc":"https://docs.snowflake.com/en/user-guide/snowflake-cortex/llm-functions","priority":3,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp206"},{"domain":"architecture","objective":"1.6","tag":"Cortex","front":"Name the AI SQL function intended for sentiment analysis.","back":"AI_SENTIMENT","why":"AI_SENTIMENT processes text to classify and score sentiment.","trap":"Sentiment is not the same as classification by arbitrary labels.","code":"SELECT AI_SENTIMENT(customer_feedback) FROM reviews;","doc":"https://docs.snowflake.com/en/user-guide/snowflake-cortex/llm-functions","priority":2,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp207"},{"domain":"architecture","objective":"1.6","tag":"Cortex","front":"How does document extraction differ from text summarization?","back":"Extraction returns targeted structured fields","why":"Document processing extracts attributes from documents, whereas summarization condenses their content.","trap":"Summarization is not guaranteed to produce reliable key-value extraction.","code":"","doc":"https://docs.snowflake.com/en/user-guide/snowflake-cortex/llm-functions","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp208"},{"domain":"architecture","objective":"1.6","tag":"Snowflake ML","front":"Which feature registers versions of a trained ML model?","back":"Snowflake Model Registry","why":"The registry tracks model versions, metadata and supported inference methods.","trap":"Cortex Analyst does not store trained model versions.","code":"","doc":"https://docs.snowflake.com/en/developer-guide/snowflake-ml/model-registry/overview","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp209"},{"domain":"architecture","objective":"1.6","tag":"Snowpark","front":"Where does supported Snowpark DataFrame computation run?","back":"On Snowflake compute","why":"Snowpark builds lazy plans that execute in Snowflake once an action runs.","trap":"Avoid assuming every step transfers all rows to a laptop.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp210"},{"domain":"governance","objective":"2.1","tag":"Access model","front":"What are Snowflake’s two main object access-control models?","back":"RBAC and DAC","why":"RBAC grants privileges through roles; DAC recognizes object ownership grant capabilities.","trap":"SAML is an authentication standard, not a Snowflake authorization model.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp211"},{"domain":"governance","objective":"2.1","tag":"Role types","front":"Can an account role contain an inherited database role?","back":"Yes","why":"Database roles can be granted to account roles; privileges then flow through the hierarchy.","trap":"A database role cannot generally be granted straight to a user.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp212"},{"domain":"governance","objective":"2.1","tag":"Role types","front":"Which built-in role creates users and account roles?","back":"USERADMIN","why":"USERADMIN handles user and role lifecycle administration.","trap":"SECURITYADMIN has broader grant powers.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp213"},{"domain":"governance","objective":"2.1","tag":"Role types","front":"Which role normally administers objects and warehouses?","back":"SYSADMIN","why":"SYSADMIN is intended to own/operate most database objects and warehouses.","trap":"SECURITYADMIN is focused on roles and grants.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp214"},{"domain":"governance","objective":"2.1","tag":"Role types","front":"Which role is organization-wide rather than only account-wide?","back":"ORGADMIN","why":"ORGADMIN can manage organization-scoped functions.","trap":"ACCOUNTADMIN governs one Snowflake account.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp215"},{"domain":"governance","objective":"2.1","tag":"Secondary roles","front":"What does USE SECONDARY ROLES ALL do?","back":"Enables granted secondary roles in the session","why":"Snowflake can use privileges from active secondary roles in addition to primary role.","trap":"It does not automatically transfer object ownership.","code":"USE SECONDARY ROLES ALL;","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp216"},{"domain":"governance","objective":"2.1","tag":"Role grants","front":"Which direction does GRANT ROLE A TO ROLE B propagate privileges?","back":"B inherits A","why":"Giving role A to B makes A’s privileges available to B via hierarchy.","trap":"Do not reverse the arrow.","code":"GRANT ROLE ANALYST TO ROLE MANAGER;","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp217"},{"domain":"governance","objective":"2.1","tag":"Schema USAGE","front":"Role has table SELECT and database USAGE: what else may be required?","back":"Schema USAGE","why":"Object access typically requires USAGE through database and schema plus privilege on the table.","trap":"Table SELECT alone does not bypass ancestor gates.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-privileges","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp218"},{"domain":"governance","objective":"2.1","tag":"Authentication","front":"Why use multi-factor authentication?","back":"An additional verification factor","why":"MFA reduces risk from stolen passwords or single-factor credentials.","trap":"MFA and network policies protect different layers.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-mfa","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp219"},{"domain":"governance","objective":"2.1","tag":"Authentication","front":"What does federated SSO separate?","back":"External authentication from Snowflake authorization","why":"An identity provider authenticates while Snowflake still applies roles and grants.","trap":"SSO does not replace database privileges.","code":"","doc":"https://docs.snowflake.com/en/user-guide/admin-security-fed-auth-overview","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp220"},{"domain":"governance","objective":"2.1","tag":"Authentication","front":"Which mechanism uses an RSA key pair for Snowflake programmatic login?","back":"Key-pair authentication","why":"A user’s public key is registered with Snowflake; a client signs using its private key.","trap":"The private key must stay secret and is not uploaded to Snowflake.","code":"","doc":"https://docs.snowflake.com/en/user-guide/key-pair-auth","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp221"},{"domain":"governance","objective":"2.1","tag":"Authentication","front":"OAuth mainly provides what for client access?","back":"Delegated token-based authorization","why":"Clients present OAuth access tokens rather than user passwords in supported flows.","trap":"OAuth is not the same as raw SAML assertion authentication.","code":"","doc":"https://docs.snowflake.com/en/user-guide/oauth-intro","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp222"},{"domain":"governance","objective":"2.1","tag":"Authentication","front":"Which policy controls allowed login methods?","back":"Authentication policy","why":"Authentication policies can restrict how users sign in.","trap":"Network policies instead restrict network origins.","code":"","doc":"https://docs.snowflake.com/en/user-guide/authentication-policies","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp223"},{"domain":"governance","objective":"2.1","tag":"Network policies","front":"Can valid credentials bypass a restrictive network policy?","back":"No","why":"Denied network connections can be blocked before SQL privileges are considered.","trap":"Allowlisting a VPN address needs the actual observed egress IP.","code":"","doc":"https://docs.snowflake.com/en/user-guide/network-policies","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp224"},{"domain":"governance","objective":"2.1","tag":"Identifiers","front":"Is the account identifier always just the friendly account name?","back":"No","why":"Preferred account identifiers can include organization and account names.","trap":"Do not confuse account locator with organization-qualified account identifier.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp225"},{"domain":"governance","objective":"2.1","tag":"Logging","front":"Which function returns the active Snowflake role for the current query?","back":"CURRENT_ROLE()","why":"Session context helps debug SQL execution and policy behavior.","trap":"It does not enumerate every possible effective role.","code":"SELECT CURRENT_ROLE();","doc":"https://docs.snowflake.com/en/sql-reference","priority":2,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp226"},{"domain":"governance","objective":"2.1","tag":"Privileges","front":"What grants permission to start/stop a warehouse without changing its size?","back":"OPERATE on warehouse","why":"Warehouse OPERATE permits operation; MODIFY grants configuration management.","trap":"Warehouse USAGE is for using it for query execution.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-privileges","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp227"},{"domain":"governance","objective":"2.2","tag":"Masking","front":"Which policy changes returned column values by role?","back":"Masking policy","why":"Dynamic column masking can expose raw or redacted values based on session context.","trap":"Row access policies determine row visibility.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-column-intro","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp228"},{"domain":"governance","objective":"2.2","tag":"Row access","front":"Which policy controls which rows appear?","back":"Row access policy","why":"Row policies add filtering based on policy logic.","trap":"Masking changes values; it does not necessarily filter rows.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-row-intro","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp229"},{"domain":"governance","objective":"2.2","tag":"Data tagging","front":"Does applying an object tag automatically enforce masking?","back":"No","why":"A tag must have the relevant masking policy association for tag-based masking.","trap":"Classification labels alone do not redact data.","code":"","doc":"https://docs.snowflake.com/en/user-guide/object-tagging/introduction","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp230"},{"domain":"governance","objective":"2.2","tag":"Privacy policies","front":"What problem do projection policies address?","back":"Restricting exposure of protected columns through SELECT","why":"Projection policies limit allowed projection of designated columns under supported contexts.","trap":"Projection restrictions are not a substitute for network controls.","code":"","doc":"https://docs.snowflake.com/en/user-guide/privacy-policies","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp231"},{"domain":"governance","objective":"2.2","tag":"Privacy policies","front":"What do aggregation policies restrict?","back":"Disclosing individual rows through insufficient aggregation","why":"Aggregation policies can require aggregate-based access patterns.","trap":"They are not query acceleration techniques.","code":"","doc":"https://docs.snowflake.com/en/user-guide/privacy-policies","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp232"},{"domain":"governance","objective":"2.2","tag":"Privacy policies","front":"What do join policies restrict?","back":"How protected data can be joined","why":"Join policies control permitted joins involving protected tables.","trap":"The policy does not create a primary-key index.","code":"","doc":"https://docs.snowflake.com/en/user-guide/privacy-policies","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp233"},{"domain":"governance","objective":"2.2","tag":"Trust Center","front":"Which Snowflake interface surfaces security risks and recommendations?","back":"Trust Center","why":"Trust Center provides security findings and monitoring capabilities.","trap":"It is not a replacement for SQL object privileges.","code":"","doc":"https://docs.snowflake.com/en/user-guide/trust-center/trust-center","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp234"},{"domain":"governance","objective":"2.2","tag":"Encryption","front":"Is customer-managed key material required for baseline encryption?","back":"No","why":"Snowflake automatically encrypts data; Tri-Secret Secure is a separate option.","trap":"Encryption does not replace authorization policies.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-editions","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp235"},{"domain":"governance","objective":"2.2","tag":"Encryption","front":"What does periodic rekeying change?","back":"Encryption key hierarchy used to protect stored data","why":"Snowflake periodic rekeying enhances security by re-encrypting key material at configured lifecycle points.","trap":"Do not confuse periodic rekeying with manual rotation of client RSA login keys.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-editions","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp236"},{"domain":"governance","objective":"2.2","tag":"Alerts","front":"What Snowflake object can monitor a SQL condition and run an action?","back":"Alert","why":"Alerts evaluate conditions and trigger actions such as notifications.","trap":"Streams capture change records; they are not condition-notification policies.","code":"","doc":"https://docs.snowflake.com/en/user-guide/alerts","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp237"},{"domain":"governance","objective":"2.2","tag":"Notifications","front":"What integration type can deliver supported email notifications?","back":"Notification integration","why":"A notification integration provides configured communication channels for alerts/SQL notifications.","trap":"Storage integrations are for cloud file access.","code":"","doc":"https://docs.snowflake.com/en/user-guide/notifications/about-notifications","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp238"},{"domain":"governance","objective":"2.2","tag":"Replication","front":"What is the difference between replication and failover?","back":"Copying state versus promoting a secondary","why":"Replication maintains secondary objects; failover enables recovery by promoting to a writable primary.","trap":"Replication itself does not necessarily redirect all applications automatically.","code":"","doc":"https://docs.snowflake.com/en/user-guide/account-replication-intro","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp239"},{"domain":"governance","objective":"2.2","tag":"Replication","front":"What is a failover group?","back":"Account object grouping replicable resources for failover","why":"Failover groups manage replication and promotion across supported accounts/regions.","trap":"A regular share is not a database failover mechanism.","code":"","doc":"https://docs.snowflake.com/en/user-guide/account-replication-failover-failback","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp240"},{"domain":"governance","objective":"2.2","tag":"Data lineage","front":"Which view records base and modified objects accessed by queries?","back":"SNOWFLAKE.ACCOUNT_USAGE.ACCESS_HISTORY","why":"ACCESS_HISTORY can provide object and column lineage information.","trap":"QUERY_HISTORY is primarily query execution history.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/account-usage/access_history","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp241"},{"domain":"governance","objective":"2.2","tag":"Data lineage","front":"Does query lineage always equal a simple list of tables in SQL text?","back":"No","why":"Lineage can include derived objects and transformations beyond textual table names.","trap":"Rely on supported lineage metadata rather than SQL string searches alone.","code":"","doc":"https://docs.snowflake.com/en/user-guide/ui-snowsight-lineage","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp242"},{"domain":"governance","objective":"2.3","tag":"Cost control","front":"Which feature can automatically suspend a warehouse at credit thresholds?","back":"Resource monitor","why":"Resource monitors govern tracked warehouse credits and actions.","trap":"They do not enforce a limit on all serverless or storage charges.","code":"","doc":"https://docs.snowflake.com/en/user-guide/resource-monitors","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp243"},{"domain":"governance","objective":"2.3","tag":"Cost control","front":"Which tool tracks broader spending than warehouse-only monitors?","back":"Snowflake Budgets","why":"Budgets can monitor covered account resource cost categories.","trap":"Do not assume a warehouse resource monitor caps all organization spending.","code":"","doc":"https://docs.snowflake.com/en/user-guide/budgets","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp244"},{"domain":"governance","objective":"2.3","tag":"Cost control","front":"How are warehouse credits affected by warehouse size and runtime?","back":"Size-dependent credits per time used","why":"Warehouse compute billing varies with size and running time, with minimum billing rules.","trap":"Do not compute credit cost solely from rows scanned.","code":"","doc":"https://docs.snowflake.com/en/user-guide/cost-understanding-compute","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp245"},{"domain":"governance","objective":"2.3","tag":"Cost control","front":"What is a common minimum billing period on warehouse startup?","back":"60 seconds","why":"Snowflake applies minimum compute charges on warehouse starts before per-second accrual.","trap":"Avoid assuming a 1-second query costs only 1 second after resuming.","code":"","doc":"https://docs.snowflake.com/en/user-guide/cost-understanding-compute","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp246"},{"domain":"governance","objective":"2.3","tag":"Cost control","front":"What drives additional cost from unneeded Time Travel history?","back":"Retention of historical micro-partition versions","why":"Longer retention and frequent DML can increase billed storage.","trap":"The storage overhead is not equivalent to warehouse idle compute.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-time-travel","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp247"},{"domain":"governance","objective":"2.3","tag":"Monitoring","front":"Which ACCOUNT_USAGE view attributes query costs to queries?","back":"QUERY_ATTRIBUTION_HISTORY","why":"The view helps investigate compute credits attributable to queries.","trap":"WAREHOUSE_METERING_HISTORY totals at warehouse level instead.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/account-usage/query_attribution_history","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp248"},{"domain":"governance","objective":"2.3","tag":"Monitoring","front":"Where to find query run time and failure status account-wide?","back":"ACCOUNT_USAGE.QUERY_HISTORY","why":"This view provides historical query executions and metrics with possible ingestion lag.","trap":"INFORMATION_SCHEMA is not the same historical account-wide dataset.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/account-usage/query_history","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp249"},{"domain":"governance","objective":"2.3","tag":"Monitoring","front":"Can ACCOUNT_USAGE views have latency?","back":"Yes","why":"Many account-usage views are populated asynchronously.","trap":"Do not assume a query just executed is already visible.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/account-usage/query_history","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp250"},{"domain":"loading","objective":"3.1","tag":"Named stages","front":"What does @~ reference?","back":"Current user’s internal stage","why":"User stages are provisioned automatically for Snowflake users.","trap":"@%table references a table stage, not a user stage.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-overview","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp251"},{"domain":"loading","objective":"3.1","tag":"Named stages","front":"What does @%ORDERS reference?","back":"The internal table stage for ORDERS","why":"Table stages are tied to a table and use the @% notation.","trap":"@ORDERS without % refers to a named stage.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-overview","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp252"},{"domain":"loading","objective":"3.1","tag":"Named stages","front":"What does a named external stage store?","back":"Cloud location plus access/format metadata","why":"An external stage points to cloud files rather than duplicating them automatically.","trap":"Creating the stage does not ingest its files into a table.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/create-stage","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp253"},{"domain":"loading","objective":"3.1","tag":"Named stages","front":"Which SQL command lists available files in a stage?","back":"LIST","why":"LIST enumerates files and metadata in a supported stage.","trap":"SELECT * FROM @stage may parse rows rather than list all file names.","code":"LIST @my_stage;","doc":"https://docs.snowflake.com/en/user-guide/data-load-overview","priority":2,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp254"},{"domain":"loading","objective":"3.1","tag":"Named stages","front":"Which command removes staged files, not table rows?","back":"REMOVE (RM)","why":"REMOVE deletes files from internal or supported external stages.","trap":"DELETE FROM table changes table data, not staged files.","code":"REMOVE @my_stage/path/;","doc":"https://docs.snowflake.com/en/user-guide/data-load-overview","priority":2,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp255"},{"domain":"loading","objective":"3.1","tag":"Stage encryption","front":"Can an external stage need server-side encryption settings?","back":"Yes","why":"Some external cloud storage configurations use server-side encryption options; permissions and key policies matter.","trap":"Snowflake internal stages and external cloud buckets have different control boundaries.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/create-stage","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp256"},{"domain":"loading","objective":"3.1","tag":"Stages","front":"Which cloud resource authenticates S3 storage integrations securely?","back":"IAM role via an assumed-role trust relationship","why":"Snowflake uses the integration’s configured role and external ID in AWS trust.","trap":"Avoid embedding long-lived secret access keys in stage definitions.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-s3-config-storage-integration","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp257"},{"domain":"loading","objective":"3.1","tag":"File formats","front":"Which file format type is for Parquet data?","back":"TYPE = PARQUET","why":"Parquet is a columnar self-describing file format.","trap":"Do not treat Parquet byte streams as quoted CSV.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/create-file-format","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp258"},{"domain":"loading","objective":"3.1","tag":"File formats","front":"Which CSV property specifies the field separator?","back":"FIELD_DELIMITER","why":"FIELD_DELIMITER defines parsing delimiters for CSV.","trap":"RECORD_DELIMITER separates records instead.","code":"CREATE FILE FORMAT f TYPE=CSV FIELD_DELIMITER='|';","doc":"https://docs.snowflake.com/en/sql-reference/sql/create-file-format","priority":2,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp259"},{"domain":"loading","objective":"3.1","tag":"File formats","front":"Which CSV property tells Snowflake to ignore lines at start?","back":"SKIP_HEADER","why":"SKIP_HEADER identifies the number of header lines to skip for CSV loads.","trap":"PARSE_HEADER serves different schema-based scenarios.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/create-file-format","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp260"},{"domain":"loading","objective":"3.1","tag":"File formats","front":"What does NULL_IF configure for CSV?","back":"Input strings treated as SQL NULL","why":"NULL_IF maps configured CSV tokens to NULL.","trap":"It is not the same as JSON null versus SQL NULL.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/create-file-format","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp261"},{"domain":"loading","objective":"3.1","tag":"File formats","front":"Which JSON option emits rows from one top-level array?","back":"STRIP_OUTER_ARRAY = TRUE","why":"JSON array elements can be ingested as separate records.","trap":"This is not a general nested-array FLATTEN inside COPY.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/create-file-format","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp262"},{"domain":"loading","objective":"3.1","tag":"File formats","front":"How can file formats be reused across many load jobs?","back":"CREATE FILE FORMAT and reference its name","why":"Named file formats centralize parsing settings.","trap":"A cloud storage integration controls access rather than delimiter settings.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/create-file-format","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp263"},{"domain":"loading","objective":"3.1","tag":"COPY parsing","front":"What does ON_ERROR=CONTINUE do for a bad CSV row?","back":"Skips the row, continues with valid rows","why":"The file can be partially loaded as a result.","trap":"SKIP_FILE instead skips the entire file on error.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp264"},{"domain":"loading","objective":"3.1","tag":"COPY parsing","front":"What does ON_ERROR=SKIP_FILE do if one row fails?","back":"Rejects the affected file","why":"Other eligible files may still load in the bulk COPY statement.","trap":"Do not confuse with ABORT_STATEMENT.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp265"},{"domain":"loading","objective":"3.1","tag":"COPY parsing","front":"What is the default ON_ERROR mode for bulk COPY?","back":"ABORT_STATEMENT","why":"Snowflake aborts on supported load errors unless configured otherwise.","trap":"Snowpipe restrictions differ from bulk COPY capabilities.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp266"},{"domain":"loading","objective":"3.1","tag":"COPY parsing","front":"How can COPY inspect staged errors without inserting rows?","back":"VALIDATION_MODE","why":"The validation mode reports errors while leaving target rows unchanged.","trap":"Not supported for COPY transformations in the general case.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp267"},{"domain":"loading","objective":"3.1","tag":"COPY parsing","front":"What additionally does RETURN_ALL_ERRORS include?","back":"Errors from earlier partially loaded files","why":"RETURN_ALL_ERRORS extends validation to partially loaded files from previous loads.","trap":"RETURN_ERRORS does not include that same historical scope.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp268"},{"domain":"loading","objective":"3.1","tag":"COPY parsing","front":"Which command reprocesses previously loaded files on purpose?","back":"COPY INTO ... FORCE=TRUE","why":"FORCE bypasses the normal load-file detection guardrails.","trap":"Can create duplicate target rows.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp269"},{"domain":"loading","objective":"3.1"," flake.com/en/sql-reference/sql/copy-into-location","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp273"},{"domain":"loading","objective":"3.1","tag":"Unload","front":"Which COPY option requests a single unloaded file?","back":"SINGLE=TRUE","why":"Supported unload commands can request a single output file, often with performance tradeoffs.","trap":"Large unloads typically benefit from multiple files.","code":"COPY INTO @out FROM orders SINGLE=TRUE;","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-location","priority":2,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp274"},{"domain":"loading","objective":"3.1","tag":"Unload","front":"What does HEADER=TRUE control for CSV unload?","back":"Writes the column header row","why":"HEADER is useful when producing delimited files for downstream consumers.","trap":"It is not the same as SKIP_HEADER during loading.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-location","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp275"},{"domain":"loading","objective":"3.1","tag":"Unload","front":"What does PARTITION BY mean in COPY INTO @stage?","back":"Partition exported files by an expression","why":"The clause controls unload file organization.","trap":"It does not change native Snowflake table micro-partitions.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-location","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp276"},{"domain":"loading","objective":"3.1","tag":"Directory tables","front":"What does DIRECTORY=(ENABLE=TRUE) create on a stage?","back":"Directory table with staged-file metadata","why":"Directory tables catalog files for unstructured-data workflows.","trap":"Enabling the directory does not guarantee automatic refresh on every stage type.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-dirtables","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp277"},{"domain":"loading","objective":"3.1","tag":"Directory tables","front":"Which command manually refreshes a directory table?","back":"ALTER STAGE ... REFRESH","why":"Refresh loads updated cloud-file listings into directory-table metadata.","trap":"ALTER EXTERNAL TABLE ... REFRESH is for external tables.","code":"ALTER STAGE docs_stage REFRESH;","doc":"https://docs.snowflake.com/en/user-guide/data-load-dirtables","priority":3,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp278"},{"domain":"loading","objective":"3.1","tag":"Metadata","front":"Which metadata column shows staged source filename?","back":"METADATA$FILENAME","why":"Staged-file metadata helps establish data lineage and debug ingestion.","trap":"FILE_ROW_NUMBER identifies record position instead.","code":"","doc":"https://docs.snowflake.com/en/user-guide/querying-metadata","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp279"},{"domain":"loading","objective":"3.1","tag":"Metadata","front":"Which metadata column identifies the row number within staged file?","back":"METADATA$FILE_ROW_NUMBER","why":"The pseudocolumn tracks record order within a staged file where supported.","trap":"It is not the destination table row number.","code":"","doc":"https://docs.snowflake.com/en/user-guide/querying-metadata","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp280"},{"domain":"loading","objective":"3.1","tag":"Error history","front":"Which table function validates errors from an earlier COPY job?","back":"VALIDATE(table, JOB_ID=>...)","why":"The table function inspects historical load errors from a prior COPY job.","trap":"Not a replacement for validating all newly arrived files.","code":"SELECT * FROM TABLE(VALIDATE(orders, JOB_ID=>'_last'));","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp281"},{"domain":"loading","objective":"3.1","tag":"Error history","front":"Which function reports recent table file load history?","back":"COPY_HISTORY","why":"Load history exposes statuses including PARTIALLY_LOADED in supported contexts.","trap":"It is not the same as QUERY_HISTORY.","code":"","doc":"https://docs.snowflake.com/en/user-guide/querying-metadata","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp282"},{"domain":"loading","objective":"3.2","tag":"Snowpipe","front":"What does Snowpipe AUTO_INGEST require beyond stage access?","back":"Configured cloud event notifications","why":"Event notifications tell Snowpipe about arriving files.","trap":"Auto-ingest is not an S3 bucket scan on every query.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-snowpipe-intro","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp283"},{"domain":"loading","objective":"3.2","tag":"Snowpipe","front":"What Snowflake object defines an ongoing staged-file loading pipeline?","back":"Pipe","why":"A pipe stores a COPY statement with Snowpipe-compatible options.","trap":"A task is a separate scheduling primitive.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/create-pipe","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp284"},{"domain":"loading","objective":"3.2","tag":"Snowpipe","front":"Can classic Snowpipe be assigned to your BI virtual warehouse?","back":"No","why":"Classic Snowpipe uses Snowflake-managed loading compute.","trap":"Scheduled bulk COPY INTO uses a selected customer-managed warehouse.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-snowpipe-intro","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp285"},{"domain":"loading","objective":"3.2","tag":"Snowpipe Streaming","front":"Which approach accepts events without files being staged first?","back":"Snowpipe Streaming","why":"The streaming service accepts events via supported APIs/connectors.","trap":"Classic Snowpipe ingests staged files.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-snowpipe-streaming-overview","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp286"},{"domain":"loading","objective":"3.2","tag":"Streams","front":"What exactly does a Snowflake stream store?","back":"An offset and change-tracking metadata","why":"Streams expose changes recorded in the underlying source object, not an independent data copy.","trap":"A SELECT alone does not advance offset.","code":"","doc":"https://docs.snowflake.com/en/user-guide/streams-intro","priority":3,"kind":"reca
