<script>const CARD_BANK=[{"id":"sp001","domain":"loading","tag":"COPY options","front":"What COPY option previews all staged-file errors, including earlier partial loads?","back":"VALIDATION_MODE = RETURN_ALL_ERRORS","why":"Unlike RETURN_ERRORS, RETURN_ALL_ERRORS includes errors in previously partially loaded files. It validates without inserting rows.","trap":"RETURN_ERRORS is not identical to RETURN_ALL_ERRORS.","code":"COPY INTO orders FROM @s VALIDATION_MODE = RETURN_ALL_ERRORS;","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"sql","related":["RETURN_ERRORS","ON_ERROR = CONTINUE"]},{"id":"sp002","domain":"loading","tag":"COPY options","front":"Which COPY option skips bad rows but loads valid rows from the same file?","back":"ON_ERROR = CONTINUE","why":"This loads valid records and reports errors for individual invalid rows; a source file may become PARTIALLY_LOADED.","trap":"Different from SKIP_FILE, which skips the entire affected file.","code":"COPY INTO orders FROM @s ON_ERROR = CONTINUE;","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"sql","related":[]},{"id":"sp003","domain":"loading","tag":"COPY options","front":"Which COPY option rejects a file if any record fails?","back":"ON_ERROR = SKIP_FILE","why":"The entire error-containing file is skipped; other valid files may still be ingested.","trap":"ABORT_STATEMENT aborts the whole load, not just the bad file.","code":"COPY INTO orders FROM @s ON_ERROR = SKIP_FILE;","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"sql","related":[]},{"id":"sp004","domain":"loading","tag":"COPY options","front":"What is the default ON_ERROR for bulk COPY INTO?","back":"ABORT_STATEMENT","why":"A load error causes the COPY command to abort rather than silently skip invalid rows.","trap":"Do not assume CONTINUE is the default.","code":"ON_ERROR = ABORT_STATEMENT","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"recall","related":[]},{"id":"sp005","domain":"loading","tag":"COPY options","front":"Which COPY option deliberately reloads already-loaded files?","back":"FORCE = TRUE","why":"Bulk COPY normally remembers load history and skips known files; FORCE overrides this protection and can duplicate rows.","trap":"FORCE does not deduplicate target rows.","code":"COPY INTO t FROM @s FORCE = TRUE;","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"sql","related":[]},{"id":"sp006","domain":"loading","tag":"COPY options","front":"Which COPY option removes successfully loaded staged files?","back":"PURGE = TRUE","why":"PURGE requests that loaded files be deleted from the stage when the load succeeds. Cloud permissions still matter.","trap":"PURGE is not a DELETE FROM target table.","code":"COPY INTO t FROM @s PURGE = TRUE;","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"sql","related":[]},{"id":"sp007","domain":"loading","tag":"COPY options","front":"What does VALIDATION_MODE do to target-table row counts?","back":"Nothing: it validates without loading","why":"VALIDATION_MODE inspects staged files for errors but performs no data load.","trap":"Unsupported when the COPY statement transforms data during loading.","code":"COPY INTO t FROM @s VALIDATION_MODE = RETURN_ERRORS;","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"recall","related":[]},{"id":"sp008","domain":"loading","tag":"COPY options","front":"Can COPY INTO load transformations use LATERAL FLATTEN?","back":"No","why":"Snowflake does not support FLATTEN as part of the COPY INTO transformation subset. Load VARIANT first, then FLATTEN with SQL.","trap":"FLATTEN itself is valid in normal SELECT queries.","code":"SELECT f.value FROM raw, LATERAL FLATTEN(input => raw.payload:items) f;","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"recall","related":[]},{"id":"sp009","domain":"loading","tag":"COPY syntax","front":"What SQL command loads staged files into a Snowflake table?","back":"COPY INTO <table> FROM @stage","why":"The destination is a table and the source is a stage.","trap":"Reverse the direction to unload query results.","code":"COPY INTO sales FROM @s FILE_FORMAT=(TYPE=CSV);","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"sql","related":[]},{"id":"sp010","domain":"loading","tag":"COPY syntax","front":"What SQL command unloads data into files in a stage?","back":"COPY INTO @stage FROM <query/table>","why":"For unloading, the destination after INTO is a stage or cloud location.","trap":"PUT uploads local files; it does not export query results.","code":"COPY INTO @archive FROM (SELECT * FROM sales) FILE_FORMAT=(TYPE=CSV);","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"sql","related":[]},{"id":"sp011","domain":"loading","tag":"COPY syntax","front":"What does COPY INTO <location> PARTITION BY do?","back":"Partitions exported rows into different output paths/files","why":"PARTITION BY in unloading influences the generated output files, not the native table layout.","trap":"Not the same as CLUSTER BY on a Snowflake table.","code":"COPY INTO @out FROM (SELECT * FROM t) PARTITION BY (region);","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":2,"kind":"recall","related":[]},{"id":"sp012","domain":"loading","tag":"Loading architectures","front":"Large nightly files, existing warehouse, no near-real-time SLA: choose what?","back":"Scheduled bulk COPY INTO","why":"Bulk COPY fits controlled, large batches. Cost depends on real workload and warehouse use; serverless is not always cheapest.","trap":"Do not choose Snowpipe solely because it sounds cheaper.","code":"COPY INTO target FROM @nightly_stage;","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"decision","related":[]},{"id":"sp013","domain":"loading","tag":"Loading architectures","front":"Files arriving frequently with minute-level freshness: choose what?","back":"Snowpipe auto-ingest","why":"Snowpipe uses Snowflake-managed compute and cloud notifications to load newly arriving staged files.","trap":"It does not use the BI warehouse, unlike bulk COPY.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-snowpipe-intro","priority":3,"kind":"decision","related":[]},{"id":"sp014","domain":"loading","tag":"Loading architectures","front":"Direct Kafka row events, seconds latency, no staged files: choose what?","back":"Snowpipe Streaming","why":"Snowpipe Streaming ingests streaming rows with low latency through supported APIs/connectors.","trap":"Classic Snowpipe consumes files, not individual Kafka rows.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-snowpipe-intro","priority":3,"kind":"decision","related":[]},{"id":"sp015","domain":"loading","tag":"Snowpipe","front":"Who provides compute for classic Snowpipe?","back":"Snowflake-managed serverless compute","why":"You do not assign a customer-managed warehouse to a pipe; Snowflake manages ingest compute.","trap":"Separate from ordinary COPY INTO using a warehouse.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-snowpipe-intro","priority":3,"kind":"recall","related":[]},{"id":"sp016","domain":"loading","tag":"Snowpipe","front":"How is classic Snowpipe ingestion billed today?","back":"By data volume loaded (per GB)","why":"Snowpipe billing changed from the older per-file model; evaluate current credits and compute cost by actual load volume.","trap":"Avoid outdated per-file billing claims.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-snowpipe-intro","priority":3,"kind":"recall","related":[]},{"id":"sp017","domain":"loading","tag":"Snowpipe","front":"Snowpipe stopped loading one S3 prefix. What is the first check?","back":"Cloud event notifications and path/prefix filters","why":"Auto-ingest only receives the paths matched by the bucket’s notification configuration and pipe location.","trap":"A suspended BI warehouse is not a reason for serverless Snowpipe to stop.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-snowpipe-intro","priority":3,"kind":"recall","related":[]},{"id":"sp018","domain":"loading","tag":"Snowpipe","front":"Which SQL statement checks ingestion pipe status?","back":"SYSTEM$PIPE_STATUS","why":"The system function gives information about the operational status of a Snowpipe pipe.","trap":"Do not confuse with SYSTEM$EXTERNAL_TABLE_PIPE_STATUS.","code":"SELECT SYSTEM$PIPE_STATUS('MY_DB.MY_SCHEMA.MY_PIPE');","doc":"https://docs.snowflake.com/en/user-guide/data-load-snowpipe-intro","priority":3,"kind":"sql","related":[]},{"id":"sp019","domain":"loading","tag":"External tables","front":"How do external tables store their row data?","back":"In external cloud storage, not imported native storage","why":"External tables store metadata that references files, providing read-only SQL access to their contents.","trap":"Do not confuse external tables with writable Iceberg tables.","code":"","doc":"https://docs.snowflake.com/en/user-guide/tables-external-intro","priority":3,"kind":"recall","related":[]},{"id":"sp020","domain":"loading","tag":"External tables","front":"How are external table file listings updated?","back":"Metadata refresh, manual or cloud-event driven","why":"ALTER EXTERNAL TABLE ... REFRESH updates file metadata; supported cloud notifications can enable auto refresh.","trap":"New files are not automatically visible without metadata being updated.","code":"ALTER EXTERNAL TABLE ext_sales REFRESH;","doc":"https://docs.snowflake.com/en/user-guide/tables-external-intro","priority":3,"kind":"sql","related":[]},{"id":"sp021","domain":"loading","tag":"External tables","front":"Which external table pseudocolumn contains the source file path?","back":"METADATA$FILENAME","why":"This identifies the file source associated with a row in supported stage/external-table contexts.","trap":"METADATA$FILE_ROW_NUMBER is the row position, not the filename.","code":"SELECT METADATA$FILENAME FROM ext_sales;","doc":"https://docs.snowflake.com/en/user-guide/tables-external-intro","priority":3,"kind":"sql","related":[]},{"id":"sp022","domain":"loading","tag":"External tables","front":"Which external-table pseudocolumn holds the row value?","back":"VALUE","why":"External tables expose a VALUE variant field containing a row representation from external files.","trap":"METADATA$FILENAME is not the record body.","code":"SELECT VALUE FROM ext_sales;","doc":"https://docs.snowflake.com/en/user-guide/tables-external-intro","priority":2,"kind":"sql","related":[]},{"id":"sp023","domain":"loading","tag":"External tables","front":"Which Snowflake function is used for external table auto-refresh pipe status?","back":"SYSTEM$EXTERNAL_TABLE_PIPE_STATUS","why":"This function provides information about the pipe that supports automatic metadata refresh for an external table.","trap":"It is distinct from SYSTEM$PIPE_STATUS for a named Snowpipe.","code":"","doc":"https://docs.snowflake.com/en/user-guide/tables-external-intro","priority":3,"kind":"sql","related":[]},{"id":"sp024","domain":"loading","tag":"External tables","front":"Can UPDATE/DELETE modify an ordinary external table’s cloud files?","back":"No; ordinary external tables are read-only","why":"External-table metadata points to files that Snowflake queries rather than owns for regular DML.","trap":"Iceberg tables have different DML capabilities.","code":"","doc":"https://docs.snowflake.com/en/user-guide/tables-external-intro","priority":3,"kind":"recall","related":[]},{"id":"sp025","domain":"loading","tag":"File formats","front":"What JSON format option splits a top-level JSON array into rows?","back":"STRIP_OUTER_ARRAY = TRUE","why":"If a file is one outer array containing objects, the loader can treat array elements as separate records.","trap":"Different from STRIP_NULL_VALUES.","code":"CREATE FILE FORMAT jf TYPE=JSON STRIP_OUTER_ARRAY=TRUE;","doc":"https://docs.snowflake.com/en/sql-reference/sql/create-file-format","priority":3,"kind":"sql","related":[]},{"id":"sp026","domain":"loading","tag":"File formats","front":"Which CSV setting skips the first line of a file?","back":"SKIP_HEADER = 1","why":"SKIP_HEADER is a CSV file format setting to skip lines at the start of each file.","trap":"It does not parse JSON arrays.","code":"FILE_FORMAT=(TYPE=CSV SKIP_HEADER=1)","doc":"https://docs.snowflake.com/en/sql-reference/sql/create-file-format","priority":3,"kind":"sql","related":[]},{"id":"sp027","domain":"loading","tag":"File formats","front":"Which CSV setting allows commas inside quoted fields?","back":"FIELD_OPTIONALLY_ENCLOSED_BY","why":"Set this to a supported quote character, e.g. double quotes, so delimiters within quoted text are parsed as field content.","trap":"Does not control compression or skipping headers.","code":"FILE_FORMAT=(TYPE=CSV FIELD_OPTIONALLY_ENCLOSED_BY='\"')","doc":"https://docs.snowflake.com/en/sql-reference/sql/create-file-format","priority":3,"kind":"sql","related":[]},{"id":"sp028","domain":"loading","tag":"File formats","front":"How do you reuse parsing options across many COPY jobs?","back":"Create a named file format","why":"CREATE FILE FORMAT stores delimiter, encoding, quote and compression settings as a reusable object.","trap":"Different from STORAGE INTEGRATION, which authorizes cloud access.","code":"CREATE FILE FORMAT my_csv TYPE=CSV SKIP_HEADER=1;","doc":"https://docs.snowflake.com/en/sql-reference/sql/create-file-format","priority":2,"kind":"sql","related":[]},{"id":"sp029","domain":"loading","tag":"Stage notation","front":"Which internal stage reference means “my user stage”?","back":"@~","why":"Every Snowflake user has a user stage. A stage is not a table; files must still be loaded for native storage.","trap":"@%orders refers to an orders table stage.","code":"LIST @~;","doc":"https://docs.snowflake.com/en/user-guide/data-load-overview","priority":3,"kind":"sql","related":[]},{"id":"sp030","domain":"loading","tag":"Stage notation","front":"Which internal stage reference means a specific table’s stage?","back":"@%table_name","why":"Snowflake provisions a table stage associated with each table, referenced with @%.","trap":"A named stage is @stage_name.","code":"LIST @%orders;","doc":"https://docs.snowflake.com/en/user-guide/data-load-overview","priority":3,"kind":"sql","related":[]},{"id":"sp031","domain":"loading","tag":"Stage notation","front":"Which command uploads a local file to an internal stage?","back":"PUT","why":"PUT sends a file from a local client to a Snowflake internal stage in supported clients.","trap":"GET downloads files; both have client restrictions.","code":"PUT file:///tmp/orders.csv @~;","doc":"https://docs.snowflake.com/en/user-guide/data-load-overview","priority":3,"kind":"sql","related":[]},{"id":"sp032","domain":"loading","tag":"Stage notation","front":"Which command downloads an internal-stage file to a local machine?","back":"GET","why":"GET downloads staged files to a local filesystem from supported clients.","trap":"COPY INTO @stage unloads table/query data to stage; GET downloads the files.","code":"GET @my_stage file:///tmp/out/;","doc":"https://docs.snowflake.com/en/user-guide/data-load-overview","priority":3,"kind":"sql","related":[]},{"id":"sp033","domain":"loading","tag":"Storage integration","front":"External S3 stage references integration S3_INT with which property?","back":"STORAGE_INTEGRATION = S3_INT","why":"External stages can use integration objects to avoid embedded long-lived credentials.","trap":"INTEGRATION= is not the correct stage clause.","code":"CREATE STAGE raw_s3 URL='s3://bucket/path/' STORAGE_INTEGRATION=S3_INT;","doc":"https://docs.snowflake.com/en/user-guide/data-load-overview","priority":3,"kind":"sql","related":[]},{"id":"sp034","domain":"loading","tag":"Storage integration","front":"Why is an AWS external ID needed in an IAM trust relationship?","back":"To mitigate the confused-deputy problem","why":"A trust policy uses the Snowflake IAM principal and external ID to ensure role assumption comes from the intended party.","trap":"It does not itself encrypt data in transit.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-overview","priority":3,"kind":"recall","related":[]},{"id":"sp035","domain":"loading","tag":"File sizing","front":"Why split a single giant compressed load file into many files?","back":"Improve parallel loading across compute nodes","why":"Multiple files can be processed concurrently; one enormous unsplittable file limits parallelism.","trap":"Official sizing guidance is roughly 100–250 MB or larger compressed, workload-dependent.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"recall","related":[]},{"id":"sp036","domain":"loading","tag":"Validation","front":"Which table function inspects a previous COPY job’s load errors?","back":"VALIDATE(table, JOB_ID => ...)","why":"VALIDATE examines errors associated with a previous load job, unlike staged-file VALIDATION_MODE.","trap":"It is not a way to validate newly arrived files without a job.","code":"SELECT * FROM TABLE(VALIDATE(orders, JOB_ID => '_last'));","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"sql","related":[]},{"id":"sp037","domain":"loading","tag":"Load history","front":"Where can you inspect recent COPY load statuses?","back":"COPY_HISTORY","why":"COPY_HISTORY exposes information about file loads and statuses such as PARTIALLY_LOADED.","trap":"QUERY_HISTORY and COPY_HISTORY answer different questions.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":2,"kind":"recall","related":[]},{"id":"sp038","domain":"loading","tag":"Semi-structured","front":"Which function expands a VARIANT array into relational rows?","back":"LATERAL FLATTEN","why":"The table function emits one row per nested array element while preserving access to parent row columns.","trap":"Allowed in SELECT; not inside COPY transformation.","code":"SELECT t.id, f.value FROM t, LATERAL FLATTEN(input=>t.payload:items) f;","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"sql","related":[]},{"id":"sp039","domain":"loading","tag":"Semi-structured","front":"Which function converts JSON-formatted VARCHAR text into VARIANT?","back":"PARSE_JSON","why":"PARSE_JSON parses the string into semi-structured Snowflake data for path extraction.","trap":"TO_JSON does the reverse: VARIANT to JSON text.","code":"SELECT PARSE_JSON('{\"a\":1}'):a;","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":3,"kind":"sql","related":[]},{"id":"sp040","domain":"loading","tag":"Semi-structured","front":"Which function changes VARIANT JSON null into SQL NULL?","back":"STRIP_NULL_VALUE","why":"Snowflake distinguishes JSON null inside VARIANT from SQL NULL; STRIP_NULL_VALUE converts the former.","trap":"IS_NULL_VALUE tests JSON null rather than transforming it.","code":"SELECT STRIP_NULL_VALUE(PARSE_JSON('null'));","doc":"https://docs.snowflake.com/en/sql-reference/sql/copy-into-table","priority":2,"kind":"sql","related":[]},{"id":"sp041","domain":"architecture","tag":"Core layers","front":"Which Snowflake layer compiles and optimizes SQL?","back":"Cloud Services","why":"Cloud Services manages SQL parsing, optimization, metadata, access control and coordination.","trap":"Virtual warehouses execute data processing.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":3,"kind":"recall","related":[]},{"id":"sp042","domain":"architecture","tag":"Core layers","front":"Which Snowflake layer holds immutable micro-partitions?","back":"Database Storage layer","why":"Durable Snowflake table data is stored in encrypted, compressed columnar micro-partitions, separate from warehouses.","trap":"Warehouse SSDs are cache, not the durable storage layer.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":3,"kind":"recall","related":[]},{"id":"sp043","domain":"architecture","tag":"Core layers","front":"Which layer actually executes joins and aggregations?","back":"Virtual Warehouse compute","why":"Warehouse compute reads data and executes operations, while Cloud Services compiles and coordinates.","trap":"Metadata services are not the heavy query execution engine.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":3,"kind":"recall","related":[]},{"id":"sp044","domain":"architecture","tag":"Warehouses","front":"Best way to isolate heavy ETL from BI query contention?","back":"Separate virtual warehouses","why":"Independent warehouses share underlying Snowflake data but isolate compute resources.","trap":"Separate databases alone do not guarantee compute isolation.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":3,"kind":"recall","related":[]},{"id":"sp045","domain":"architecture","tag":"Warehouses","front":"What is the principal purpose of multi-cluster warehouses?","back":"Handle concurrent queries and reduce queuing","why":"Additional clusters handle separate workloads/queries concurrently, not necessarily one slow query.","trap":"Scale up a warehouse for single-query memory pressure.","code":"","doc":"https://docs.snowflake.com/en/user-guide/warehouses-multicluster","priority":3,"kind":"recall","related":[]},{"id":"sp046","domain":"architecture","tag":"Warehouses","front":"What happens to warehouse local data cache on suspend?","back":"It is lost","why":"The warehouse compute instances and their SSD cache disappear on suspension.","trap":"The persisted result cache is independent of warehouse suspension.","code":"","doc":"https://docs.snowflake.com/en/user-guide/querying-persisted-results","priority":3,"kind":"recall","related":[]},{"id":"sp047","domain":"architecture","tag":"Query result cache","front":"Can eligible cached query results be returned while the warehouse is suspended?","back":"Yes","why":"Persisted query results can be served without running warehouse compute when reuse criteria are met.","trap":"A changing underlying table can invalidate eligibility.","code":"","doc":"https://docs.snowflake.com/en/user-guide/querying-persisted-results","priority":3,"kind":"recall","related":[]},{"id":"sp048","domain":"architecture","tag":"Query result cache","front":"How long can an eligible persisted result be reused initially?","back":"24 hours","why":"Snowflake persists query results for 24 hours initially and reuse can extend availability under stated limits.","trap":"Do not confuse with warehouse local cache lifetime.","code":"","doc":"https://docs.snowflake.com/en/user-guide/querying-persisted-results","priority":3,"kind":"recall","related":[]},{"id":"sp049","domain":"architecture","tag":"Micro-partitions","front":"Can Snowflake micro-partitions be updated in place?","back":"No; they are immutable","why":"UPDATE and DELETE create replacement micro-partitions while old versions remain subject to retention rules.","trap":"No manual VACUUM required for ordinary native tables.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":3,"kind":"recall","related":[]},{"id":"sp050","domain":"architecture","tag":"Micro-partitions","front":"How does Snowflake skip unrelated storage blocks in a filtered query?","back":"Micro-partition pruning","why":"The optimizer uses micro-partition metadata such as min/max value ranges to skip irrelevant partitions.","trap":"Clustering can improve pruning but is not always necessary.","code":"","doc":"https://docs.snowflake.com/en/user-guide/tables-clustering-keys","priority":3,"kind":"recall","related":[]},{"id":"sp051","domain":"architecture","tag":"Time Travel","front":"Which feature lets you UNDROP a recently dropped table yourself?","back":"Time Travel","why":"Time Travel enables querying/restoring prior table states within configured retention; UNDROP is self-service SQL.","trap":"Fail-safe is Snowflake-managed recovery, not a user UNDROP command.","code":"UNDROP TABLE orders;","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":3,"kind":"sql","related":[]},{"id":"sp052","domain":"architecture","tag":"Fail-safe","front":"Can a customer issue SQL to recover directly from Fail-safe?","back":"No","why":"Fail-safe is a Snowflake-managed emergency recovery period, not an ordinary queryable historical period.","trap":"Time Travel is for normal customer-directed restoration.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":3,"kind":"recall","related":[]},{"id":"sp053","domain":"architecture","tag":"Table types","front":"Need cross-session persistence without Fail-safe: which table type?","back":"TRANSIENT","why":"Transient tables persist until dropped but omit Fail-safe and have limited Time Travel options.","trap":"Temporary tables are session-scoped.","code":"CREATE TRANSIENT TABLE stage_data(id INT);","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":3,"kind":"sql","related":[]},{"id":"sp054","domain":"architecture","tag":"Table types","front":"Which table type disappears when its creating session ends?","back":"TEMPORARY","why":"Temporary tables are scoped to a session and are removed when that session ends.","trap":"TRANSIENT persists beyond the session.","code":"CREATE TEMP TABLE temp_load(id INT);","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":3,"kind":"sql","related":[]},{"id":"sp055","domain":"architecture","tag":"Zero-copy clone","front":"Why is CREATE TABLE ... CLONE fast and storage-efficient initially?","back":"Shares existing micro-partition references","why":"Zero-copy clones initially reference existing storage; new storage appears as source/clone diverge.","trap":"A clone is writable, not just a view.","code":"CREATE TABLE sandbox CLONE prod_table;","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":3,"kind":"sql","related":[]},{"id":"sp056","domain":"architecture","tag":"Iceberg","front":"Which Snowflake table type offers open-format interoperability and DML?","back":"Apache Iceberg table","why":"Snowflake Iceberg tables use open table format metadata while supporting writes in supported configurations.","trap":"An ordinary external table is read-only.","code":"","doc":"https://docs.snowflake.com/en/user-guide/tables-iceberg","priority":3,"kind":"recall","related":[]},{"id":"sp057","domain":"architecture","tag":"Iceberg","front":"What object connects an Iceberg table to external cloud storage?","back":"EXTERNAL VOLUME","why":"An external volume defines access and storage locations for Iceberg data/metadata files in customer-managed cloud storage.","trap":"Storage integrations typically support external stages.","code":"","doc":"https://docs.snowflake.com/en/user-guide/tables-iceberg","priority":3,"kind":"recall","related":[]},{"id":"sp058","domain":"architecture","tag":"Iceberg","front":"What is the role of a catalog integration for Iceberg?","back":"Connect Snowflake to an external Iceberg catalog","why":"Catalog integrations coordinate table metadata/catalog operations; storage location is a separate concern.","trap":"Do not confuse catalog integration with external volume.","code":"","doc":"https://docs.snowflake.com/en/user-guide/tables-iceberg","priority":3,"kind":"recall","related":[]},{"id":"sp059","domain":"architecture","tag":"Dynamic tables","front":"Which object maintains a SELECT transformation based on TARGET_LAG?","back":"Dynamic table","why":"Dynamic tables declaratively maintain transformations and schedule refreshes using target lag.","trap":"Standard views do not materialize data by target lag.","code":"CREATE DYNAMIC TABLE dt TARGET_LAG='15 minutes' WAREHOUSE=wh AS SELECT ...;","doc":"https://docs.snowflake.com/en/user-guide/dynamic-tables-about","priority":3,"kind":"sql","related":[]},{"id":"sp060","domain":"architecture","tag":"Streams","front":"When does a stream offset advance after DML consumption?","back":"On successful transaction commit","why":"A failed/rolled-back transaction does not consume the stream offset.","trap":"SELECT alone does not advance a stream.","code":"","doc":"https://docs.snowflake.com/en/user-guide/streams-intro","priority":3,"kind":"recall","related":[]},{"id":"sp061","domain":"architecture","tag":"Tasks","front":"What coordinates scheduled, ordered SQL transformations?","back":"Tasks / task graphs","why":"Tasks run SQL or stored procedures on schedules/triggers and can form dependency graphs.","trap":"Pipes handle staged-file ingestion, not arbitrary SQL orchestration.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":3,"kind":"recall","related":[]},{"id":"sp062","domain":"architecture","tag":"Tasks","front":"Which scheduled task type needs no user-selected warehouse?","back":"Serverless task","why":"A serverless task uses Snowflake-managed compute instead of a WAREHOUSE clause.","trap":"Snowpipe is not a general-purpose SQL task scheduler.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":2,"kind":"recall","related":[]},{"id":"sp063","domain":"architecture","tag":"Cortex","front":"Natural language question over sales tables → SQL: which feature?","back":"Cortex Analyst","why":"Cortex Analyst supports NL-to-SQL over structured data using semantic definitions.","trap":"Cortex Search retrieves text for RAG.","code":"","doc":"https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-analyst","priority":3,"kind":"recall","related":[]},{"id":"sp064","domain":"architecture","tag":"Cortex","front":"Semantic retrieval over support PDFs for RAG: which feature?","back":"Cortex Search","why":"Cortex Search builds managed retrieval over text content, helping ground generated answers.","trap":"Cortex Analyst is for natural language over structured SQL datasets.","code":"","doc":"https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-analyst","priority":3,"kind":"recall","related":[]},{"id":"sp065","domain":"architecture","tag":"Snowflake ML","front":"Which Snowflake component manages trained model versions and inference methods?","back":"Model Registry","why":"Snowflake Model Registry stores and manages model versions and registered methods for inference.","trap":"Different from pretrained Cortex AI functions.","code":"","doc":"https://docs.snowflake.com/en/developer-guide/snowflake-ml/model-registry/overview","priority":3,"kind":"recall","related":[]},{"id":"sp066","domain":"architecture","tag":"Snowpark","front":"Where do supported Snowpark DataFrame transformations run?","back":"In Snowflake compute","why":"Snowpark builds plans that execute within Snowflake rather than exporting all table rows to the client.","trap":"DataFrame construction can be lazy until an action.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":2,"kind":"recall","related":[]},{"id":"sp067","domain":"architecture","tag":"UDF","front":"Which programmable object can be called as a scalar SELECT expression?","back":"Scalar UDF","why":"UDFs return a value for SQL expressions; procedures support multi-statement operations invoked with CALL.","trap":"Do not use stored procedures as drop-in scalar expressions.","code":"SELECT normalize_email(email) FROM customers;","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":2,"kind":"sql","related":[]},{"id":"sp068","domain":"architecture","tag":"Directories","front":"What does DIRECTORY=(ENABLE=TRUE) on a stage enable?","back":"A directory table","why":"Directory tables expose staged file path/metadata information for SQL discovery.","trap":"Enabling alone does not ensure auto-refresh notifications.","code":"CREATE STAGE docs DIRECTORY=(ENABLE=TRUE);","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":2,"kind":"sql","related":[]},{"id":"sp069","domain":"architecture","tag":"File URLs","front":"Which function builds a scoped file URL to a staged file?","back":"BUILD_SCOPED_FILE_URL","why":"Scoped URLs provide controlled time/query-context-based access to staged files.","trap":"BUILD_STAGE_FILE_URL produces a different, stage-based file URL.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":2,"kind":"recall","related":[]},{"id":"sp070","domain":"architecture","tag":"Editions","front":"Minimum edition for Tri-Secret Secure?","back":"Business Critical","why":"Tri-Secret Secure combines Snowflake- and customer-managed keys and is a Business Critical feature.","trap":"Periodic rekeying has a different edition requirement.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":3,"kind":"recall","related":[]},{"id":"sp071","domain":"architecture","tag":"Editions","front":"Minimum edition for periodic rekeying?","back":"Enterprise","why":"Periodic rekeying is an Enterprise-and-higher feature per Snowflake’s edition matrix.","trap":"Some third-party mocks incorrectly say Business Critical.","code":"","doc":"https://docs.snowflake.com/en/user-guide/intro-key-concepts","priority":3,"kind":"recall","related":[]},{"id":"sp072","domain":"governance","tag":"RBAC","front":"GRANT ROLE ANALYST TO ROLE MANAGER: who inherits whom?","back":"MANAGER inherits ANALYST","why":"Privileges flow from a child/granted role upward to the receiving parent role.","trap":"Reversing the direction is a common exam trap.","code":"GRANT ROLE ANALYST TO ROLE MANAGER;","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"sql","related":[]},{"id":"sp073","domain":"governance","tag":"RBAC","front":"Table SELECT exists, database USAGE exists, but access denied: likely missing?","back":"USAGE on the schema","why":"Snowflake object access normally requires privileges on the table and enclosing database and schema.","trap":"Table SELECT alone does not guarantee schema access.","code":"GRANT USAGE ON SCHEMA db.s TO ROLE reporter;","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"sql","related":[]},{"id":"sp074","domain":"governance","tag":"RBAC","front":"Which privilege lets a role run SQL on a warehouse?","back":"USAGE ON WAREHOUSE","why":"USAGE permits the role to use warehouse compute. MODIFY or OPERATE is for warehouse management.","trap":"USAGE on database/schema/table is separately necessary.","code":"GRANT USAGE ON WAREHOUSE wh TO ROLE analyst;","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"sql","related":[]},{"id":"sp075","domain":"governance","tag":"RBAC","front":"What global privilege allows broad administration of grants?","back":"MANAGE GRANTS","why":"MANAGE GRANTS lets a role manage grants without owning each object.","trap":"MONITOR USAGE is not grant administration.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"recall","related":[]},{"id":"sp076","domain":"governance","tag":"RBAC","front":"Which role is intended for account data objects and warehouses?","back":"SYSADMIN","why":"SYSADMIN is the standard built-in role for managing databases, schemas, tables and warehouses.","trap":"SECURITYADMIN focuses on grants/roles.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"recall","related":[]},{"id":"sp077","domain":"governance","tag":"RBAC","front":"Which built-in role focuses on security grants and roles?","back":"SECURITYADMIN","why":"SECURITYADMIN manages access; USERADMIN is an inherited role for creating users and roles.","trap":"Use ACCOUNTADMIN sparingly.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"recall","related":[]},{"id":"sp078","domain":"governance","tag":"RBAC","front":"Who manages Snowflake accounts across an organization?","back":"ORGADMIN","why":"ORGADMIN is organization-level rather than per-account object management.","trap":"ACCOUNTADMIN is specific to an individual account.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":2,"kind":"recall","related":[]},{"id":"sp079","domain":"governance","tag":"RBAC","front":"How can a role automatically SELECT tables created later in one schema?","back":"Future grants","why":"Future grants apply designated privileges to new matching objects as they are created.","trap":"Existing object grants do not automatically cover future tables.","code":"GRANT SELECT ON FUTURE TABLES IN SCHEMA db.s TO ROLE r;","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"sql","related":[]},{"id":"sp080","domain":"governance","tag":"RBAC","front":"Who controls object grants in a managed access schema?","back":"Schema owner or MANAGE GRANTS role","why":"Managed access centralizes grants and restricts ordinary object owners from independently granting privileges.","trap":"Different from a regular schema’s ownership privileges.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":2,"kind":"recall","related":[]},{"id":"sp081","domain":"governance","tag":"Masking","front":"Which policy changes sensitive column values by role?","back":"Masking policy","why":"Dynamic Data Masking applies a policy to a column, returning redacted or original values based on conditions.","trap":"Row access policies filter rows, not individual field values.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"recall","related":[]},{"id":"sp082","domain":"governance","tag":"Row policies","front":"Which policy filters which table rows are visible?","back":"Row access policy","why":"Row access policies apply a predicate controlling row visibility at query time.","trap":"Column masking is a separate mechanism.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"recall","related":[]},{"id":"sp083","domain":"governance","tag":"Masking","front":"What function checks whether an account role is active in the session hierarchy?","back":"IS_ROLE_IN_SESSION","why":"Role membership can include inherited/secondary roles; this is more complete than CURRENT_ROLE for many policy checks.","trap":"CURRENT_ROLE returns primary active role, not all hierarchy membership.","code":"IS_ROLE_IN_SESSION('DATA_STEWARD')","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"sql","related":[]},{"id":"sp084","domain":"governance","tag":"Masking","front":"Tag created + masking policy created, but still unmasked: what was omitted?","back":"Associate the masking policy with the tag","why":"Tag-based masking requires an explicit policy association; tags alone provide metadata/classification.","trap":"A tag is not automatically an enforcement mechanism.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"recall","related":[]},{"id":"sp085","domain":"governance","tag":"Security","front":"Which policy restricts access from disallowed IP ranges?","back":"Network policy","why":"Network policies block connection origins using allowed/blocked IP or network rules.","trap":"Authentication policies govern login methods, not source IP ranges.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"recall","related":[]},{"id":"sp086","domain":"governance","tag":"Security","front":"Which policy controls permitted methods such as password versus SSO?","back":"Authentication policy","why":"Authentication policies govern allowed authentication methods and related controls.","trap":"Different from Network Policies that regulate network origin.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":2,"kind":"recall","related":[]},{"id":"sp087","domain":"governance","tag":"Security","front":"What is federated authentication for Snowflake?","back":"Identity provider authenticates; Snowflake authorizes","why":"SSO can delegate proving identity to an IdP while Snowflake RBAC still grants object permissions.","trap":"Authentication and authorization are not the same.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":2,"kind":"recall","related":[]},{"id":"sp088","domain":"governance","tag":"Audit","front":"Which Account Usage view tracks accessed objects and columns?","back":"ACCESS_HISTORY","why":"ACCESS_HISTORY exposes accessed objects and columns useful for governance and lineage investigations.","trap":"QUERY_HISTORY is centered on query executions and metrics.","code":"SELECT * FROM SNOWFLAKE.ACCOUNT_USAGE.ACCESS_HISTORY;","doc":"https://docs.snowflake.com/en/sql-reference/account-usage","priority":3,"kind":"sql","related":[]},{"id":"sp089","domain":"governance","tag":"Audit","front":"Which Account Usage view shows SQL runtime, status, and history?","back":"QUERY_HISTORY","why":"ACCOUNT_USAGE.QUERY_HISTORY is account-wide historical execution metadata; it may have reporting latency.","trap":"Not a substitute for column-level access auditing.","code":"SELECT * FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY;","doc":"https://docs.snowflake.com/en/sql-reference/account-usage","priority":3,"kind":"sql","related":[]},{"id":"sp090","domain":"governance","tag":"Audit","front":"Which schema offers database-scoped, mostly current object metadata?","back":"INFORMATION_SCHEMA","why":"INFORMATION_SCHEMA is database scoped and subject to visibility/privileges.","trap":"ACCOUNT_USAGE provides broader historical account reports with latency.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/account-usage","priority":2,"kind":"recall","related":[]},{"id":"sp091","domain":"governance","tag":"Tags","front":"What can object tags accomplish besides data classification?","back":"Cost attribution / resource grouping","why":"Tags can label objects by cost center, application or sensitivity, supporting governance and usage analysis.","trap":"Tags alone do not mask data without policy linkage.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":2,"kind":"recall","related":[]},{"id":"sp092","domain":"governance","tag":"Retention","front":"Can a permanent Enterprise table configure more than one day of Time Travel?","back":"Yes, up to 90 days","why":"Enterprise+ supports configurable retention up to 90 days on eligible permanent tables.","trap":"Transient/temporary table retention rules differ.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"recall","related":[]},{"id":"sp093","domain":"governance","tag":"Session roles","front":"What is the difference between CURRENT_ROLE and IS_ROLE_IN_SESSION?","back":"Primary role vs membership in active role hierarchy","why":"CURRENT_ROLE names the primary role; IS_ROLE_IN_SESSION tests whether the named account role is active in the session.","trap":"Masks based only on CURRENT_ROLE can miss inherited role contexts.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"recall","related":[]},{"id":"sp094","domain":"governance","tag":"Governance","front":"Can a consumer SELECT through a secure view without seeing its definition?","back":"Yes","why":"Secure views obscure sensitive query logic from non-owners, while exposing authorized rows/columns.","trap":"Standard views do not provide identical definition-hiding semantics.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"recall","related":[]},{"id":"sp095","domain":"governance","tag":"Warehouse budgets","front":"Which feature can suspend warehouses at credit thresholds?","back":"Resource monitor","why":"Resource monitors support threshold alerts and suspension actions for user-managed warehouse credit usage.","trap":"They do not cap every class of serverless billing.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":2,"kind":"recall","related":[]},{"id":"sp096","domain":"governance","tag":"Identifier rules","front":"Unquoted Snowflake identifiers normally resolve in which case?","back":"UPPERCASE","why":"Unquoted names normalize to uppercase; double-quoted identifiers preserve exact case by default.","trap":"Quoted mixed case must be referenced with exact case.","code":"CREATE TABLE orders(id INT); -- ORDERS","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":2,"kind":"sql","related":[]},{"id":"sp097","domain":"governance","tag":"Encrypted data","front":"Does Snowflake encrypt data at rest automatically?","back":"Yes","why":"Snowflake provides encryption at rest by default; customer-controlled key features are optional and edition-dependent.","trap":"Tri-Secret Secure is not required for baseline encryption.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":2,"kind":"recall","related":[]},{"id":"sp098","domain":"governance","tag":"Role checks","front":"What must be enabled to let a role use a table and run a query?","back":"Warehouse USAGE + DB/schema USAGE + object SELECT","why":"RBAC has separate gates for compute and reading the data object.","trap":"Granting ACCOUNTADMIN for convenience is not least privilege.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":3,"kind":"recall","related":[]},{"id":"sp099","domain":"governance","tag":"Data protection","front":"For regional row filtering AND email redaction, choose which policies?","back":"Row access + masking","why":"Use row access for geographic restriction and masking for sensitive column values.","trap":"One policy does not automatically replace the other.","code":"","doc":"https://docs.snowflake.com/en/user-guide/security-access-control-overview","priority":2,"kind":"recall","related":[]},{"id":"sp100","domain":"performance","tag":"Query performance","front":"Single long join spilling to remote disk: scale up or out?","back":"Scale UP","why":"Remote spill suggests memory pressure for an individual query; a larger warehouse can provide resources per query.","trap":"Multiple clusters target concurrency, not one heavy query.","code":"","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":3,"kind":"decision","related":[]},{"id":"sp101","domain":"performance","tag":"Query performance","front":"Hundreds of small queries queue at 9 a.m.: scale up or out?","back":"Scale OUT with multi-cluster","why":"Additional clusters can handle concurrent queries, reducing queue time.","trap":"Single-query compute may already be sufficient.","code":"","doc":"https://docs.snowflake.com/en/user-guide/warehouses-multicluster","priority":3,"kind":"decision","related":[]},{"id":"sp102","domain":"performance","tag":"Query performance","front":"Cost prioritized over queue latency: STANDARD or ECONOMY policy?","back":"ECONOMY","why":"ECONOMY multi-cluster scaling is more conservative about adding clusters to reduce credit usage.","trap":"STANDARD adds clusters sooner to minimize queuing.","code":"","doc":"https://docs.snowflake.com/en/user-guide/warehouses-multicluster","priority":3,"kind":"decision","related":[]},{"id":"sp103","domain":"performance","tag":"Query performance","front":"Latency prioritized over cost in a multi-cluster warehouse: which policy?","back":"STANDARD","why":"STANDARD favors reducing queueing delay by scaling clusters more readily.","trap":"ECONOMY may tolerate more queue time.","code":"","doc":"https://docs.snowflake.com/en/user-guide/warehouses-multicluster","priority":3,"kind":"decision","related":[]},{"id":"sp104","domain":"performance","tag":"Query performance","front":"Huge table, equality filter on scattered IDs: which optimization?","back":"Search Optimization Service","why":"SOS builds access paths for selective point lookups, trading maintenance for latency improvement.","trap":"Clustering is often better for recurring range/pruning patterns.","code":"","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":3,"kind":"decision","related":[]},{"id":"sp105","domain":"performance","tag":"Query performance","front":"Huge table, repeated date-range filters and poor pruning: which option?","back":"Clustering key","why":"Clustering reduces micro-partition overlap for common predicates, improving pruning on suitable large tables.","trap":"Clustering costs maintenance credits; not every table needs it.","code":"","doc":"https://docs.snowflake.com/en/user-guide/tables-clustering-keys","priority":3,"kind":"decision","related":[]},{"id":"sp106","domain":"performance","tag":"Query performance","front":"Repeated supported expensive aggregate on slowly changing table: which feature?","back":"Materialized view","why":"A materialized view maintains precomputed results to speed repeated compatible queries.","trap":"Dynamic tables support broader joins/transformations with target lag.","code":"","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":3,"kind":"decision","related":[]},{"id":"sp107","domain":"performance","tag":"Query performance","front":"What should you fix first if Query Profile shows CartesianJoin explosion?","back":"The JOIN predicate","why":"Missing/incorrect join predicates can multiply rows; more compute cannot correct unintended cartesian semantics.","trap":"Beware accidental many-to-many joins too.","code":"","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":3,"kind":"decision","related":[]},{"id":"sp108","domain":"performance","tag":"Query performance","front":"Which SYSTEM$ function estimates Query Acceleration benefits?","back":"SYSTEM$ESTIMATE_QUERY_ACCELERATION","why":"This function can assess eligible candidate queries for Query Acceleration Service.","trap":"QAS is not guaranteed to accelerate every query.","code":"SELECT SYSTEM$ESTIMATE_QUERY_ACCELERATION('query-id');","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":3,"kind":"sql","related":[]},{"id":"sp109","domain":"performance","tag":"Query performance","front":"Which Account Usage view identifies Query Acceleration candidates?","back":"QUERY_ACCELERATION_ELIGIBLE","why":"It provides query-level eligibility metrics useful for deciding whether QAS may help.","trap":"Do not assume every GROUP BY is eligible.","code":"","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":3,"kind":"recall","related":[]},{"id":"sp110","domain":"performance","tag":"Query performance","front":"What does BYTES_SPILLED_TO_REMOTE_STORAGE imply?","back":"Intermediate query data exceeded available memory/local resources","why":"The engine spilled intermediate working sets to remote storage, typically slowing execution.","trap":"Different from ordinary scanning of remote table storage.","code":"","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":3,"kind":"recall","related":[]},{"id":"sp111","domain":"performance","tag":"Query performance","front":"High partitions scanned despite selective filter: what might help?","back":"Improve pruning via clustering or search optimization","why":"Choose based on predicates, data size and maintenance costs; range/pruning vs equality lookup have different best options.","trap":"Do not always resize the warehouse first.","code":"","doc":"https://docs.snowflake.com/en/user-guide/tables-clustering-keys","priority":3,"kind":"recall","related":[]},{"id":"sp112","domain":"performance","tag":"Result cache","front":"What setting can disable persisted query-result reuse?","back":"USE_CACHED_RESULT = FALSE","why":"This setting can be used to separate persisted result-cache hits from actual query execution.","trap":"Warehouse local cache may still speed data scanning.","code":"ALTER SESSION SET USE_CACHED_RESULT = FALSE;","doc":"https://docs.snowflake.com/en/user-guide/querying-persisted-results","priority":2,"kind":"sql","related":[]},{"id":"sp113","domain":"performance","tag":"Query SQL","front":"What turns a semi-structured array into multiple rows in SELECT?","back":"FLATTEN + LATERAL","why":"LATERAL FLATTEN preserves parent context while emitting rows for each array element.","trap":"ARRAY_AGG combines rows into an array, the reverse direction.","code":"SELECT f.value FROM t, LATERAL FLATTEN(input => t.v:items) f;","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":3,"kind":"sql","related":[]},{"id":"sp114","domain":"performance","tag":"Query SQL","front":"What does QUALIFY filter?","back":"Results of window functions","why":"QUALIFY is evaluated after window functions, analogous to HAVING for aggregates.","trap":"WHERE cannot directly reference window function output.","code":"SELECT *, ROW_NUMBER() OVER(PARTITION BY id ORDER BY ts DESC) rn FROM t QUALIFY rn=1;","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":3,"kind":"sql","related":[]},{"id":"sp115","domain":"performance","tag":"Query SQL","front":"Which SQL constructs support hierarchical or recursive queries?","back":"WITH RECURSIVE or CONNECT BY","why":"Snowflake supports recursive CTEs and hierarchical CONNECT BY queries.","trap":"QUALIFY filters windows rather than traversing hierarchies.","code":"","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":2,"kind":"recall","related":[]},{"id":"sp116","domain":"performance","tag":"Query SQL","front":"Which function returns VARIANT as JSON-formatted VARCHAR?","back":"TO_JSON","why":"TO_JSON serializes a VARIANT; PARSE_JSON parses string text into VARIANT.","trap":"Do not confuse OBJECT_CONSTRUCT with TO_JSON.","code":"SELECT TO_JSON(PARSE_JSON('{\"x\":1}'));","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":3,"kind":"sql","related":[]},{"id":"sp117","domain":"performance","tag":"Query SQL","front":"What do type predicates (e.g., IS_ARRAY) do?","back":"Test the type of a VARIANT value","why":"They return Boolean type checks; type casts like TO_VARCHAR change representation.","trap":"Do not mistake type predicates for conversion functions.","code":"SELECT IS_ARRAY(v) FROM t;","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":2,"kind":"sql","related":[]},{"id":"sp118","domain":"performance","tag":"String functions","front":"Case-insensitive SQL wildcard matching uses what?","back":"ILIKE","why":"ILIKE supports SQL % and _ pattern syntax without case sensitivity.","trap":"LIKE is usually case-sensitive; REGEXP_LIKE uses regex syntax.","code":"WHERE name ILIKE 'Acme%'","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":3,"kind":"sql","related":[]},{"id":"sp119","domain":"performance","tag":"String functions","front":"SUBSTR(text, -2, 2) reads from which position?","back":"Two characters from the end","why":"Negative starts count backward from the end. Zero starts count as one.","trap":"A negative length returns an empty string.","code":"SELECT SUBSTR('Snowflake', -2, 2); -- ke","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":3,"kind":"sql","related":[]},{"id":"sp120","domain":"performance","tag":"String functions","front":"Does CONCAT_WS skip NULL arguments in Snowflake?","back":"No; any NULL argument gives NULL","why":"Snowflake CONCAT_WS does not skip NULL the way some other database engines do.","trap":"Use COALESCE for explicit replacements.","code":"SELECT CONCAT_WS('|','a',NULL,'b'); -- NULL","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":3,"kind":"sql","related":[]},{"id":"sp121","domain":"performance","tag":"String functions","front":"Which function gets one delimited token as a scalar?","back":"SPLIT_PART","why":"SPLIT_PART uses one-based part indexing. SPLIT returns an array; SPLIT_TO_TABLE returns rows.","trap":"The third argument is a field index, not character position.","code":"SELECT SPLIT_PART('a:b:c',':',2); -- b","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":3,"kind":"sql","related":[]},{"id":"sp122","domain":"performance","tag":"String functions","front":"Which function splits a VARCHAR into multiple SQL rows?","back":"SPLIT_TO_TABLE","why":"SPLIT_TO_TABLE emits rows with SEQ, INDEX and VALUE.","trap":"SPLIT returns an ARRAY, not separate rows.","code":"SELECT VALUE FROM TABLE(SPLIT_TO_TABLE('red,blue',','));","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":3,"kind":"sql","related":[]},{"id":"sp123","domain":"performance","tag":"String functions","front":"Which function counts characters, not UTF-8 bytes?","back":"LENGTH","why":"LENGTH measures character count; OCTET_LENGTH measures bytes. Unicode characters can occupy multiple bytes.","trap":"BIT_LENGTH returns bits, not characters.","code":"SELECT LENGTH('é'), OCTET_LENGTH('é');","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":3,"kind":"sql","related":[]},{"id":"sp124","domain":"performance","tag":"String functions","front":"Which function removes leading AND trailing spaces?","back":"TRIM","why":"TRIM removes specified characters (spaces by default) from both ends; LTRIM/RTRIM target a single side.","trap":"TRIM does not remove all interior whitespace.","code":"SELECT TRIM('  abc  '); -- abc","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":3,"kind":"sql","related":[]},{"id":"sp125","domain":"performance","tag":"String functions","front":"Which function capitalizes word beginnings?","back":"INITCAP","why":"INITCAP changes text to initial-capital word format under Snowflake’s rules.","trap":"LOWER and UPPER do not title-case words.","code":"SELECT INITCAP('hello world');","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":2,"kind":"sql","related":[]},{"id":"sp126","domain":"performance","tag":"String functions","front":"POSITION returns what kind of value?","back":"A numeric substring position","why":"POSITION/CHARINDEX finds the location of literal text; CONTAINS returns a Boolean.","trap":"Do not mix a number-returning search with CONTAINS.","code":"SELECT POSITION('flake','Snowflake');","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":3,"kind":"sql","related":[]},{"id":"sp127","domain":"performance","tag":"String functions","front":"REPLACE versus TRANSLATE: what is the distinction?","back":"Substring replacement vs character mapping","why":"REPLACE targets literal substrings, TRANSLATE maps individual characters one-to-one.","trap":"REGEXP_REPLACE uses patterns rather than literal text.","code":"SELECT REPLACE('a-b-c','-','_');","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":3,"kind":"sql","related":[]},{"id":"sp128","domain":"performance","tag":"String functions","front":"What regex function tests whether a VARCHAR matches a pattern?","back":"REGEXP_LIKE","why":"Snowflake REGEXP_LIKE uses regular expressions and implicitly anchors the pattern at both ends.","trap":"Use .* for an embedded substring.","code":"SELECT REGEXP_LIKE('abc123','.*123.*');","doc":"https://docs.snowflake.com/en/sql-reference/functions/regexp_like","priority":3,"kind":"sql","related":[]},{"id":"sp129","domain":"performance","tag":"String functions","front":"How does Snowflake REGEXP_LIKE handle an unanchored pattern?","back":"As implicitly anchored at both ends","why":"A pattern like 123 does not match the entire string abc123; add .* around the substring.","trap":"Regex is not SQL LIKE and does not use % as wildcard.","code":"REGEXP_LIKE('abc123','.*123.*')","doc":"https://docs.snowflake.com/en/sql-reference/functions/regexp_like","priority":3,"kind":"sql","related":[]},{"id":"sp130","domain":"performance","tag":"String functions","front":"What does REGEXP_REPLACE default occurrence=0 mean?","back":"Replace all matches","why":"Default occurrence=0 replaces every match; positive occurrences can target one.","trap":"Default replacement is an empty string.","code":"REGEXP_REPLACE('a1b2','[0-9]',''); -- ab","doc":"https://docs.snowflake.com/en/sql-reference/functions/regexp_like","priority":3,"kind":"sql","related":[]},{"id":"sp131","domain":"performance","tag":"String functions","front":"Which function extracts a matched substring using regex?","back":"REGEXP_SUBSTR","why":"REGEXP_SUBSTR returns matched text; REGEXP_INSTR returns match position; REGEXP_COUNT counts matches.","trap":"REGEXP_LIKE returns BOOLEAN.","code":"REGEXP_SUBSTR('ID-123','[0-9]+')","doc":"https://docs.snowflake.com/en/sql-reference/functions/regexp_like","priority":3,"kind":"sql","related":[]},{"id":"sp132","domain":"performance","tag":"String functions","front":"Which function reverses character order?","back":"REVERSE","why":"REVERSE is a string function that returns input characters in reverse order.","trap":"REVERSING is not the correct function name.","code":"SELECT REVERSE('ABC'); -- CBA","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":2,"kind":"sql","related":[]},{"id":"sp133","domain":"performance","tag":"String functions","front":"Which function pads a string on the LEFT?","back":"LPAD","why":"LPAD fills or truncates a string to the requested total length, using a pad pattern.","trap":"RPAD pads the right side.","code":"SELECT LPAD('8',3,'0'); -- 008","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":2,"kind":"sql","related":[]},{"id":"sp134","domain":"performance","tag":"String functions","front":"Which function repeats a string n times?","back":"REPEAT","why":"REPEAT returns a specified input text multiple times; SPACE creates spaces.","trap":"Do not confuse with LPAD/RPAD.","code":"SELECT REPEAT('ab',3); -- ababab","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":2,"kind":"sql","related":[]},{"id":"sp135","domain":"performance","tag":"String functions","front":"Which function returns how many regex matches occur?","back":"REGEXP_COUNT","why":"REGEXP_COUNT counts matching pattern occurrences in text.","trap":"REGEXP_INSTR returns the position of a match.","code":"SELECT REGEXP_COUNT('a1b2','[0-9]'); -- 2","doc":"https://docs.snowflake.com/en/sql-reference/functions/regexp_like","priority":3,"kind":"sql","related":[]},{"id":"sp136","domain":"performance","tag":"String functions","front":"What is the difference between STARTSWITH and CONTAINS?","back":"Prefix test vs anywhere-substring test","why":"STARTSWITH returns true only if text begins with the argument; CONTAINS matches anywhere.","trap":"ENDS WITH uses ENDSWITH, not STARTSWITH.","code":"SELECT STARTSWITH('snowflake','snow');","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":2,"kind":"sql","related":[]},{"id":"sp137","domain":"performance","tag":"String functions","front":"Which function retrieves n characters from the right?","back":"RIGHT","why":"RIGHT(text,n) gets the suffix; LEFT gets the prefix.","trap":"SUBSTR accepts a start position instead.","code":"SELECT RIGHT('ABCDEF',2); -- EF","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":2,"kind":"sql","related":[]},{"id":"sp138","domain":"performance","tag":"String functions","front":"How do you turn nonnumeric text into NULL instead of throwing?","back":"TRY_TO_NUMBER","why":"TRY_ conversion functions return NULL for invalid input, unlike strict TO_NUMBER.","trap":"Check precision/scale when working with decimals.","code":"SELECT TRY_TO_NUMBER('unknown'); -- NULL","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":3,"kind":"sql","related":[]},{"id":"sp139","domain":"performance","tag":"String functions","front":"Which function handles NULL replacement in concatenation?","back":"COALESCE","why":"COALESCE supplies a fallback for NULL, allowing CONCAT_WS to avoid NULL propagation when explicitly desired.","trap":"CONCAT_WS does not silently skip NULLs.","code":"CONCAT_WS(',',COALESCE(a,''),COALESCE(b,''))","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":3,"kind":"sql","related":[]},{"id":"sp140","domain":"performance","tag":"Query performance","front":"What is the primary advantage of materialized views over repeated full aggregation?","back":"Maintained precomputation","why":"The result is persisted and maintained, reducing repeat query work at a maintenance cost.","trap":"Not all joins or functions are allowed in materialized views.","code":"","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":2,"kind":"recall","related":[]},{"id":"sp141","domain":"performance","tag":"Query performance","front":"When should you use search optimization over clustering?","back":"Selective point lookups with poor pruning","why":"SOS supports high-selectivity lookup patterns and carries its own maintenance overhead.","trap":"Clustering is often useful for high-volume range scans.","code":"","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":3,"kind":"recall","related":[]},{"id":"sp142","domain":"sharing","tag":"Direct sharing","front":"Who pays for query compute when a normal Snowflake consumer reads a direct share?","back":"The consumer","why":"Consumers use their own warehouse to query shared data; providers retain storage responsibility for the source table.","trap":"Reader accounts are different: provider pays.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"recall","related":[]},{"id":"sp143","domain":"sharing","tag":"Direct sharing","front":"Who pays for a reader account’s warehouse usage?","back":"The provider","why":"The provider creates, owns and funds the reader account, including compute credits.","trap":"Do not apply normal consumer-billing rules to reader accounts.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"recall","related":[]},{"id":"sp144","domain":"sharing","tag":"Direct sharing","front":"Can a consumer UPDATE a provider table via direct share?","back":"No; shared databases are read-only","why":"Consumers can SELECT and build local derived tables but cannot alter the shared source.","trap":"The consumer can CTAS into its own database.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"recall","related":[]},{"id":"sp145","domain":"sharing","tag":"Direct sharing","front":"After ALTER SHARE ... ADD ACCOUNTS, what must the consumer do?","back":"CREATE DATABASE ... FROM SHARE","why":"Adding an account authorizes share visibility; the consumer must create an imported database to query it.","trap":"Authorization is not automatic materialization.","code":"CREATE DATABASE partner_data FROM SHARE org.acct.share_name;","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"sql","related":[]},{"id":"sp146","domain":"sharing","tag":"Direct sharing","front":"How can a consumer join shared data to local data and persist results?","back":"CTAS in its own writable database","why":"The SELECT can reference imported shared objects and local tables while the destination is consumer-owned.","trap":"Cannot create tables inside an imported read-only shared database.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"recall","related":[]},{"id":"sp147","domain":"sharing","tag":"Sharing security","front":"How can a provider reveal only some rows/columns without revealing view SQL?","back":"Secure view","why":"A secure view can filter/project data while protecting definition and underlying structure.","trap":"Do not share the base table if it contains fields the consumer must not see.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"recall","related":[]},{"id":"sp148","domain":"sharing","tag":"Sharing security","front":"Which SQL privilege lets a share access a secure view’s cross-database reference?","back":"REFERENCE_USAGE","why":"A secure view referencing objects in a different provider database may require REFERENCE_USAGE on that database granted to the share.","trap":"Not the same as table SELECT for the consumer.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"recall","related":[]},{"id":"sp149","domain":"sharing","tag":"Sharing roles","front":"What kind of role can be granted directly to a share?","back":"Database role","why":"A provider can GRANT DATABASE ROLE db.role TO SHARE share to encapsulate read permissions.","trap":"Account roles are not directly granted to shares.","code":"GRANT DATABASE ROLE SALES.READER TO SHARE SH_SALES;","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"sql","related":[]},{"id":"sp150","domain":"sharing","tag":"Sharing roles","front":"Can a database role granted to a share contain future grants?","back":"No","why":"Snowflake restricts the database-role privileges allowed for shares to existing read-only grant patterns.","trap":"Do not assume normal internal database-role behavior carries unchanged into shares.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"recall","related":[]},{"id":"sp151","domain":"sharing","tag":"Data collaboration","front":"Which Snowflake listing is discoverable only by specifically targeted accounts?","back":"Private listing","why":"Private listings target specified consumers and are not broadly discoverable in the public Marketplace.","trap":"A public Marketplace listing is intended for broader discovery.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":2,"kind":"recall","related":[]},{"id":"sp152","domain":"sharing","tag":"Data collaboration","front":"Which capability distributes listings to supported other regions?","back":"Cross-Cloud Auto-Fulfillment","why":"This feature helps providers deliver listing data products to supported cross-region consumers without manual fulfillment per region.","trap":"Unlike basic same-region direct sharing, cross-region fulfillment can involve replication.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":2,"kind":"recall","related":[]},{"id":"sp153","domain":"sharing","tag":"Data collaboration","front":"How is a direct share different from a traditional export?","back":"No full copy required for same-region querying","why":"Consumers query provider-managed data using their own compute; shared data remains controlled by provider.","trap":"Cross-region distributions may involve additional copies.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":2,"kind":"recall","related":[]},{"id":"sp154","domain":"sharing","tag":"Data collaboration","front":"Which feature provides a curated private sharing hub for specific member accounts?","back":"Data Exchange","why":"Data Exchanges provide controlled sharing environments with defined members; they differ from public Marketplace discovery.","trap":"Direct sharing alone is account-to-account without the same private hub organization.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":2,"kind":"recall","related":[]},{"id":"sp155","domain":"sharing","tag":"Data collaboration","front":"What does a listing provide above direct secure data sharing?","back":"Discovery, presentation and distribution workflows","why":"Listings provide a product/discovery experience to distribute governed shared data.","trap":"A listing does not inherently mean consumers can edit provider data.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":2,"kind":"recall","related":[]},{"id":"sp156","domain":"sharing","tag":"Data collaboration","front":"What does a secure view hide from an unauthorized consumer?","back":"The view definition / underlying SQL logic","why":"Secure views provide a restricted definition visibility model while permitting authorized SELECT.","trap":"They can still expose data intentionally selected by their definition.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"recall","related":[]},{"id":"sp157","domain":"sharing","tag":"Reader accounts","front":"Must reader consumers be full Snowflake customers already?","back":"No","why":"Reader accounts exist so non-Snowflake customers can access selected shared data.","trap":"The provider creates and bills reader resources.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"recall","related":[]},{"id":"sp158","domain":"sharing","tag":"Reader accounts","front":"Can reader accounts publish their own new shares?","back":"No","why":"Reader accounts are constrained consumers; they cannot act as full data-sharing providers.","trap":"They can query the provider’s shared data within allowed scope.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":2,"kind":"recall","related":[]},{"id":"sp159","domain":"sharing","tag":"Imported databases","front":"Where should a consumer store writable transformations of shared data?","back":"Its own local database","why":"An imported shared database is read-only, so derived tables are created in consumer-owned storage.","trap":"The provider’s base tables stay unchanged.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"recall","related":[]},{"id":"sp160","domain":"sharing","tag":"Share permissions","front":"Can a consumer infer that sharing a secure view gives base-table SELECT?","back":"No","why":"The provider grants access to secure-view outputs and relevant enclosing objects, not unrestricted base-table access.","trap":"Cross-database references may require provider-side REFERENCE_USAGE.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"recall","related":[]},{"id":"sp161","domain":"sharing","tag":"Data collaboration","front":"Which side normally owns underlying data storage in direct sharing?","back":"Provider","why":"The provider retains the source table storage and ownership in supported same-region direct shares.","trap":"Consumers normally incur compute charges for queries.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":2,"kind":"recall","related":[]},{"id":"sp162","domain":"sharing","tag":"Data collaboration","front":"Do consumers need to copy all shared rows before using SELECT?","back":"No","why":"The consumer creates a database from the share and queries read-only shared objects using their own compute.","trap":"Unlike traditional ETL, initial full-copy is unnecessary for normal direct sharing.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"recall","related":[]}];</script>
<script>'use strict';
