rmance","objective":"4.1","tag":"Query Profile","front":"What causes exploding joins in Query Profile?","back":"Excessively many output matches per input row","why":"Missing or incomplete predicates can produce cartesian or many-to-many explosion.","trap":"Multi-cluster scaling does not correct join semantics.","code":"","doc":"https://docs.snowflake.com/en/user-guide/ui-query-profile","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp302"},{"domain":"performance","objective":"4.1","tag":"Query Profile","front":"Which warehouse symptom points to insufficient concurrency?","back":"Long query queueing with fast individual execution","why":"Scale-out/multi-cluster can help when many queries wait for compute slots.","trap":"A single spilling query is a scale-up/query design issue.","code":"","doc":"https://docs.snowflake.com/en/user-guide/ui-query-profile","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp303"},{"domain":"performance","objective":"4.1","tag":"Query Insights","front":"What does Query Profile help debug beyond query duration?","back":"Operators, scans, partitions, spills and joins","why":"A physical operator plan reveals the specific sources of latency.","trap":"Total elapsed time alone cannot explain root cause.","code":"","doc":"https://docs.snowflake.com/en/user-guide/ui-query-profile","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp304"},{"domain":"performance","objective":"4.1","tag":"Query history","front":"Where do you query account-wide historic SQL execution metrics?","back":"SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY","why":"The view exposes query status, elapsed time and related metrics with latency.","trap":"INFORMATION_SCHEMA has different history limits.","code":"SELECT * FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY;","doc":"https://docs.snowflake.com/en/sql-reference/account-usage/query_history","priority":3,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp305"},{"domain":"performance","objective":"4.1","tag":"Query attribution","front":"Which view helps attribute query compute cost?","back":"QUERY_ATTRIBUTION_HISTORY","why":"Query attribution helps identify expensive workloads and owners.","trap":"WAREHOUSE_METERING_HISTORY reports larger aggregate warehouse spend.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/account-usage/query_attribution_history","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp306"},{"domain":"performance","objective":"4.1","tag":"Workload management","front":"What is the key advantage of separate BI and ETL warehouses?","back":"Independent resource scheduling","why":"Long ETL jobs cannot occupy the BI warehouse’s compute slots.","trap":"Database-level separation does not provide the same isolation.","code":"","doc":"https://docs.snowflake.com/en/user-guide/warehouses-overview","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp307"},{"domain":"performance","objective":"4.1","tag":"Query tuning","front":"Before buying compute for a huge Cartesian join, do what?","back":"Fix SQL join conditions","why":"A bad join predicate can multiply intermediate records drastically.","trap":"Bigger hardware does not make a wrong result correct.","code":"","doc":"https://docs.snowflake.com/en/user-guide/ui-query-profile","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp308"},{"domain":"performance","objective":"4.1","tag":"Query tuning","front":"What does SELECT * risk on a wide table?","back":"Reading more columns than needed","why":"Projection to required columns can reduce scanned bytes and network output.","trap":"Selecting fewer columns does not automatically guarantee faster every query.","code":"","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp309"},{"domain":"performance","objective":"4.1","tag":"Query tuning","front":"Why can functions around filter columns hurt pruning?","back":"They can obscure the filter range","why":"Expressions that prevent deriving a simple storage range may reduce pruning.","trap":"Snowflake can still optimize certain expressions; inspect profile.","code":"","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp310"},{"domain":"performance","objective":"4.2","tag":"QAS","front":"Which feature can offload eligible scan portions for long queries?","back":"Query Acceleration Service","why":"QAS adds shared serverless processing for eligible scan work.","trap":"It does not universally accelerate every large GROUP BY.","code":"","doc":"https://docs.snowflake.com/en/user-guide/query-acceleration-service","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp311"},{"domain":"performance","objective":"4.2","tag":"QAS","front":"Which SYSTEM$ function estimates query acceleration benefit?","back":"SYSTEM$ESTIMATE_QUERY_ACCELERATION","why":"The function assesses candidate queries for Query Acceleration Service.","trap":"Not SYSTEM$PIPE_STATUS.","code":"SELECT SYSTEM$ESTIMATE_QUERY_ACCELERATION(<query_id>);","doc":"https://docs.snowflake.com/en/user-guide/query-acceleration-service","priority":3,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp312"},{"domain":"performance","objective":"4.2","tag":"QAS","front":"Which ACCOUNT_USAGE view lists Query Acceleration candidates?","back":"QUERY_ACCELERATION_ELIGIBLE","why":"Inspect candidate queries rather than blindly enabling QAS.","trap":"Eligibility is not universal.","code":"","doc":"https://docs.snowflake.com/en/user-guide/query-acceleration-service","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp313"},{"domain":"performance","objective":"4.2","tag":"Search optimization","front":"Which feature targets highly selective equality lookups on massive tables?","back":"Search Optimization Service","why":"Search optimization maintains access paths for selective lookup predicates.","trap":"Traditional user-managed B-tree indexing is not the default approach.","code":"","doc":"https://docs.snowflake.com/en/user-guide/search-optimization-service","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp314"},{"domain":"performance","objective":"4.2","tag":"Clustering","front":"What makes a large table a likely clustering-key candidate?","back":"Repeated selective filtering with poor pruning","why":"Clustering can improve micro-partition locality at maintenance cost.","trap":"Tiny tables or already-well-pruned queries may not benefit.","code":"","doc":"https://docs.snowflake.com/en/user-guide/tables-clustering-keys","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp315"},{"domain":"performance","objective":"4.2","tag":"Clustering","front":"Why cluster a high-cardinality numeric ID using a coarse expression?","back":"Reduce the key’s effective cardinality","why":"Truncating or bucketing can group nearby values to improve locality.","trap":"Choose grouping granularity based on actual filters.","code":"","doc":"https://docs.snowflake.com/en/user-guide/tables-clustering-keys","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp316"},{"domain":"performance","objective":"4.2","tag":"Clustering","front":"Which expression removes six low-order digits from an ID for clustering?","back":"TRUNC(id, -6)","why":"Negative scale truncates positions to the left of the decimal point.","trap":"TRUNC(id, 6) truncates decimal positions, not millions.","code":"CLUSTER BY (TRUNC(id_number, -6))","doc":"https://docs.snowflake.com/en/user-guide/tables-clustering-keys","priority":2,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp317"},{"domain":"performance","objective":"4.2","tag":"Materialized views","front":"What is the cost tradeoff of materialized views?","back":"Faster eligible reads versus maintenance/storage","why":"Snowflake maintains stored results as base data changes.","trap":"Materialized views have SQL definition restrictions.","code":"","doc":"https://docs.snowflake.com/en/user-guide/views-materialized","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp318"},{"domain":"performance","objective":"4.2","tag":"Dynamic tables","front":"For complex joined transformations with freshness targets, use what?","back":"Dynamic tables","why":"Dynamic tables support declarative managed refresh of supported multi-table SQL.","trap":"A materialized view cannot necessarily express those joins.","code":"","doc":"https://docs.snowflake.com/en/user-guide/dynamic-tables-about","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp319"},{"domain":"performance","objective":"4.3","tag":"Caching","front":"Which cache can return eligible SELECT results without a warehouse?","back":"Persisted query-result cache","why":"Snowflake can reuse valid prior results without running warehouse compute.","trap":"Warehouse SSD data cache does require warehouse execution.","code":"","doc":"https://docs.snowflake.com/en/user-guide/querying-persisted-results","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp320"},{"domain":"performance","objective":"4.3","tag":"Caching","front":"Which cache disappears when a warehouse suspends?","back":"Warehouse local disk data cache","why":"Warehouse caches exist on compute nodes that are released on suspend.","trap":"Persisted query results have a separate lifecycle.","code":"","doc":"https://docs.snowflake.com/en/user-guide/querying-persisted-results","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp321"},{"domain":"performance","objective":"4.3","tag":"Caching","front":"What can invalidate persisted result reuse despite identical SQL text?","back":"Changed underlying data or context","why":"Snowflake checks eligibility, table changes and relevant session settings.","trap":"Identical text does not guarantee a cache hit.","code":"","doc":"https://docs.snowflake.com/en/user-guide/querying-persisted-results","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp322"},{"domain":"performance","objective":"4.3","tag":"Caching","front":"Does a nondeterministic function help cache reuse?","back":"Usually no","why":"Nondeterministic results generally prevent persisted-result cache reuse.","trap":"Test eligibility; not all functions behave alike.","code":"","doc":"https://docs.snowflake.com/en/user-guide/querying-persisted-results","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp323"},{"domain":"performance","objective":"4.3","tag":"Caching","front":"What is metadata caching useful for?","back":"Answering selected metadata-only queries efficiently","why":"Cloud services may answer eligible metadata operations without scanning data.","trap":"Not every COUNT(*) can be answered from metadata under all conditions.","code":"","doc":"https://docs.snowflake.com/en/user-guide/querying-persisted-results","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp324"},{"domain":"performance","objective":"4.4","tag":"SQL transformations","front":"Which function makes one row per element of a VARIANT array?","back":"FLATTEN","why":"LATERAL FLATTEN converts nested arrays/objects into relational rows.","trap":"Cannot be used inside COPY INTO transformations.","code":"SELECT f.value FROM t, LATERAL FLATTEN(input=>t.payload:items) f;","doc":"https://docs.snowflake.com/en/sql-reference/functions/flatten","priority":3,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp325"},{"domain":"performance","objective":"4.4","tag":"SQL transformations","front":"Which function turns JSON text into VARIANT?","back":"PARSE_JSON","why":"PARSE_JSON parses structured text into VARIANT.","trap":"TO_JSON converts in the opposite direction.","code":"","doc":"https://docs.snowflake.com/en/user-guide/semistructured-concepts","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp326"},{"domain":"performance","objective":"4.4","tag":"SQL transformations","front":"Which function serializes VARIANT as a JSON string?","back":"TO_JSON","why":"TO_JSON returns JSON-formatted VARCHAR text.","trap":"OBJECT_CONSTRUCT builds an OBJECT, not a JSON string.","code":"","doc":"https://docs.snowflake.com/en/user-guide/semistructured-concepts","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp327"},{"domain":"performance","objective":"4.4","tag":"SQL transformations","front":"How are JSON null and SQL NULL different?","back":"Distinct values with separate NULL checks","why":"A VARIANT can contain the JSON literal null rather than SQL NULL.","trap":"Use IS_NULL_VALUE for JSON null and IS NULL for SQL NULL.","code":"","doc":"https://docs.snowflake.com/en/user-guide/semistructured-concepts","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp328"},{"domain":"performance","objective":"4.4","tag":"SQL transformations","front":"Which function changes a VARIANT JSON null into SQL NULL?","back":"STRIP_NULL_VALUE","why":"It normalizes JSON null to SQL NULL.","trap":"Does not simply delete every key in an OBJECT.","code":"","doc":"https://docs.snowflake.com/en/user-guide/semistructured-concepts","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp329"},{"domain":"performance","objective":"4.4","tag":"SQL transformations","front":"What checks whether a VARIANT value contains an ARRAY?","back":"IS_ARRAY","why":"Type predicates test types without casting.","trap":"TO_ARRAY is conversion, not a Boolean type test.","code":"SELECT IS_ARRAY(payload) FROM events;","doc":"https://docs.snowflake.com/en/user-guide/semistructured-concepts","priority":2,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp330"},{"domain":"performance","objective":"4.4","tag":"SQL transformations","front":"Which keyword filters results after window functions are computed?","back":"QUALIFY","why":"QUALIFY filters window-function output without another SELECT wrapper.","trap":"WHERE runs before window aggregation.","code":"SELECT *, ROW_NUMBER() OVER(PARTITION BY id ORDER BY ts DESC) rn FROM t QUALIFY rn=1;","doc":"https://docs.snowflake.com/en/sql-reference/constructs/qualify","priority":3,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp331"},{"domain":"performance","objective":"4.4","tag":"SQL transformations","front":"What does ROW_NUMBER() do within a window partition?","back":"Assigns sequential row numbers","why":"Rows are numbered according to the specified window order.","trap":"RANK allows gaps for ties; ROW_NUMBER does not.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/functions-analytic","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp332"},{"domain":"performance","objective":"4.4","tag":"SQL transformations","front":"What is the difference between RANK and DENSE_RANK on ties?","back":"RANK leaves gaps; DENSE_RANK does not","why":"Both give the same rank to tied values but advance differently afterward.","trap":"ROW_NUMBER still gives each row a distinct ordinal.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/functions-analytic","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp333"},{"domain":"performance","objective":"4.4","tag":"SQL transformations","front":"Which window function accesses the previous row’s value?","back":"LAG","why":"LAG looks backward within a partition and order.","trap":"LEAD looks forward.","code":"LAG(amount) OVER (PARTITION BY id ORDER BY event_time)","doc":"https://docs.snowflake.com/en/sql-reference/functions-analytic","priority":2,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp334"},{"domain":"performance","objective":"4.4","tag":"SQL transformations","front":"Which function allows conditional aggregation per group?","back":"COUNT_IF or SUM(CASE WHEN...)","why":"Conditional aggregation counts or sums rows satisfying a predicate.","trap":"WHERE filtering removes rows before group aggregation entirely.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/functions-aggregation","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp335"},{"domain":"performance","objective":"4.4","tag":"SQL transformations","front":"What is COUNT(*) different from COUNT(col)?","back":"COUNT(*) includes NULL-containing rows","why":"COUNT(col) excludes rows where that column is SQL NULL.","trap":"Do not assume both count identical rows.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/functions-aggregation","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp336"},{"domain":"performance","objective":"4.4","tag":"SQL transformations","front":"What does HAVING filter?","back":"Groups after aggregation","why":"HAVING filters grouped aggregate results.","trap":"WHERE filters input rows before grouping.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/functions-aggregation","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp337"},{"domain":"performance","objective":"4.4","tag":"SQL transformations","front":"What does GROUP BY ALL group on?","back":"All non-aggregate SELECT expressions","why":"Snowflake can infer grouping expressions when GROUP BY ALL is used.","trap":"It is not GROUP BY every column in the entire source table.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/functions-aggregation","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp338"},{"domain":"performance","objective":"4.4","tag":"SQL transformations","front":"How does TRY_TO_NUMBER handle bad numeric text?","back":"Returns SQL NULL","why":"TRY_ conversion functions avoid raising errors for invalid conversion input.","trap":"TO_NUMBER can raise an error.","code":"SELECT TRY_TO_NUMBER('invalid');","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":3,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp339"},{"domain":"performance","objective":"4.4","tag":"String functions","front":"Which Snowflake function does case-insensitive SQL wildcard matching?","back":"ILIKE","why":"ILIKE handles % and _ wildcard patterns without case sensitivity.","trap":"LIKE is generally case-sensitive.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp340"},{"domain":"performance","objective":"4.4","tag":"String functions","front":"Does CONCAT_WS skip NULL arguments?","back":"No; NULL propagates","why":"In Snowflake CONCAT_WS returns NULL if any argument is NULL.","trap":"Other SQL engines can differ.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp341"},{"domain":"performance","objective":"4.4","tag":"String functions","front":"Why does REGEXP_LIKE('abc123xyz','123') not match?","back":"Snowflake implicitly anchors the regex","why":"Use .*123.* to test substring containment under full-string anchoring.","trap":"CONTAINS is simpler for literal substring matching.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp342"},{"domain":"performance","objective":"4.4","tag":"String functions","front":"What is the difference between SPLIT and SPLIT_TO_TABLE?","back":"ARRAY result versus one row per token","why":"SPLIT returns an ARRAY; SPLIT_TO_TABLE expands tokens to rows.","trap":"SPLIT_PART returns only one selected token.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/functions-string","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp343"},{"domain":"performance","objective":"4.4","tag":"Query SQL","front":"What does UNION ALL do to duplicate rows?","back":"Retains duplicates","why":"UNION DISTINCT removes duplicates and can require extra work.","trap":"UNION ALL is not deduplicating.","code":"","doc":"https://docs.snowflake.com/en/sql-reference","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp344"},{"domain":"performance","objective":"4.4","tag":"Query SQL","front":"How can ORDER BY NULLS FIRST change query results?","back":"Positions NULLs before non-NULL values","why":"NULLS FIRST/LAST controls null ordering in supported ORDER BY contexts.","trap":"It does not modify underlying NULL values.","code":"","doc":"https://docs.snowflake.com/en/sql-reference","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp345"},{"domain":"sharing","objective":"5.1","tag":"Time Travel","front":"What enables querying a prior table state without contacting Support?","back":"Time Travel","why":"Time Travel restores/queries historical state within configured retention.","trap":"Fail-safe is Snowflake-managed and not a customer SQL undo button.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-time-travel","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp346"},{"domain":"sharing","objective":"5.1","tag":"Time Travel","front":"What SQL command restores a dropped table within Time Travel?","back":"UNDROP TABLE","why":"UNDROP restores an eligible dropped object within its retention window.","trap":"Fail-safe is not restored via UNDROP.","code":"UNDROP TABLE orders;","doc":"https://docs.snowflake.com/en/user-guide/data-time-travel","priority":2,"kind":"sql","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp347"},{"domain":"sharing","objective":"5.1","tag":"Time Travel","front":"Which SQL clauses query prior table snapshots?","back":"AT or BEFORE","why":"SELECT can reference supported historical offsets or timestamps.","trap":"Time Travel retention limits how far back history exists.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-time-travel","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp348"},{"domain":"sharing","objective":"5.1","tag":"Fail-safe","front":"Who operates Fail-safe recovery?","back":"Snowflake","why":"Fail-safe is an emergency recovery mechanism beyond Time Travel for eligible permanent data.","trap":"Not a feature customers use to query old tables directly.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-failsafe","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp349"},{"domain":"sharing","objective":"5.1","tag":"Cloning","front":"Why is zero-copy cloning initially storage efficient?","back":"Shares unchanged micro-partitions","why":"Clones reference original immutable partitions until diverging modifications.","trap":"It is not a read-only view; clones can be writable.","code":"","doc":"https://docs.snowflake.com/en/user-guide/object-clone","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp350"},{"domain":"sharing","objective":"5.1","tag":"Cloning","front":"What changes clone storage costs over time?","back":"Diverging data versions and retention","why":"New partitions and retained history can add billable storage.","trap":"A clone never copies all data automatically at creation.","code":"","doc":"https://docs.snowflake.com/en/user-guide/object-clone","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp351"},{"domain":"sharing","objective":"5.1","tag":"Replication","front":"What does replication do in disaster recovery?","back":"Keeps secondary account/database state updated","why":"Replication produces eligible secondary copies for continuity and distribution.","trap":"Replication alone is not the same as promoting a secondary to primary.","code":"","doc":"https://docs.snowflake.com/en/user-guide/account-replication-intro","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp352"},{"domain":"sharing","objective":"5.1","tag":"Failover","front":"What enables a secondary to become primary after an outage?","back":"Failover","why":"Failover groups support promotion of a secondary in supported setups.","trap":"A regular direct share is not a failover group.","code":"","doc":"https://docs.snowflake.com/en/user-guide/account-replication-failover-failback","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp353"},{"domain":"sharing","objective":"5.2","tag":"Secure sharing","front":"Can consumers modify provider source tables through direct sharing?","back":"No","why":"Imported shared databases are generally read-only to consumers.","trap":"Consumers can create transformed copies in their own databases.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp354"},{"domain":"sharing","objective":"5.2","tag":"Secure sharing","front":"Does same-region direct sharing require complete data duplication?","back":"No","why":"Direct shares provide controlled read access without a full initial table copy.","trap":"Cross-region fulfillment can involve replicated copies.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp355"},{"domain":"sharing","objective":"5.2","tag":"Secure sharing","front":"Who pays warehouse compute for normal share consumer queries?","back":"The consumer","why":"A consumer uses its own warehouse for SELECT on shared objects.","trap":"Reader accounts are billed to the provider.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp356"},{"domain":"sharing","objective":"5.2","tag":"Secure sharing","front":"Who pays for the compute used by a reader account?","back":"Provider","why":"Provider-created reader accounts are billed to that provider.","trap":"The reader account user need not have a paid Snowflake account.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-reader-create","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp357"},{"domain":"sharing","objective":"5.2","tag":"Secure sharing","front":"Why use a reader account?","back":"Give non-Snowflake customers shared-data access","why":"Reader accounts provide a restricted consumer experience.","trap":"Reader accounts cannot publish their own shares.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-reader-create","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp358"},{"domain":"sharing","objective":"5.2","tag":"Secure sharing","front":"What is required after a provider adds the consumer to a share?","back":"Consumer creates a database FROM SHARE","why":"The imported database provides query access to shared objects.","trap":"Adding a consumer account does not automatically create the database.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-share-consumers","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp359"},{"domain":"sharing","objective":"5.2","tag":"Secure sharing","front":"How can a provider share only selected rows and columns?","back":"Secure view","why":"Secure views enforce a controlled projection/filter while hiding their definition.","trap":"Sharing the base table exposes more than intended.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-provider","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp360"},{"domain":"sharing","objective":"5.2","tag":"Secure sharing","front":"Which database privilege supports a secure view referencing another database?","back":"REFERENCE_USAGE","why":"Providers grant REFERENCE_USAGE as needed to support cross-database secure view references.","trap":"It does not grant the consumer unrestricted SELECT on base tables.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-provider","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp361"},{"domain":"sharing","objective":"5.2","tag":"Secure sharing","front":"What kind of role can a provider grant directly to a share?","back":"Database role","why":"Shared database roles encapsulate eligible read privileges.","trap":"Account roles are not directly granted to shares.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-provider","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp362"},{"domain":"sharing","objective":"5.2","tag":"Resharing","front":"Can a normal consumer simply reshare provider-owned tables?","back":"Not by default","why":"A consumer’s access to an imported database does not mean it owns provider data for redistribution.","trap":"Specific governed sharing arrangements may have different rules.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-sharing-intro","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp363"},{"domain":"sharing","objective":"5.2","tag":"Clean Rooms","front":"What collaboration problem do Data Clean Rooms address?","back":"Controlled joint analysis without sharing raw data","why":"Clean rooms facilitate privacy-preserving collaboration with governed queries.","trap":"They are not the same as unsecured full-table exports.","code":"","doc":"https://docs.snowflake.com/en/user-guide/cleanrooms/overview","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp364"},{"domain":"sharing","objective":"5.2","tag":"Clean Rooms","front":"Why might a clean room enforce a query template?","back":"Restrict what participants can infer","why":"Approved templates constrain analyses and output disclosure.","trap": public Snowflake documentation","id":"sp368"},{"domain":"sharing","objective":"5.3","tag":"Listings","front":"What supports distributing listings across supported regions?","back":"Cross-Cloud Auto-Fulfillment","why":"Auto-fulfillment can manage copy/distribution steps for cross-region listings.","trap":"Same-region direct shares often need no full data duplication.","code":"","doc":"https://docs.snowflake.com/en/collaboration/provider-listings-about","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp369"},{"domain":"sharing","objective":"5.3","tag":"Native Apps","front":"What does Snowflake Native App Framework distribute?","back":"Packaged applications running in consumer Snowflake accounts","why":"Native Apps can deploy application logic with governed data access.","trap":"A simple share distributes data, not an application package.","code":"","doc":"https://docs.snowflake.com/en/developer-guide/native-apps/native-apps-about","priority":3,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp370"},{"domain":"sharing","objective":"5.3","tag":"Native Apps","front":"How does a Native App differ from a regular shared view?","back":"Includes application code and permissions model","why":"Native Apps package logic/UI/services in addition to data.","trap":"Secure views are just controlled query interfaces.","code":"","doc":"https://docs.snowflake.com/en/developer-guide/native-apps/native-apps-about","priority":2,"kind":"recall","related":[],"status":"current","versions":["COF-C03"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp371"},{"domain":"architecture","objective":"Legacy","tag":"Historical architecture","front":"What were the first SnowPro Core exam version codes?","back":"COF-C01, followed by COF-C02","why":"C01 preceded C02; C03 replaced older Core outlines in 2026.","trap":"These labels are history, not current C03 exam question numbers.","code":"","doc":"https://learn.snowflake.com/en/certifications/snowpro-core-c03/","priority":2,"kind":"recall","related":[],"status":"legacy","versions":["COF-C01","COF-C02"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp372"},{"domain":"architecture","objective":"Legacy","tag":"Classic Console","front":"Which legacy Snowflake browser interface preceded Snowsight?","back":"Classic Console / Classic Web UI","why":"Older study materials frequently describe Classic Console navigation.","trap":"Prioritize current Snowsight terminology for C03.","code":"","doc":"https://learn.snowflake.com/en/certifications/snowpro-core-c03/","priority":2,"kind":"recall","related":[],"status":"legacy","versions":["COF-C01","COF-C02"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp373"},{"domain":"architecture","objective":"Legacy","tag":"SnowSQL","front":"What was SnowSQL chiefly used for?","back":"Command-line SQL and file upload/download","why":"SnowSQL supported SQL, PUT and GET in older SnowPro prep.","trap":"Modern Snowflake CLI covers newer development workflows.","code":"","doc":"https://docs.snowflake.com/en/developer-guide/snowflake-cli/index","priority":2,"kind":"recall","related":[],"status":"legacy","versions":["COF-C01","COF-C02"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp374"},{"domain":"architecture","objective":"Legacy","tag":"Warehouse generations","front":"Did the COF-C01 era cover Gen 2 warehouse types?","back":"No; Gen 2 is much newer","why":"Gen 2 and modern AI application features belong to later content updates.","trap":"Do not assume old practice tests cover current warehouse generations.","code":"","doc":"https://docs.snowflake.com/en/user-guide/warehouses-gen2","priority":2,"kind":"recal wflake.com/en/user-guide/network-policies","priority":2,"kind":"recall","related":[],"status":"legacy","versions":["COF-C01","COF-C02"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp382"},{"domain":"governance","objective":"Legacy","tag":"Historical billing","front":"What was the classic Cloud Services billing offset rule?","back":"Up to 10% daily warehouse credits offset","why":"Historic core questions reference Snowflake Cloud Services credits and daily adjustment.","trap":"Verify current billing rules before calculating actual charges.","code":"","doc":"https://docs.snowflake.com/en/user-guide/cost-understanding-compute","priority":2,"kind":"recall","related":[],"status":"legacy","versions":["COF-C01","COF-C02"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp383"},{"domain":"governance","objective":"Legacy","tag":"Audit","front":"Why would older guides recommend INFORMATION_SCHEMA for metadata?","back":"Database-scoped object introspection","why":"INFORMATION_SCHEMA gives object/catalog views, subject to privileges.","trap":"ACCOUNT_USAGE adds historical account-wide activity and latency.","code":"","doc":"https://docs.snowflake.com/en/sql-reference/account-usage/query_history","priority":2,"kind":"recall","related":[],"status":"legacy","versions":["COF-C01","COF-C02"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp384"},{"domain":"loading","objective":"Legacy","tag":"Older Snowpipe billing","front":"Why can historical Snowpipe cost answers be wrong today?","back":"Billing models and rates changed","why":"Older third-party material may describe per-file Snowpipe charging rather than current volume-oriented terms.","trap":"Avoid memorizing obsolete price units as current truths.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-snowpipe-intro","priority":3,"kind":"recall","related":[],"status":"legacy","versions":["COF-C01","COF-C02"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp385"},{"domain":"loading","objective":"Legacy","tag":"File URLs","front":"Which legacy function builds a non-expiring staged-file URL?","back":"BUILD_STAGE_FILE_URL","why":"It builds stage file URLs with authorization requirements.","trap":"Do not confuse with temporary presigned or scoped URLs.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-overview","priority":2,"kind":"recall","related":[],"status":"legacy","versions":["COF-C01","COF-C02"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp386"},{"domain":"loading","objective":"Legacy","tag":"Directory refresh","front":"Does DIRECTORY=(ENABLE=TRUE) always mean auto refresh?","back":"No","why":"Refresh behavior depends on stage type and notification configuration.","trap":"Old mocks can conflate enabling the directory with event setup.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-dirtables","priority":2,"kind":"recall","related":[],"status":"legacy","versions":["COF-C01","COF-C02"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp387"},{"domain":"loading","objective":"Legacy","tag":"PUT versus GET","front":"Which command downloads internal-stage files to a local client?","back":"GET","why":"Older exams often distinguish GET download from PUT upload.","trap":"GET does not download from every external stage type.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-overview","priority":2,"kind":"recall","related":[],"status":"legacy","versions":["COF-C01","COF-C02"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp388"},{"domain":"loading","objective":"Legacy","tag":"Bulk loading","front":"What general bulk-load file size guidance appeared in historic materials?","back":"Roughly 100–250 MB compressed or larger","why":"Snowflake guides have recommended reasonably sized compressed files for parallel load.","trap":"This is guidance, not a universal hard size limit; verify current data-load docs.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-overview","priority":2,"kind":"recall","related":[],"status":"legacy","versions":["COF-C01","COF-C02"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp389"},{"domain":"loading","objective":"Legacy","tag":"Old integrations","front":"Why does AWS external ID matter for S3 loading?","back":"Confused-deputy protection in IAM trust","why":"Storage integration trust uses a Snowflake principal plus external ID.","trap":"Access keys embedded in SQL are not a preferred long-term method.","code":"","doc":"https://docs.snowflake.com/en/user-guide/data-load-s3-config-storage-integration","priority":2,"kind":"recall","related":[],"status":"legacy","versions":["COF-C01","COF-C02"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp390"},{"domain":"performance","objective":"Legacy","tag":"Search indexes","front":"Do Snowflake native tables require manual B-tree indexes?","back":"No","why":"Micro-partition metadata and modern search optimization serve different access patterns.","trap":"Do not answer \"create an index\" to every SQL performance question.","code":"","doc":"https://docs.snowflake.com/en/user-guide/performance-query-options","priority":2,"kind":"recall","related":[],"status":"legacy","versions":["COF-C01","COF-C02"],"provenance":"Original learning prompt; based on public Snowflake documentation","id":"sp391"},{"domain":"performance","objective":"Legacy","tag":"Scaling policy","front":"Standard vs Economy: which prioritizes latency?","back":"STANDARD","why":"STANDARD adds clusters more aggressively to reduce concurrency queueing.","trap":"Auto-scale mode is different from its STANDARD/ECONOMY scaling policy.","code":"","doc":"https://docs.snowflake.com/en/user-guide/w const defaultState=()=>({version:1,cards:{},session:null,sessionArchive:[],history:[],settings:{examDate:'2026-11-19',minutes:5,retention:0.9,haptics:false,dailyNew:16,typing:false},updatedAt:Date.now()});
let state,storageOK=true;
try{let raw=localStorage.getItem(STORAGE_KEY);state=raw?JSON.parse(raw):defaultState();if(state?.version!==1||!state.cards||!state.settings)state=defaultState();}catch(e){storageOK=false;state=defaultState();}
let ui={page:'home',domain:'all',search:'',only:'all',version:'current',objective:'all',drawer:null,activePreview:null,swipeEnabled:true},toastTimer=null,transitioning=false,pointerStart=null;
const $=selector=>document.querySelector(selector);
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const format=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');

function save(){state.updatedAt=NOW();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}setSave();}
function setSave(){const el=$('#savedIndicator');if(!el)return;el.classList.toggle('bad',!storageOK);el.querySelector('span').textContent=storageOK?'Saved':'Storage blocked';}
const cardState=id=>state.cards[id]||null;
const reviewed=id=>!!cardState(id)?.reps;
const due=id=>{const v=cardState(id);return v?.reps>0 && v.due<=NOW();};
const weak=id=>{const v=cardState(id);return !!v?.reps&&(v.lapses>0||v.lastGrade<=2||v.difficulty>=7.5);};
const bookmarked=id=>!!cardState(id)?.bookmark;
function allStats(){let seen=0,dueN=0,mastered=0,weakN=0,bookmarks=0,viewed=0,viewedUnrated=0;for(const c of currentCards()){const v=cardState(c.id);if(v?.views)viewed++;if(v?.views&&!v?.reps)viewedUnrated++;if(v?.reps)seen++;if(due(c.id))dueN++;if(v?.reps>=2&&v.stability>=10&&v.lastGrade>=3)mastered++;if(weak(c.id))weakN++;if(v?.bookmark)bookmarks++;}return{seen,due:dueN,new:currentCards().length-seen,mastered,weak:weakN,bookmarks,viewed,viewedUnrated};}
function domainStats(domain){const cards=currentCards().filter(c=>c.domain===domain),count=cards.length,seen=cards.filter(c=>reviewed(c.id)).length;return{count,seen,due:cards.filter(c=>due(c.id)).length,weak:cards.filter(c=>weak(c.id)).length,mastered:cards.filter(c=>{const v=cardState(c.id);return v?.reps>=2&&v.stability>=10&&v.lastGrade>=3;}).length};}
function dateOnly(ms){const d=new Date(ms);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function daysToExam(){if(!state.settings.examDate)return null;const now=new Date(),end=new Date(state.settings.examDate+'T12:00:00');return Math.max(0,Math.ceil((end - new Date(now.getFullYear(),now.getMonth(),now.getDate(),12))/DAY));}
function cardDueLabel(ms){const delta=ms-NOW();if(delta<60000)return'due now';if(delta<3600000)return Math.max(1,Math.ceil(delta/60000))+'m';if(delta<DAY)return Math.max(1,Math.ceil(delta/3600000))+'h';return Math.max(1,Math.round(delta/DAY))+'d';}
function activityMap(){const byDate={};for(const l of state.history){const date=dateOnly(l.time);byDate[date]=(byDate[date]||0)+1;}return byDate;}
function streak(){const a=activityMap();let d=new Date();d.setHours(12,0,0,0);if(!a[dateOnly(d.getTime())])d.setDate(d.getDate()-1);let n=0;while(a[dateOnly(d.getTime())]){n++;d.setDate(d.getDate()-1);}return n;}
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2300);}
function haptic(){if(state.settings.haptics&&navigator.vibrate)navigator.vibrate(12);}
function confetti(){if(window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<13;i++){const el=document.createElement('span');el.className='confetti';el.style.setProperty('--dx',`${(Math.random()-.5)*330}px`);el.style.setProperty('--dy',`${(Math.random()-.5)*280}px`);el.style.background=['#88d9c8','#f2c98e','#aabff4','#ffafa9'][i%4];document.body.appendChild(el);setTimeout(()=>el.remove(),800);}}
// FSRS-6 published defaults; with small same-day learning-step safeguards and fixed 90% desired retention.
// See https://github.com/open-spaced-repetition/awesome-fsrs/wiki/The-Algorithm
const W=[0.212,1.2931,2.3065,8.2956,6.4133,0.8334,3.0194,0.001,1.8722,0.1666,0.796,1.4835,0.0614,0.2629,1.6483,0.6014,1.8729,0.5425,0.0912,0.0658,0.1542];
const ratingN={again:1,hard:2,good:3,easy:4};
const initialDifficulty=g=>clamp(W[4]-Math.exp(W[5]*(g-1))+1,1,10);
const forgetCurve=(elapsed,stability)=>Math.pow(1+(Math.pow(.9,-1/W[20])-1)*elapsed/Math.max(.01,stability),-W[20]);
const newInterval=s=>clamp(s/(Math.pow(.9,-1/W[20])-1)*(Math.pow(state.settings.retention,-1/W[20])-1),.01,36500);
function schedule(current,grade,when=NOW()){
 const g=ratingN[grade],old=current||{reps:0,lapses:0};
 let stability,difficulty,intervalDays;
 if(!old.reps){stability=W[g-1];difficulty=initialDifficulty(g);}
 else{
  const elapsed=Math.max(0,(when-old.last)/DAY),R=forgetCurve(elapsed,old.stability),D=old.difficulty;
  difficulty=clamp(W[7]*initialDifficulty(4)+(1-W[7])*(D+(-W[6]*(g-3))*(10-D)/9),1,10);
  if(elapsed<1){
   stability=Math.max(.05,old.stability*Math.exp(W[17]*(g-3+W[18]))*Math.pow(old.stability,-W[19]));
   if(g===1)stability=Math.min(old.stability,.3);
  }else if(g===1){stability=Math.max(.05,W[11]*Math.pow(difficulty,-W[12])*(Math.pow(old.stability+1,W[13])-1)*Math.exp(W[14]*(1-R)));}
  else{let mult=g===2?W[15]:g===4?W[16]:1;stability=Math.max(old.stability,old.stability*(1+Math.exp(W[8])*(11-difficulty)*Math.pow(old.stability,-W[9])*(Math.exp(W[10]*(1-R))-1)*mult));}
 }
 intervalDays=newInterval(stability);
 // A forgotten item returns promptly. Hard is not scheduled *later* than Good on first exposure.
 if(g===1)intervalDays=10/1440;
 if(g===2&&(!old.reps||old.reps<2))intervalDays=Math.min(intervalDays,1);
 if(g===4&&old.reps===0)intervalDays=Math.max(intervalDays,3);
 const dueAt=when+Math.max(60000,Math.round(intervalDays*DAY));
 return{stability,difficulty,intervalDays,due:dueAt};
}
function futureLabels(id){const old=cardState(id);return Object.entries(ratingN).map(([grade])=>({grade,label:cardDueLabel(schedule(old,grade).due)}));}

function render(){renderNav();const m=$('#view');m.innerHTML=ui.page==='home'?renderHome():ui.page==='decks'?renderDecks():ui.page==='browse'?renderBrowse():ui.page==='insights'?renderInsights():ui.page==='coverage'?renderCoverage():ui.page==='sources'?renderSources():ui.page==='study'?renderStudy():renderHome();setSave();}
function examCountdown(){const d=daysToExam();const label=state.settings.examDate?new Date(state.settings.examDate+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';return d===null?'Exam date not set':d>0?`${d} day${d===1?'':'s'} to ${label}`:d===0?'Exam day · stay sharp':'Exam date passed';}
function renderHome(){const st=allStats(),remain=daysToExam(),minutes=state.settings.minutes,active=state.session&&!state.session.completedAt&&state.session.index<state.session.queue.length;return `<div class="content"><div class="overline">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}).toUpperCase()} · THE NEXT REP COUNTS</div><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:9px 0 21px"><div><h1 style="margin-bottom:7px">Make it<br><span class="serif" style="color:#9ce5d5">stick.</span></h1><div class="countdown-strip"><span class="spark"></span>${esc(examCountdown())}</div></div><div style="text-align:right"><span class="pill green">${st.due?st.due+' due':st.new+' fresh'}</span><div class="small subtle" style="margin-top:7px">${st.seen} rated · ${st.viewed} viewed</div></div></div>
 <section class="hero"><div class="hero-art" aria-hidden="true"><div class="art-card one"></div><div class="art-card two">✳</div><div class="art-dot"></div></div><div class="overline">YOUR DAILY MEMORY RESET</div><h2>${st.due?`${st.due} memories are waiting for you.`:'A few minutes now. Stronger recall later.'}</h2><p>${st.due?`Review what is due, then add new concepts. The hard ones return sooner.`:`Start with the highest-yield Snowflake distinctions. Each card includes a short answer and an optional deep dive.`}</p><button class="btn primary" data-action="${active?'resume':'start'}" data-mode="mix" data-minutes="${minutes}">${icon('spark')} ${active?'Resume your set':`Start ~${minutes}-minute set`} ${icon('arrow')}</button></section>
 <div class="stat-grid"><div class="stat"><span class="stat-label">Due now</span><strong>${st.due}</strong><small>For spaced review</small></div><div class="stat"><span class="stat-label">Still new</span><strong>${st.new}</strong><small>Not rated yet</small></div><div class="stat"><span class="stat-label">Mastered</span><strong>${st.mastered}</strong><small>Delayed recall proved</small></div></div>
 <div class="section-head"><h2>Choose your pace</h2><span class="small subtle">Suggested length · not a timer</span></div><div class="session-presets">${[2,5,10].map(n=>`<button class="preset ${minutes===n?'active':''}" data-minutes-select="${n}" aria-pressed="${minutes===n}">${n} min <span class="subtle">· ${limitFor(n)} cards</span></button>`).join('')}</div>
 <div class="modes"><button class="mode" data-action="start" data-mode="mix"><span class="mode-icon">${icon('flip')}</span><strong>Smart review</strong><small>Due + new, mixed topics</small></button><button class="mode" data-action="start" data-mode="weak"><span class="mode-icon">${icon('bolt')}</span><strong>Exam sprint</strong><small>Weak spots + high yield</small></button><button class="mode" data-action="start" data-mode="sql"><span class="mode-icon">${icon('book')}</span><strong>Write the SQL</strong><small>Recall exact syntax first</small></button></div>

 return `<div class="explore-navigation" aria-label="Explore this topic"><button class="panel-arrow" data-panel-step="-1" aria-label="Previous learning panel" ${index===0?'disabled':''}>‹</button><div class="panel-navigation-center"><div class="panel-dots" role="group" aria-label="Learning panels">${panels.map((p,i)=>`<button class="panel-dot ${i===index?'active':''}" data-panel-index="${i}" aria-label="${esc(p.title)}, panel ${i+1} of ${panels.length}" ${i===index?'aria-current="step"':''}></button>`).join('')}</div><span class="panel-name">${esc(panels[index].title)} · ${index+1} of ${panels.length}</span></div><button class="panel-arrow" data-panel-step="1" aria-label="Next learning panel" ${index===panels.length-1?'disabled':''}>›</button></div>`;
}
function movePanel(index){const s=state.session,c=current();if(!s?.revealed||!c||ui.page!=='study')return;
 const panels=explorationPanels(c),next=clamp(index,0,panels.length-1),previous=Number(s.panelIndex)||0;
 if(next===previous)return;s.panelIndex=next;save();haptic();renderStudyInPlace({slide:next>previous?1:-1});
}
function tapFlashcard(){const s=state.session,c=current();if(!s||!c)return;
 if(!s.revealed){reveal();return;}
 const panels=explorationPanels(c),p=panels[clamp(Number(s.panelIndex)||0,0,panels.length-1)];
 if(p.type==='variation'){
  s.variationRevealed=s.variationRevealed||{};
  s.variationRevealed[p.id]=!s.variationRevealed[p.id];save();renderStudyInPlace();return;
 }
 if(p.type==='answer'){s.revealed=false;s.panelIndex=0;save();haptic();renderStudyInPlace();}
}
function renderStudy(){const s=state.session;if(!s)return `<div class="content"><h1>Start a recall session</h1><button class="btn primary" data-action="start" data-mode="mix">Start 5-minute review</button></div>`;
 if(s.index>=s.queue.length || s.completedAt)return renderCompletion();
 const c=current(),flipped=s.revealed,panels=explorationPanels(c),index=clamp(Number(s.panelIndex)||0,0,panels.length-1),est=Math.round((s.index/s.queue.length)*100),isTyping=s.mode==='sql';
 return `<div class="study-page"><div class="study-top"><button class="icon-btn" data-action="close-study" aria-label="Close session">${icon('close')}</button><div class="study-head"><span class="overline">${esc(s.mode==='sql'?'WRITE THE SQL':s.mode==='weak'?'EXAM SPRINT':'SMART RECALL')}</span><b>${s.index+1} of ${s.queue.length} · ${s.rated.length} rated</b></div><span class="pill ${due(c.id)?'sand':'green'}">${due(c.id)?'Due':reviewed(c.id)?'Practice':'New'}</span></div><div class="study-meter" role="progressbar" aria-valuenow="${s.index}" aria-valuemin="0" aria-valuemax="${s.queue.length}"><span style="width:${est}%"></span></div>
 <div class="flash-scene ${flipped?'explore-scene':''}" id="flashScene" data-card-id="${c.id}" data-panel-index="${index}" role="button" tabindex="0" aria-label="${!flipped?'Flashcard question. Tap to reveal answer.':index===0?'Answer revealed. Tap to flip back, or swipe left to learn more.':panels[index].type==='variation'?'Related challenge. Tap to reveal its answer or swipe to explore.':'Explore '+esc(panels[index].title)+'. Swipe left or right to navigate.'}"><div class="card-stack"></div><div class="flip-card ${flipped?'flipped':''}" id="flipCard"><article class="flash-face front-face"><div class="face-top"><span>${esc(DOMAINS[c.domain].short)} · ${esc(c.tag)}</span><span class="flash-symbol">✳</span></div><div class="flash-center"><div class="flash-question ${c.front.length>112?'compact':''}">${esc(c.front)}</div></div><div class="face-bottom"><span class="card-call">${icon('flip')} Tap to reveal</span><span>${c.priority>=3?'HIGH YIELD':'CORE REVIEW'}</span></div></article><article class="flash-face back-face">${exploreBack(c,s,panels)}</article></div></div>
 ${explorationNav(c,s,panels)}
 ${isTyping&&!flipped?`<textarea class="type-answer" id="typedDraft" placeholder="Recall the function or write the syntax here, then flip…" aria-label="Write your answer first">${esc(s.draft||'')}</textarea>`:''}
 <div class="card-status">${flipped?`Swipe to explore. Choose a rating to record your recall.`:'Tap to explore; only a recall rating marks a review complete.'}</div>
 <div class="rating-wrap">${flipped?`<div class="rating-label">HOW WELL DID YOU REMEMBER? · YOUR RATING AUTOSAVES</div><div class="rating-grid">${futureLabels(c.id).map(({grade,label})=>`<button class="rating ${grade}" data-grade="${grade}"><strong>${grade[0].toUpperCase()+grade.slice(1)}</strong><small>${label}</small></button>`).join('')}</div>`:`<button class="btn primary full" data-action="reveal">Reveal answer ${icon('flip')}</button>`}</div><div class="study-tools"><button class="btn quiet small" data-action="bookmark" data-id="${c.id}">${bookmarked(c.id)?'★ Saved':'☆ Save'}</button>${flipped?`<button class="btn quiet small" data-action="details" data-id="${c.id}">${icon('book')} Notes & sources</button>`:''}<button class="btn quiet small" data-action="skip">Skip ${icon('arrow')}</button></div></div>`;
}
// Preserve the physical card node so revealing it animates the 3D rotation,
// and changing panels animates horizontally without resetting the whole session.
function renderStudyInPlace({slide=0}={}){
 if(ui.page!=='study')return;
 const old=$('#flashScene'),oldIndex=Number(old?.dataset.panelIndex||0),wasFlipped=old?.querySelector('#flipCard')?.classList.contains('flipped');
 $('#view').innerHTML=renderStudy();
 const fresh=$('#flashScene');
 if(!old||!fresh||old.dataset.cardId!==fresh.dataset.cardId)return;
 old.querySelector('.back-face').innerHTML=fresh.querySelector('.back-face').innerHTML;
 old.dataset.panelIndex=fresh.dataset.panelIndex;
 old.setAttribute('aria-label',fresh.getAttribute('aria-label'));
 old.classList.toggle('explore-scene',state.session?.revealed===true);
 fresh.replaceWith(old);
 if(slide&&oldIndex!==Number(old.dataset.panelIndex)){
  const face=old.querySelector('.back-face');
  face.classList.remove('swipe-enter-right','swipe-enter-left');
  void face.offsetWidth;
  face.classList.add(slide>0?'swipe-enter-right':'swipe-enter-left');
 }
 const flipped=!!state.session?.revealed,flip=old.querySelector('#flipCard');
 if(flipped!==wasFlipped){requestAnimationFrame(()=>{if(flip.isConnected)flip.classList.toggle('flipped',flipped);});}
}

function renderCompletion(){const s=state.session;if(!s)return'';const total=s.rated.length,good=s.rated.filter(x=>x.grade>=3).length,again=s.rated.filter(x=>x.grade===1).length;return `<div class="content completion"><div class="overline">A LITTLE BETTER THAN BEFORE</div><div class="big-star pop">✳</div><h1>That memory work<br><span style="color:#9ae5d5">adds up.</span></h1><p class="muted">You completed your set. Review the hard concepts again when they're due. The strongest knowledge survives a delay.</p><div class="completion-stats"><div><strong>${total}</strong><small>Review ratings</small></div><div><strong>${good}</strong><small>Good / Easy</small></div><div><strong>${s.skipped||0}</strong><small>Skipped (unrated)</small></div></div><div class="btn-row" style="justify-content:center"><button class="btn primary" data-action="start" data-mode="mix">Another quick set ${icon('arrow')}</button><button class="btn" data-page="insights">See progress</button></div></div>`;}
function gradeCurrent(grade){const s=state.session,c=current();if(!s||!c||!s.revealed||transitioning)return;const currentState=cardState(c.id)||{reps:0,lapses:0,bookmark:false,note:''},prev=currentState.lastGrade;const out=schedule(currentState,grade),g=ratingN[grade];state.cards[c.id]={...currentState,...out,reps:(currentState.reps||0)+1,lapses:(currentState.lapses||0)+(g===1?1:0),lastGrade:g,last:NOW()};const log={id:c.id,time:NOW(),grade:g,interval:out.intervalDays,mode:s.mode,wasNew:!currentState.reps};state.history.push(log);s.rated.push(log);if(g===1&&!s.retried[c.id]&&s.queue.length<55){s.retried[c.id]=true;s.queue.splice(Math.min(s.index+4,s.queue.length),0,c.id);}
 s.index++;s.revealed=false;s.panelIndex=0;s.variationRevealed={};s.draft='';if(s.index>=s.queue.length)s.completedAt=NOW();save();haptic();if(g>=3&&prev===1){confetti();toast('You recovered a previously missed concept ✦');}else if(g===1)toast('Again recorded · this card returns soon');else toast(`${grade[0].toUpperCase()+grade.slice(1)} recorded · ${s.rated.length} ratings saved`);render();}
function studySkip(){const s=state.session;if(!s)return;s.skipped=(s.skipped||0)+1;s.index++;s.revealed=false;s.panelIndex=0;s.variationRevealed={};s.draft='';if(s.index>=s.queue.length)s.completedAt=NOW();save();render();}
function detailsHTML(c,preview=false){const st=cardState(c.id)||{};return `<div class="sheet-backdrop" data-action="close-layer"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="Card deep dive"><div class="sheet-handle"></div><div class="sheet-head"><div><div class="overline">${esc(DOMAINS[c.domain].name)} · ${esc(c.objective||'Core')} · ${esc(c.tag)} ${c.status==='legacy'?'· HISTORICAL':''}</div><h2>${preview?'Explore this card':'Go one layer deeper.'}</h2></div><button class="icon-btn" data-action="close-layer" aria-label="Close">${icon('close')}</button></div><div class="sheet-section"><h3>Recall prompt</h3><p style="font-family:var(--serif);font-size:22px;color:#f0faf8">${esc(c.front)}</p></div><div class="sheet-section"><h3>Quick answer</h3><p style="font-size:18px;color:#aeead8;font-weight:700">${format(c.back)}</p></div><div class="sheet-section"><h3>Understand why</h3><p>${esc(c.why)}</p></div>${c.code?`<div class="sheet-section"><h3>Snowflake SQL / syntax</h3><pre class="code-block">${esc(c.code)}</pre></div>`:''}<div class="sheet-section"><h3>Common exam trap</h3><div class="warning-note">${esc(c.trap)}</div></div>${c.related?.length?`<div class="sheet-section"><h3>Connect the ideas</h3><div class="chip-row">${c.related.map(s=>`<button class="chip" data-related="${esc(s)}">${esc(s)} ↗</button>`).join('')}</div></div>`:''}<div class="sheet-section"><h3>Coverage and origin</h3><p>${c.status==='legacy'?'Historical COF-C01/COF-C02 context. This may no longer be an active COF-C03 objective.':'Current COF-C03 study concept.'} ${c.objective&&c.objective!=='Legacy'?'Official objective '+esc(c.objective)+'.':''} This is an original recall prompt, not a confidential certification question.</p></div><div class="sheet-section"><h3>Official documentation</h3><a class="link-chip" href="${esc(c.doc)}" target="_blank" rel="noopener noreferrer">Snowflake documentation ↗</a></div><div class="sheet-section"><h3>Your note</h3><textarea class="note-editor" id="cardNote" data-id="${c.id}" placeholder="Why did you miss this? A short memory hook…">${esc(st.note||'')}</textarea></div><div class="btn-row" style="margin-bottom:8px"><button class="btn ${bookmarked(c.id)?'primary':'quiet'}" data-action="bookmark" data-id="${c.id}">${bookmarked(c.id)?'★ Saved':'☆ Save this card'}</button>${preview?`<button class="btn primary" data-action="study-single" data-id="${c.id}">Study this card ${icon('arrow')}</button>`:''}</div></section>`;}
function showLayer(html){const el=$('#layer');el.innerHTML=html;el.classList.add('show');document.body.style.overflow='hidden';el.querySelector('.sheet')?.focus?.();}
function closeLayer(){const el=$('#layer');el.classList.remove('show');el.innerHTML='';document.body.style.overflow='';}
function settingsHTML(){const s=state.settings;return `<div class="sheet-backdrop" data-action="close-layer"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="Settings"><div class="sheet-handle"></div><div class="sheet-head"><div><div class="overline">PERSONALIZE THE RITUAL</div><h2>Settings & backups</h2></div><button class="icon-btn" data-action="close-layer" aria-label="Close settings">${icon('close')}</button></div><div class="sheet-section"><h3>Review preferences</h3><div class="input-row"><label for="examDate">Certification date</label><input type="date" id="examDate" class="field" value="${esc(s.examDate)}"></div><div class="input-row"><label for="dailyNew">New cards per day (soft target)</label><select id="dailyNew" class="field">${[8,16,24,40].map(v=>`<option value="${v}" ${v===s.dailyNew?'selected':''}>${v}</option>`).join('')}</select></div><div class="input-row"><label for="retention">Target recall rate</label><select id="retention" class="field">${[[.85,'85%'],[.9,'90%'],[.95,'95%']].map(([v,t])=>`<option value="${v}" ${v===s.retention?'selected':''}>${t}</option>`).join('')}</select></div><div class="input-row"><label for="haptics">Subtle haptics (where supported)</label><input type="checkbox" class="switch" id="haptics" ${s.haptics?'checked':''}></div><div class="input-row"><label for="typing">Default to typing in SQL practice</label><input type="checkbox" class="switch" id="typing" ${s.typing?'checked':''}></div></div><div class="sheet-section"><h3>Your data belongs to you</h3><p>All review history, notes, confidence ratings and bookmarks live in this browser and are saved after every action. GitHub Pages does not receive your answers. Different devices and origins do not automatically sync.</p><div class="btn-row" style="margin-top:17px"><button class="btn primary" data-action="export">${icon('download')} Export JSON backup</button><button class="btn quiet" data-action="import">${icon('upload')} Import backup</button></div><div style="margin-top:18px"><button class="btn small warn" data-action="reset">Reset all local study progress</button></div></div><div class="sheet-section"><h3>Install on your phone</h3><p>On iPhone Safari: Share → Add to Home Screen. On supported Android browsers: open the menu → Install app. After its first online visit, the app’s shell and built-in deck can be used offline.</p><div class="btn-row" style="margin-top:14px"><button class="btn quiet" data-action="install" id="installButton">Install if available ${icon('arrow')}</button></div></div><div class="sheet-section"><h3>Scheduling and sources</h3><p>Review scheduling uses published default FSRS-6 parameters with short learning-step safeguards. Current cards follow the July 2026 COF-C03 guide; historical COF-C01/C02 topics are clearly separated and excluded from default sessions. No complete or confidential certification question bank is available.</p><a class="link-chip" target="_blank" rel="noopener noreferrer" href="https://github.com/open-spaced-repetition/awesome-fsrs/wiki/The-Algorithm">FSRS algorithm reference ↗</a></div></section>`;}
function downloadBackup(){const out={app:'SnowPro Recall',exportedAt:new Date().toISOString(),...state};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='snowpro-recall-'+dateOnly(NOW())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),900);toast('Backup downloaded');}
function importBackup(file){const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(reader.result);if(v.version!==1||!v.cards||!Array.isArray(v.history)||!v.settings)throw Error('Not a SnowPro Recall backup');if(!confirm('Restore this backup? It will replace local review progress and settings on this device.'))return;state={...defaultState(),...v,version:1};save();closeLayer();ui.page='home';render();toast('Progress restored');}catch(e){alert('Cannot import backup: '+e.message)}};reader.readAsText(file);}
let deferredInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;});
function install(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();deferredInstallPrompt=null;}else toast('On iPhone Safari use Share → Add to Home Screen');}
function toggleBookmark(id){const prior=cardState(id)||{};state.cards[id]={...prior,bookmark:!prior.bookmark};save();haptic();if(ui.page==='study')renderStudyInPlace();else if(ui.page==='browse')render();if($('#layer').classList.contains('show')){const l=$('#layer');const a=l.querySelector(`[data-action="bookmark"][data-id="${id}"]`);if(a){a.textContent=bookmarked(id)?'★ Saved':'☆ Save this card';a.classList.toggle('primary',bookmarked(id));a.classList.toggle('quiet',!bookmarked(id));}}}
function setupGestures(){/* Drag interaction only on active card; ratings always explicitly confirmed. */}
document.body.addEventListener('click',e=>{const b=e.target.closest('button,[data-action],[data-page],[data-preview],[data-grade],[data-only]');if(!b)return;
 if(b.dataset.page){setPage(b.dataset.page,{domain:b.dataset.domain});return;}
 if(b.dataset.objective){ui.version='current';ui.objective=b.dataset.objective;ui.only='all';ui.domain='all';ui.search='';setPage('browse');return;}
 if(b.dataset.only){ui.only=b.dataset.only;render();return;}
 if(b.dataset.collection){ui.only=b.dataset.collection==='historical'?'all':b.dataset.collection;ui.version=b.dataset.collection==='historical'?'legacy':'current';ui.objective='all';ui.domain='all';ui.search='';setPage('browse');return;}
 if(b.dataset.related){ui.only='all';ui.domain='all';ui.search=b.dataset.related;closeLayer();setPage('browse');return;}
 if(b.dataset.minutesSelect){state.settings.minutes=Number(b.dataset.minutesSelect);save();render();return;}
 if(b.dataset.preview){const c=C.get(b.dataset.preview);if(c)showLayer(detailsHTML(c,true));return;}
 if(b.dataset.grade){gradeCurrent(b.dataset.grade);return;}
 if(b.dataset.panelStep){movePanel((Number(state.session?.panelIndex)||0)+Number(b.dataset.panelStep));return;}
 if(b.dataset.panelIndex!==undefined){movePanel(Number(b.dataset.panelIndex));return;}
 const action=b.dataset.action;if(!action)return;
 if(action==='settings'){showLayer(settingsHTML());return;}
 if(action==='start'){begin(b.dataset.mode||'mix','all',limitFor(Number(b.dataset.minutes)||state.settings.minutes));return;}
 if(action==='resume'){ui.page='study';render();return;}
 if(action==='focus'){begin('mix',b.dataset.domain,limitFor(state.settings.minutes));return;}
 if(action==='start-filtered'){begin('filtered','all',limitFor(state.settings.minutes));return;}
 if(action==='reveal'){reveal();return;}
 if(action==='close-study'){closeSession();return;}
 if(action==='bookmark'){toggleBookmark(b.dataset.id);return;}
 if(action==='details'){const c=C.get(b.dataset.id);if(c)showLayer(detailsHTML(c));return;}
 if(action==='close-layer'){closeLayer();return;}
 if(action==='study-single'){const id=b.dataset.id;closeLayer();begin('single','all',1,[id]);return;}
 if(action==='skip'){studySkip();return;}
 if(action==='export'){downloadBackup();return;}
 if(action==='import'){$('#importPicker').click();return;}
 if(action==='install'){install();return;}
 if(action==='reset'){if(confirm('Permanently reset all your review history and notes on this browser? This cannot be undone without an exported backup.')){if(confirm('Confirm reset one final time?')){state=defaultState();save();closeLayer();ui.page='home';render();toast('Local progress reset');}}return;}
 });

 if(t.id==='domainFilter'){ui.domain=t.value;renderBrowseInto();}
 if(t.id==='versionFilter'){ui.version=t.value;ui.objective='all';renderBrowseInto();}
 if(t.id==='examDate'){state.settings.examDate=t.value;save();toast('Exam date saved');}
 if(t.id==='dailyNew'){state.settings.dailyNew=Number(t.value);save();}

document.body.addEventListener('input',e=>{const t=e.target;if(t.id==='cardSearch'){const start=t.selectionStart;ui.search=t.value;const v=$('#view');v.innerHTML=renderBrowse();const field=$('#cardSearch');field.focus();field.setSelectionRange(start,start);}

 });
const sceneSelector=e=>e.target.closest('#flashScene');
let suppressNextSceneClick=false;
document.body.addEventListener('click',e=>{const scene=sceneSelector(e);if(!scene||ui.page!=='study')return; if(e.target.closest('button,a,textarea'))return; if(suppressNextSceneClick){suppressNextSceneClick=false;return;}tapFlashcard();});
document.body.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#layer').classList.contains('show')){closeLayer();return;}
 if(ui.page!=='study'||$('#layer').classList.contains('show')||e.target.matches('input,textarea,select'))return;
 if(e.target.closest('button,a')&&e.target.id!=='flashScene')return;
 if(state.session?.revealed && e.key==='ArrowRight'){movePanel((Number(state.session.panelIndex)||0)+1);e.preventDefault();return;}
 if(state.session?.revealed && e.key==='ArrowLeft'){movePanel((Number(state.session.panelIndex)||0)-1);e.preventDefault();return;}
 if(e.key===' '||e.key==='Enter'){tapFlashcard();e.preventDefault();return;}
 if(state.session?.revealed&&['1','2','3','4'].includes(e.key)){gradeCurrent(['again','hard','good','easy'][Number(e.key)-1]);}
});
let touch=null;
document.body.addEventListener('pointerdown',e=>{
 const scene=sceneSelector(e);if(!scene||ui.page!=='study'||e.target.closest('button,a,textarea'))return;
 if(e.pointerType==='mouse'&&e.button!==0)return;
 touch={x:e.clientX,y:e.clientY,id:e.pointerId,card:scene,started:NOW(),horizontal:false};
},{passive:true});
document.body.addEventListener('pointermove',e=>{
 if(!touch||e.pointerId!==touch.id||!state.session?.revealed)return;
 const dx=e.clientX-touch.x,dy=e.clientY-touch.y;
 if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.3){
  touch.horizontal=true;
  const face=touch.card.querySelector('.back-face');
  if(face){face.style.transition='none';face.style.setProperty('--drag-x',clamp(dx*.28,-45,45)+'px');face.classList.add('is-dragging');}
 }
},{passive:true});
document.body.addEventListener('pointerup',e=>{
 if(!touch||touch.id!==e.pointerId)return;
 const dx=e.clientX-touch.x,dy=e.clientY-touch.y,wasHorizontal=touch.horizontal;
 touch.card.querySelector('.back-face')?.classList.remove('is-dragging');
 const face=touch.card.querySelector('.back-face');if(face){face.style.removeProperty('--drag-x');face.style.removeProperty('transition');}
 touch=null;
 if(wasHorizontal&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.15&&state.session?.revealed){
  suppressNextSceneClick=true;
  movePanel((Number(state.session.panelIndex)||0)+(dx<0?1:-1));
  // Browsers may not fire click after a drag; reset the suppression shortly.
  setTimeout(()=>{suppressNextSceneClick=false;},320);
 }
},{passive:true});
document.body.addEventListener('pointercancel',()=>{
 if(touch?.card){const face=touch.card.querySelector('.back-face');if(face){face.classList.remove('is-dragging');face.style.removeProperty('--drag-x');face.style.removeProperty('transition');}}
 touch=null;
},{passive:true});
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY){try{const value=JSON.parse(e.newValue);if(value?.version===1){state=value;render();}}catch(e){}}});
const picker=document.createElement('input');picker.type='file';picker.accept='.json,application/json';picker.id='importPicker';picker.hidden=true;document.body.appendChild(picker);
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
render();
