<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>Reality Check</title>
<style>
:root{--bg:#0b1020;--panel:#141b31;--panel2:#1a2340;--text:#f7f8fc;--muted:#9aa6c2;--accent:#7c5cff;--good:#25c281;--bad:#ff5f6d;--line:#2a3556;--shadow:0 18px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#1b2450 0,#0b1020 42%,#080c18 100%);color:var(--text);font-family:ui-rounded,SF Pro Rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh;display:flex;justify-content:center}.app{width:min(100%,680px);padding:20px 18px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand{font-weight:900;letter-spacing:-.04em;font-size:25px}.brand span{color:#9d8bff}.iconbtn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:14px;padding:10px 12px;font-weight:700}.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:24px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#aeb9d8;font-weight:800}.progress{display:flex;gap:7px;margin:12px 0 24px}.pip{height:6px;flex:1;border-radius:10px;background:#27314e}.pip.on{background:#8f7aff}.claim{font-weight:850;font-size:clamp(28px,7vw,42px);line-height:1.08;letter-spacing:-.035em;margin:18px 0 28px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:17px;border-radius:18px;font-weight:850;font-size:18px}.choice.selected{outline:3px solid var(--accent);background:#211d43}.confidenceWrap{margin-top:26px}.confidenceHead{display:flex;justify-content:space-between;align-items:end}.confidenceVal{font-size:32px;font-weight:900}.subtle{color:var(--muted);font-size:14px}.slider{width:100%;margin:14px 0 4px;accent-color:var(--accent)}.ticks{display:flex;justify-content:space-between;color:#76829e;font-size:11px}.primary{width:100%;margin-top:24px;border:0;background:linear-gradient(135deg,#7457ff,#9c62ff);color:#fff;padding:18px;border-radius:18px;font-weight:900;font-size:18px;box-shadow:0 10px 30px rgba(124,92,255,.32)}button:disabled{opacity:.42}.reveal{display:none;margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}.reveal.show{display:block;animation:pop .28s ease}.answer{font-size:24px;font-weight:900}.answer.good{color:var(--good)}.answer.bad{color:var(--bad)}.why{font-size:16px;line-height:1.5;color:#d9def0;margin:10px 0 0}.scoreLine{display:flex;justify-content:space-between;margin-top:18px;background:#0e1428;border-radius:16px;padding:14px 16px}.scoreDelta{font-weight:900}.footerStats{display:flex;gap:10px;margin-top:16px}.mini{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.mini b{display:block;font-size:19px}.result{text-align:center}.bigscore{font-size:64px;font-weight:950;letter-spacing:-.06em;margin:8px 0}.grade{display:inline-block;padding:9px 14px;border-radius:99px;background:#172746;border:1px solid #2f477a;font-weight:850}.rows{margin:24px 0;text-align:left}.row{display:grid;grid-template-columns:34px 1fr 70px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.dot{width:18px;height:18px;border-radius:50%}.dot.g{background:var(--good)}.dot.b{background:var(--bad)}.share{white-space:pre-wrap;background:#090e1d;border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#dbe0f4}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.secondary{border:1px solid var(--line);background:var(--panel2);color:#fff;padding:15px;border-radius:16px;font-weight:850}.homeIntro{text-align:center;padding:14px 0 8px}.hero{font-size:44px;font-weight:950;letter-spacing:-.055em;line-height:.95;margin:16px 0}.hero em{font-style:normal;color:#9986ff}.homeIntro p{color:#b3bdd8;font-size:17px;line-height:1.5}.streak{display:flex;justify-content:center;gap:8px;margin:18px 0;color:#ccd3e7}.tiny{font-size:12px;color:#8390ae;margin-top:18px;text-align:center}.dev{margin-top:16px;display:none}.dev.show{display:block}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#f7f8fc;color:#0b1020;padding:11px 16px;border-radius:99px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}@media(max-width:420px){.card{padding:20px;border-radius:24px}.claim{font-size:31px}.hero{font-size:40px}}
</style>
</head>
<body><main class="app" id="app"></main><div class="toast" id="toast">Copied!</div>
<script>
const QUESTIONS=[
{c:"There are more trees on Earth than stars in the Milky Way.",a:true,w:"Estimates put Earth at roughly 3 trillion trees, while the Milky Way is usually estimated at roughly 100–400 billion stars."},
{c:"A day on Venus is longer than a year on Venus.",a:true,w:"Venus rotates so slowly that one full rotation takes longer than its trip around the Sun."},
{c:"The Great Wall of China is visible from the Moon with the naked eye.",a:false,w:"It is far too narrow to distinguish from lunar distance without magnification."},
{c:"Humans share more than half of their genes with bananas.",a:true,w:"Many basic cellular processes are ancient and shared across plants and animals; common comparisons put shared gene-function ancestry well above half."},
{c:"Lightning never strikes the same place twice.",a:false,w:"Tall structures are struck repeatedly. The Empire State Building, for example, can be hit many times in a year."},
{c:"Oxford University is older than the Aztec Empire.",a:true,w:"Teaching existed at Oxford by the late 11th century; the Aztec Empire formed in the 15th century."},
{c:"Goldfish have a memory span of only three seconds.",a:false,w:"Experiments show goldfish can learn and remember tasks for far longer than a few seconds."},
{c:"There are parts of Canada farther south than parts of California.",a:true,w:"Southern Ontario reaches below the latitude of some of Northern California."},
{c:"The Eiffel Tower can become taller in summer.",a:true,w:"Heat expands the iron structure, changing its height by several centimeters."},
{c:"You can see the curvature of Earth clearly from a normal commercial airplane window.",a:false,w:"At typical airline altitude the curvature is extremely subtle and usually not clearly visible to the naked eye."},
{c:"Sharks existed before trees.",a:true,w:"Early sharks predate the first true trees by tens of millions of years."},
{c:"The human body contains more bacterial cells than human cells by a factor of ten.",a:false,w:"Modern estimates suggest the counts are in roughly the same order of magnitude, not a 10-to-1 bacterial advantage."},
{c:"Nintendo was founded before the first powered airplane flight.",a:true,w:"Nintendo began in 1889; the Wright brothers' first powered flight was in 1903."},
{c:"Water can boil and freeze at the same time.",a:true,w:"At water's triple point, solid, liquid and gas phases can coexist under the right pressure and temperature."},
{c:"Mount Everest is the point on Earth farthest from Earth's center.",a:false,w:"Because Earth bulges at the equator, Chimborazo in Ecuador is farther from Earth's center despite being lower above sea level."}
];
const KEY='realityCheck_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"history":[]}');
let game=null;
const el=id=>document.getElementById(id); const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
function dayKey(d=new Date()){return d.toISOString().slice(0,10)}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function dailySet(){let seed=hash(dayKey());let arr=QUESTIONS.map((q,i)=>({q,i,k:hash(seed+':'+i)})).sort((a,b)=>a.k-b.k);return arr.slice(0,5).map(x=>x.q)}
function todayRecord(){return data.history.find(x=>x.date===dayKey())}
function streak(){let dates=new Set(data.history.map(x=>x.date)),n=0,d=new Date();if(!dates.has(dayKey(d))){d.setDate(d.getDate()-1)}while(dates.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}return n}
function calibrationLabel(acc,conf){let gap=Math.abs(acc-conf);if(gap<=7)return '🎯 Well calibrated';if(conf>acc+7)return '🔥 Overconfident';return '🧊 Underconfident'}
function home(){let done=todayRecord();el('app').innerHTML=`<div class="top"><div class="brand">Reality <span>Check</span></div><button class="iconbtn" onclick="stats()">Stats</button></div><section class="card homeIntro"><div class="eyebrow">Daily game of judgment</div><div class="hero">How well do you know what you <em>know?</em></div><p>Five claims. Choose true or false, then stake your confidence. Being confidently wrong hurts.</p><div class="streak">🔥 ${streak()} day streak · 🧠 ${data.history.length} games</div>${done?`<button class="primary" onclick="resultView(todayRecord())">View today's result</button>`:`<button class="primary" onclick="startGame()">Play today's 5</button>`}<div class="grid2"><button class="secondary" onclick="practice()">Practice round</button><button class="secondary" onclick="toggleDev()">Developer</button></div><div id="dev" class="dev"><button class="secondary" style="width:100%" onclick="resetToday()">Reset today's game</button></div><div class="tiny">No account. Your results stay in this browser.</div></section>`}
function toggleDev(){el('dev').classList.toggle('show')}
function resetToday(){data.history=data.history.filter(x=>x.date!==dayKey());save();home()}
function startGame(){game={date:dayKey(),qs:dailySet(),i:0,answers:[],practice:false};question()}
function practice(){let qs=[...QUESTIONS].sort(()=>Math.random()-.5).slice(0,5);game={date:'practice',qs,i:0,answers:[],practice:true};question()}
function question(){let q=game.qs[game.i];el('app').innerHTML=`<div class="top"><button class="iconbtn" onclick="home()">←</button><div class="brand">Reality <span>Check</span></div><div class="iconbtn">${game.i+1}/5</div></div><section class="card"><div class="eyebrow">Claim ${game.i+1}</div><div class="progress">${[0,1,2,3,4].map(i=>`<div class="pip ${i<=game.i?'on':''}"></div>`).join('')}</div><div class="claim">${q.c}</div><div class="choices"><button id="true" class="choice" onclick="pick(true)">TRUE</button><button id="false" class="choice" onclick="pick(false)">FALSE</button></div><div class="confidenceWrap"><div class="confidenceHead"><div><b>Confidence</b><div class="subtle">How sure are you?</div></div><div id="cv" class="confidenceVal">70%</div></div><input id="conf" class="slider" type="range" min="50" max="100" value="70" oninput="cv.textContent=this.value+'%'"/><div class="ticks"><span>coin flip</span><span>certain</span></div></div><button id="lock" class="primary" disabled onclick="lockAnswer()">Lock it in</button><div id="reveal" class="reveal"></div></section>`;game.pick=null}
function pick(v){game.pick=v;el('true').classList.toggle('selected',v===true);el('false').classList.toggle('selected',v===false);el('lock').disabled=false}
function points(correct,c){let p=Math.round((c-50)*4);return correct?100+p:-(30+Math.round((c-50)*3.4))}
function lockAnswer(){let q=game.qs[game.i],c=+el('conf').value,correct=game.pick===q.a,p=points(correct,c);game.answers.push({correct,confidence:c,points:p,pick:game.pick,answer:q.a});document.querySelectorAll('button,input').forEach(x=>x.disabled=true);let r=el('reveal');r.innerHTML=`<div class="answer ${correct?'good':'bad'}">${correct?'✓ Correct':'✕ Wrong'} · ${q.a?'TRUE':'FALSE'}</div><p class="why">${q.w}</p><div class="scoreLine"><span>${c}% confidence</span><span class="scoreDelta">${p>=0?'+':''}${p} pts</span></div><button class="primary" onclick="nextQ()">${game.i===4?'See results':'Next claim'}</button>`;r.classList.add('show')}
function nextQ(){if(game.i<4){game.i++;question()}else finish()}
function finish(){let total=game.answers.reduce((s,a)=>s+a.points,0),correct=game.answers.filter(a=>a.correct).length,avg=Math.round(game.answers.reduce((s,a)=>s+a.confidence,0)/5),acc=correct*20;let rec={date:game.date,total,correct,avg,acc,answers:game.answers};if(!game.practice){data.history=data.history.filter(x=>x.date!==game.date);data.history.push(rec);save()}resultView(rec)}
function shareText(r){let n=data.history.findIndex(x=>x.date===r.date)+1;let rows=r.answers.map(a=>`${a.correct?'🟢':'🔴'} ${a.confidence}%${!a.correct&&a.confidence>=90?' 💥':''}`).join('\n');return `REALITY CHECK #${String(Math.max(n,1)).padStart(3,'0')}\n\n${rows}\n\n${r.total} 🧠\n${calibrationLabel(r.acc,r.avg)}\n\nreality-check`}
function resultView(r){let lab=calibrationLabel(r.acc,r.avg),text=shareText(r);el('app').innerHTML=`<div class="top"><button class="iconbtn" onclick="home()">←</button><div class="brand">Reality <span>Check</span></div><button class="iconbtn" onclick="stats()">Stats</button></div><section class="card result"><div class="eyebrow">${r.date==='practice'?'Practice complete':'Today complete'}</div><div class="bigscore">${r.total}</div><div class="subtle">points · ${r.correct}/5 correct</div><div class="grade">${lab}</div><div class="rows">${r.answers.map((a,i)=>`<div class="row"><div class="dot ${a.correct?'g':'b'}"></div><div>Claim ${i+1}</div><b>${a.confidence}%</b></div>`).join('')}</div><div class="footerStats"><div class="mini"><b>${r.avg}%</b><span class="subtle">confidence</span></div><div class="mini"><b>${r.acc}%</b><span class="subtle">accuracy</span></div></div><div class="share" id="share">${text}</div><div class="grid2"><button class="secondary" onclick="copyShare()">Copy result</button><button class="secondary" onclick="nativeShare()">Share…</button></div></section>`}
async function copyShare(){await navigator.clipboard.writeText(el('share').textContent);toast()}
async function nativeShare(){let t=el('share').textContent;if(navigator.share){try{await navigator.share({title:'Reality Check',text:t})}catch(e){}}else copyShare()}
function toast(){let t=el('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)}
function stats(){let h=data.history;if(!h.length){alert('Play your first daily game to unlock stats.');return}let games=h.length,acc=Math.round(h.reduce((s,r)=>s+r.acc,0)/games),conf=Math.round(h.reduce((s,r)=>s+r.avg,0)/games),best=Math.max(...h.map(r=>r.total));el('app').innerHTML=`<div class="top"><button class="iconbtn" onclick="home()">←</button><div class="brand">Your <span>Stats</span></div><div></div></div><section class="card"><div class="hero" style="font-size:36px">Your judgment profile</div><div class="footerStats"><div class="mini"><b>${games}</b><span class="subtle">games</span></div><div class="mini"><b>${streak()}</b><span class="subtle">streak</span></div></div><div class="footerStats"><div class="mini"><b>${acc}%</b><span class="subtle">accuracy</span></div><div class="mini"><b>${conf}%</b><span class="subtle">confidence</span></div></div><div class="footerStats"><div class="mini"><b>${best}</b><span class="subtle">best score</span></div><div class="mini"><b>${calibrationLabel(acc,conf).replace(/^.. /,'')}</b><span class="subtle">calibration</span></div></div><button class="primary" onclick="home()">Back to game</button></section>`}
home();
</script></body></html>
