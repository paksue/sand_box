<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>Watchdeck — loading</title>
<style>
html,body{margin:0;min-height:100%;background:#090b0f;color:#f5f7fb;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(440px,100%);padding:28px;border:1px solid #232a35;border-radius:20px;background:#10141b;text-align:center}
.mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;margin:0 auto 14px;background:linear-gradient(145deg,#f5c451,#f08d49);color:#111;font-weight:900}
h1{margin:0 0 8px;font-size:24px}p{margin:0;color:#8d96a7}.error{color:#ff9b9b}
</style>
</head>
<body>
<main><div class="card"><div class="mark">W</div><h1>Watchdeck</h1><p id="status">Loading your watch console…</p></div></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if(!('DecompressionStream' in window)) throw new Error('This browser is too old to unpack Watchdeck.');
    const parts=await Promise.all([0,1,2,3,4].map(async i=>{
      const r=await fetch('.payload/'+i+'.b64',{cache:'no-store'});
      if(!r.ok) throw new Error('Release payload '+i+' could not be loaded.');
      return (await r.text()).trim();
    }));
    const raw=atob(parts.join('').replace(/\s/g,''));
    const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open(); document.write(html); document.close();
  }catch(err){
    console.error(err);
    status.className='error';
    status.textContent='Watchdeck could not load. '+(err?.message||'Please refresh and try again.');
  }
})();
</script>
</body>
</html>
