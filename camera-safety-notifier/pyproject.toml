[project]
name = "camera-safety-notifier"
version = "0.1.0"
description = "Metadata-only public-service workflow for notifying responsible parties about potentially exposed network cameras."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
