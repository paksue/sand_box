<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020711"><title>WorldTap Daily</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#020711;color:#f5fbff;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}.card{width:min(92vw,480px);padding:28px;border:1px solid #ffffff22;border-radius:28px;background:#07111ee8;text-align:center;box-shadow:0 30px 90px #0008}.logo{font-size:58px}h1{font-size:44px;letter-spacing:-.06em;margin:8px}.date{color:#73e9ff;font-size:11px;font-weight:900;letter-spacing:.12em}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.stat{padding:12px 5px;border:1px solid #ffffff16;border-radius:14px;background:#ffffff08}.stat b{display:block;font-size:20px}.stat small{color:#9fb4c6;font-size:9px}.btn{border:0;border-radius:16px;padding:14px 20px;font-weight:950;font-size:16px;background:#78e5a5;color:#05130a;min-width:230px}.sub{color:#9fb4c6;font-size:12px;line-height:1.5;margin:12px auto 20px;max-width:360px}.rounds{display:flex;justify-content:center;gap:6px;margin:15px}.dot{width:34px;height:8px;border-radius:9px;background:#ffffff18}.dot.done{background:#78e5a5}.note{margin-top:14px;color:#9fb4c6;font-size:10px}</style></head><body><main class="card"><div class="logo">🌍</div><div class="date" id="date"></div><h1>WorldTap</h1><p class="sub" id="copy">Five places. One beautiful Earth. Learn the world by trying to find it.</p><div class="stats"><div class="stat"><b id="streak">0</b><small>DAY STREAK</small></div><div class="stat"><b id="avg">—</b><small>7-DAY AVG</small></div><div class="stat"><b id="best">—</b><small>RECENT BEST</small></div></div><div class="rounds" id="rounds"></div><button class="btn" id="play">PLAY TODAY</button><div class="note" id="note">Progress saves automatically on this device.</div></main><script type="module">import{dateKey,dailySet,loadDay,initialState,saveDay,streak,sevenDayAverage,recentHistory}from'./daily-engine.js';const key=dateKey(),set=dailySet(key),state=loadDay(key)||initialState(key),$=x=>document.getElementById(x);$('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase();$('streak').textContent=streak();$('avg').textContent=sevenDayAverage()||'—';const hist=recentHistory();$('best').textContent=hist.length?Math.max(...hist.map(x=>x.total)):'—';$('rounds').innerHTML=set.map((_,i)=>`<span class="dot ${i<state.results.length?'done':''}"></span>`).join('');if(state.completed){$('play').textContent=`TODAY COMPLETE · ${state.total}/1000`;$('copy').textContent='You finished today’s WorldTap. Come back tomorrow for five new places.';$('play').onclick=()=>location.href='./daily-touch.html?mode=review'}else if(state.results.length){$('play').textContent=`RESUME · ROUND ${state.results.length+1}/5`;$('copy').textContent=`${state.results.length} of 5 places complete. Your exact progress is saved.`;$('play').onclick=()=>location.href='./daily-touch.html?daily=1'}else{$('play').onclick=()=>{saveDay(state,key);location.href='./daily-touch.html?daily=1'}}window.__WORLDTAP_SHELL__={key,set,state};</script></body></html>
