name: Personalized gesture check

on:
  push:
    branches: [gesture-personalized-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check isometric-timer/js/hands-free/gesture-adapter.js
          node --check isometric-timer/js/hands-free/intent-gate.js
          node --check isometric-timer/js/hands-free/landmark-features.js
          node --check isometric-timer/js/hands-free/personalized-classifier.js
          node --check isometric-timer/js/hands-free/personalized-profile.js
          node --check isometric-timer/js/training/zip-store-reader.js
          node --check isometric-timer/js/training/personalized-trainer.js
          node --check isometric-timer/js/training/personalized-trainer-ui.js
          node --check isometric-timer/sw.js
      - name: Run pure personalized tests
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module -e "import('./isometric-timer/tests/personalized-gesture.test.js').then(m => m.runPersonalizedGestureTests())"
      - name: Validate public NONE asset
        shell: bash
        run: |
          python - <<'PY'
          import json, math
          path='isometric-timer/assets/models/hagrid-negative-features-v1.json'
          with open(path) as f:
              data=json.load(f)
          assert data['count'] == 300
          assert len(data['samples']) == 300
          assert data['featureSize'] == 63
          assert all(len(sample['f']) == 63 for sample in data['samples'])
          assert all(math.isfinite(value) for sample in data['samples'] for value in sample['f'])
          assert all(set(sample) == {'f'} for sample in data['samples'])
          print('HaGRID NONE feature asset valid: 300 x 63')
          PY
      - name: Validate privacy and installer wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'personalizedZipInput' isometric-timer/train-gestures.html
          grep -q 'Personalized v1 stores normalized hand-shape feature numbers locally' isometric-timer/index.html
          grep -q "hold-core-v2.1.0" isometric-timer/sw.js
          ! grep -R '/mnt/data/hold-gesture-dataset' isometric-timer
