name: Frontier Journey Classic Auto-Travel

on:
  push:
    branches:
      - main
      - agent/classic-autotravel-v11
    paths:
      - 'frontier-journey/**'
      - '.github/workflows/frontier-classic-autotravel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start static game server
        run: |
          python3 -m http.server 4173 --directory frontier-journey >/tmp/frontier-http.log 2>&1 &
          sleep 2

      - name: Test continuous travel and stationary days
        env:
          FRONTIER_URL: http://127.0.0.1:4173/
        run: node frontier-journey/tests/classic-autotravel.mjs
