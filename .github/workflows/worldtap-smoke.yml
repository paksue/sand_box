name: WorldTap Smoke

on:
  push:
    paths:
      - 'worldtap-next/**'
      - '.github/workflows/worldtap-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8000 > /tmp/worldtap-http.log 2>&1 &
          sleep 2
      - name: Run WorldTap smoke test
        run: npx playwright test worldtap-next/tests/daily-touch.spec.js --reporter=line
