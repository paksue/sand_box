name: Tag Arena Production Validation

on:
  push:
    branches:
      - 'agent/tag-arena-*'
    paths:
      - 'tag-arena/**'
      - '.github/workflows/tag-arena-validation.yml'
  pull_request:
    paths:
      - 'tag-arena/**'
      - '.github/workflows/tag-arena-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bootstrap current npm
        run: |
          npm install --global npm@12.0.2
          npm --version

      - name: Install pinned production dependencies
        working-directory: tag-arena
        run: |
          if ! npm install --no-audit --no-fund; then
            echo '--- npm debug log ---'
            cat ~/.npm/_logs/*-debug-0.log || true
            exit 1
          fi

      - name: Commit generated lockfile on migration branch
        if: github.event_name == 'push' && github.ref_name == 'agent/tag-arena-production-stack'
        run: |
          if git ls-files --error-unmatch tag-arena/package-lock.json >/dev/null 2>&1 && \
             [ -z "$(git status --porcelain -- tag-arena/package-lock.json)" ]; then
            echo 'package-lock.json already tracked and unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tag-arena/package-lock.json
          git commit -m 'build(tag-arena): lock production dependencies'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Typecheck, unit/equivalence tests, and production build
        working-directory: tag-arena
        run: npm run check

      - name: Install Playwright Chromium
        working-directory: tag-arena
        run: npx playwright install --with-deps chromium

      - name: Start Vite production dev server
        working-directory: tag-arena
        run: |
          npm run dev >/tmp/tag-arena-vite.log 2>&1 &
          echo $! >/tmp/tag-arena-vite.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4178/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tag-arena-vite.log
          exit 1

      - name: Drive Pixi production runtime in Chromium
        working-directory: tag-arena
        env:
          TAG_ARENA_URL: http://127.0.0.1:4178
        run: npm run test:browser

      - name: Upload production-stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tag-arena-production-stack
          path: |
            tag-arena/test-results/
            tag-arena/package-lock.json
            tag-arena/dist/
          if-no-files-found: warn

      - name: Show Vite log on failure
        if: failure()
        run: cat /tmp/tag-arena-vite.log || true
