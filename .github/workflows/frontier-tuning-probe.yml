name: Frontier Journey Balance Tuning Probe

on:
  push:
    branches:
      - agent/balance-tuning-probe
    paths:
      - 'frontier-journey/**'
      - '.github/workflows/frontier-tuning-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tuning-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start static game server
        run: |
          python3 -m http.server 4173 --directory frontier-journey >/tmp/frontier-http.log 2>&1 &
          sleep 2

      - name: Run controlled tuning candidates
        env:
          FRONTIER_URL: http://127.0.0.1:4173/
        run: node frontier-journey/tests/tuning-probe.mjs

      - name: Upload tuning results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-tuning-probe-results
          path: frontier-journey/test-results-tuning/
          if-no-files-found: ignore
