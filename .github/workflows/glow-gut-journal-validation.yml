name: Glow Gut Journal validation

on:
  push:
    paths:
      - 'glow-gut-journal/**'
      - '.github/workflows/glow-gut-journal-validation.yml'
  pull_request:
    paths:
      - 'glow-gut-journal/**'
      - '.github/workflows/glow-gut-journal-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check glow-gut-journal/app.js
          node --check glow-gut-journal/patch.js
          node --check glow-gut-journal/qa-fixes.js
          node --check glow-gut-journal/qa-data-integrity.js
          node --check glow-gut-journal/coverage.js
          node --check glow-gut-journal/qa-summary-stable.js
          node --check glow-gut-journal/polish.js
          node --check glow-gut-journal/db.js
          node --check glow-gut-journal/sw.js
          node --check glow-gut-journal/tests/playtest.spec.mjs
          node --check glow-gut-journal/tests/round2.spec.mjs
          node --check glow-gut-journal/tests/visual.spec.mjs
          node --check glow-gut-journal/tests/live-smoke.mjs
      - name: Source coverage and UX contracts
        run: node glow-gut-journal/tests/validate.mjs
      - name: Install Playwright
        working-directory: glow-gut-journal
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Mobile browser playtest
        working-directory: glow-gut-journal
        run: npx playwright test
      - name: Upload mobile visual review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glow-mobile-review-${{ github.run_number }}
          path: glow-gut-journal/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify deployed GitHub Pages build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node glow-gut-journal/tests/live-smoke.mjs
