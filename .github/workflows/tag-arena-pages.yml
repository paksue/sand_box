name: Tag Arena Compiled Preview

on:
  push:
    branches:
      - main
    paths:
      - 'tag-arena/**'
      - '.github/workflows/tag-arena-pages.yml'
  pull_request:
    paths:
      - 'tag-arena/**'
      - '.github/workflows/tag-arena-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-arena-compiled-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use current npm CLI
        run: npm install --global npm@12.0.2

      - name: Install locked dependencies
        working-directory: tag-arena
        run: npm ci --no-audit --no-fund

      - name: Build compiled Tag Arena preview
        working-directory: tag-arena
        run: npm run build -- --base=/sand_box/previews/tag-arena/

      - name: Verify deployable asset paths
        run: |
          test -f tag-arena/dist/index.html
          grep -q '/sand_box/previews/tag-arena/assets/' tag-arena/dist/index.html
          test -d tag-arena/dist/assets

      - name: Upload compiled preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: tag-arena-compiled-preview
          path: tag-arena/dist
          if-no-files-found: error

      - name: Publish compiled preview into branch-based Pages tree
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -rf previews/tag-arena
          mkdir -p previews/tag-arena
          cp -a tag-arena/dist/. previews/tag-arena/
          touch previews/tag-arena/.nojekyll

          test -f previews/tag-arena/index.html
          grep -q '/sand_box/previews/tag-arena/assets/' previews/tag-arena/index.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/tag-arena

          if git diff --cached --quiet; then
            echo 'Compiled Tag Arena preview is already current.'
          else
            git commit -m 'Publish Tag Arena compiled preview'
            git push origin HEAD:main
          fi
