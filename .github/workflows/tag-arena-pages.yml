name: Tag Arena Pages

on:
  push:
    branches:
      - main
    paths:
      - 'tag-arena/**'
      - '.github/workflows/tag-arena-pages.yml'
  pull_request:
    paths:
      - 'tag-arena/**'
      - '.github/workflows/tag-arena-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tag-arena-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use current npm CLI
        run: npm install --global npm@12.0.2

      - name: Install locked dependencies
        working-directory: tag-arena
        run: npm ci --no-audit --no-fund

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Tag Arena for its repo subpath
        working-directory: tag-arena
        run: npm run build -- --base=/sand_box/tag-arena/

      - name: Assemble multi-app Pages site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='tag-arena/' \
            ./ _site/
          mkdir -p _site/tag-arena
          cp -a tag-arena/dist/. _site/tag-arena/
          touch _site/.nojekyll

          test -f _site/tag-arena/index.html
          grep -q '/sand_box/tag-arena/assets/' _site/tag-arena/index.html

      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy multi-app site with Tag Arena subpath
        id: deployment
        uses: actions/deploy-pages@v4
