name: Tag Arena Pages

on:
  push:
    branches:
      - main
    paths:
      - 'tag-arena/**'
      - '.github/workflows/tag-arena-pages.yml'
  pull_request:
    paths:
      - 'tag-arena/**'
      - '.github/workflows/tag-arena-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tag-arena-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use current npm CLI
        run: npm install --global npm@12.0.2

      - name: Install locked dependencies
        working-directory: tag-arena
        run: npm ci --no-audit --no-fund

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Tag Arena for project Pages
        working-directory: tag-arena
        run: npm run build -- --base=/sand_box/

      - name: Upload Tag Arena Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: tag-arena/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Tag Arena to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
