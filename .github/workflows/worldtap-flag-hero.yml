name: WorldTap Flag Hero
on:
  push:
    paths:
      - 'worldtap-next/tools/apply_flag_hero.py'
      - '.github/workflows/worldtap-flag-hero.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply flag hero patch
        run: python3 worldtap-next/tools/apply_flag_hero.py
      - name: Commit flag hero UI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worldtap-next/daily-touch.html
          git diff --cached --quiet && exit 0
          git commit -m "Add large SVG flag clue template"
          git push
