name: Install todo sync v2

on:
  push:
    paths:
      - .github/workflows/install-todo-sync-v2.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add sync v2 script to todo app
        shell: python
        run: |
          from pathlib import Path
          path = Path('todo/index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="./sync-v2.js?v=20260814-1"></script>'
          if tag not in text:
              text = text.replace('</body>', f'  {tag}\n</body>')
          path.write_text(text, encoding='utf-8')
      - name: Commit installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add todo/index.html
          git rm .github/workflows/install-todo-sync-v2.yml
          git commit -m "Enable source-of-truth sync UI"
          git push
