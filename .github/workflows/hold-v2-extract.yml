name: Hold V2 one-shot deploy

on:
  push:
    branches: [hold-v2-deploy]
    paths:
      - '.v2parts/**'
      - '.github/workflows/hold-v2-extract.yml'

permissions:
  contents: write

jobs:
  extract-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hold-v2-deploy
          fetch-depth: 0

      - name: Reconstruct verified V2 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .v2parts/part-* | base64 -d > /tmp/hold-v2.tar.gz
          echo '31346ac819355a843ec4d8c36f5a0def19da53f52483b14a8d9c8a5f7548efbf  /tmp/hold-v2.tar.gz' | sha256sum -c -
          tar -xzf /tmp/hold-v2.tar.gz -C isometric-timer

      - name: Verify modules and pure tests
        shell: bash
        run: |
          set -euo pipefail
          printf '{"type":"module"}\n' > isometric-timer/package.json
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find isometric-timer/js isometric-timer/workers isometric-timer/tests -name '*.js' -print0)
          cd isometric-timer
          node --input-type=module <<'NODE'
          const suites = [
            ['./tests/timer-machine.test.js', 'runTimerMachineTests'],
            ['./tests/progression.test.js', 'runProgressionTests'],
            ['./tests/command-router.test.js', 'runCommandRouterTests'],
            ['./tests/persistence.test.js', 'runPersistenceTests']
          ];
          for (const [path, name] of suites) {
            const mod = await import(path);
            await mod[name]();
            console.log(`PASS ${path}`);
          }
          NODE
          rm package.json

      - name: Replace staging files with source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v2parts
          rm -f .github/workflows/hold-v2-extract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement Hold Timer V2'
          git push origin HEAD:hold-v2-deploy
