name: Camera Safety CamScout Tests

on:
  push:
    branches: [main]
    paths:
      - 'camera-safety-notifier/camscout/**'
      - 'camera-safety-notifier/client/**'
      - 'previews/camera-safety-notifier/**'
      - '.github/workflows/camera-safety-camscout-tests.yml'
  pull_request:
    paths:
      - 'camera-safety-notifier/camscout/**'
      - 'camera-safety-notifier/client/**'
      - 'previews/camera-safety-notifier/**'
      - '.github/workflows/camera-safety-camscout-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camscout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: camera-safety-notifier/camscout
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run CamScout tests
        run: pytest -q
      - name: Validate example authorization plan
        run: camscout plan --targets examples/targets.txt --allowlist examples/allowlist.txt

  browser-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse browser JavaScript
        run: node --check camera-safety-notifier/client/app.js
      - name: Verify published preview mirrors source
        run: |
          cmp camera-safety-notifier/client/index.html previews/camera-safety-notifier/index.html
          cmp camera-safety-notifier/client/style.css previews/camera-safety-notifier/style.css
          cmp camera-safety-notifier/client/app.js previews/camera-safety-notifier/app.js
