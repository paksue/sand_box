name: Integrate WorldTap Daily
on:
  push:
    paths:
      - '.github/workflows/worldtap-integrate-daily.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Gold game script with Daily Engine integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worldtap-next/daily-touch.html')
          s=p.read_text()
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script></body></html>',start)
          js=r'''
import {dateKey,dailySet,loadDay,saveDay,initialState,recordRound,TapGuard} from './daily-engine.js';
const $=id=>document.getElementById(id),els={topbar:$('topbar'),round:$('roundLabel'),category:$('category'),question:$('question'),sub:$('subtext'),running:$('runningTotal'),fps:$('fps'),status:$('status'),tip:$('tip'),flash:$('flash'),result:$('result'),place:$('place'),distance:$('distance'),roundScore:$('roundScore'),fact:$('fact'),learning:$('learning'),neighbors:$('neighbors'),next:$('nextBtn'),controls:$('controls'),hint:$('hintBtn'),intro:$('intro'),play:$('playBtn'),summary:$('summary'),final:$('finalScore'),blocks:$('blocks'),summaryText:$('summaryText'),share:$('shareBtn'),again:$('againBtn'),memoryCard:$('memoryCard'),memoryTitle:$('memoryTitle'),memoryCopy:$('memoryCopy'),memory:$('memoryBtn'),zoompad:$('zoompad'),zin:$('zoomIn'),zout:$('zoomOut')};
const REGION_CENTERS={Africa:[20,3],Asia:[90,28],Americas:[-75,5],Europe:[15,50],Oceania:[145,-24],Arctic:[-165,67]};
const DETAILS={
'Nairobi':{fact:'Nairobi is Kenya’s capital and one of East Africa’s major urban centers.',anchor:'Kenya is in East Africa, just south of Ethiopia and north of Tanzania.',chips:['↑ ETHIOPIA','← UGANDA','KENYA','SOMALIA →','↓ TANZANIA'],context:[['ETHIOPIA',[39.5,8.5]],['UGANDA',[32.3,1.4]],['NAIROBI',[36.8219,-1.2921],1],['SOMALIA',[45.1,5.1]],['TANZANIA',[34.9,-6.1]]]},
'Laos':{fact:'Laos is the only landlocked country in mainland Southeast Asia.',anchor:'Laos sits between Thailand and Vietnam, south of China.',chips:['CHINA ↑','← THAILAND','LAOS','VIETNAM →','CAMBODIA ↓'],context:[['CHINA',[103.8,25]],['THAILAND',[100.6,15.7]],['LAOS',[102.6,17.97],1],['VIETNAM',[106.2,17]],['CAMBODIA',[104.8,12.8]]]},
'Machu Picchu':{fact:'Machu Picchu is a 15th-century Inca site high in Peru’s Andes.',anchor:'Peru lies on South America’s Pacific side; Machu Picchu is inland in the Andes near Cusco.',chips:['PERU','ANDES','CUSCO','PACIFIC ←'],context:[['PACIFIC',[-78,-13]],['PERU',[-74.5,-9]],['CUSCO',[-71.97,-13.53]],['MACHU PICCHU',[-72.545,-13.1631],1]]},
'Cape Canaveral':{fact:'Apollo 11 launched from Kennedy Space Center on July 16, 1969.',anchor:'Cape Canaveral is on Florida’s Atlantic coast, east of Orlando.',chips:['FLORIDA','ATLANTIC →','ORLANDO ←','CAPE CANAVERAL'],context:[['ORLANDO',[-81.38,28.54]],['FLORIDA',[-81.7,27.8]],['CAPE CANAVERAL',[-80.604,28.6084],1],['ATLANTIC',[-78.7,28.4]]]},
'Strait of Hormuz':{fact:'The Strait of Hormuz connects the Persian Gulf with the Gulf of Oman.',anchor:'It is squeezed between Iran to the north and Oman to the south.',chips:['IRAN ↑','PERSIAN GULF ←','HORMUZ','OMAN ↓'],context:[['IRAN',[55.5,28]],['PERSIAN GULF',[52,26]],['STRAIT OF HORMUZ',[56.25,26.55],1],['OMAN',[56.5,24.4]]]}
};
function enrich(q){const d=DETAILS[q.name]||{},r=q.region||'the world',rc=REGION_CENTERS[r]||q.coords;return{...q,symbol:q.category==='Flag'?q.flag:'',fact:d.fact||`${q.name} is today’s ${q.category.toLowerCase()} location in ${r}.`,anchor:d.anchor||`Place ${q.name} in ${r}; use the surrounding coastlines and countries as your memory hook.`,chips:d.chips||[r.toUpperCase(),q.name.toUpperCase()],context:d.context||[[r.toUpperCase(),rc],[q.name.toUpperCase(),q.coords,1]]}}
const DAILY_KEY=dateKey();
const QUESTIONS=dailySet(DAILY_KEY).map(enrich);
let dayState=loadDay(DAILY_KEY)||initialState(DAILY_KEY),maplibregl,THREE,map,effects,index=0,results=[],total=0,locked=true,animating=false,hinted=false,reviewing=false,reviewQuestion=null,labels=[],raf=0,mapReady=false,startQueued=false,practiceMode=false;
const tapGuard=new TapGuard();
function hydrated(){return(dayState.results||[]).map((r,i)=>({...r,q:QUESTIONS.find(q=>q.id===r.qId)||QUESTIONS[i]}))}
function syncIntro(){dayState=loadDay(DAILY_KEY)||dayState||initialState(DAILY_KEY);const p=els.intro.querySelector('p');if(dayState.completed){els.play.textContent=`TODAY COMPLETE · ${dayState.total}/1000`;if(p)p.textContent='Today is complete. Your score is saved on this device.'}else if(dayState.results?.length){els.play.textContent=`RESUME · ROUND ${dayState.results.length+1}/5`;if(p)p.textContent=`${dayState.results.length} of 5 places complete. Continue exactly where you left off.`}else{els.play.textContent='PLAY TODAY';if(p)p.textContent='Five places. One beautiful Earth. Learn the world by trying to find it.'}}
syncIntro();
function handlePlay(){if(mapReady){startGame();return}startQueued=true;els.play.textContent='PREPARING GLOBE…';els.status.textContent='Finishing globe setup…';els.status.classList.remove('hidden','error')}
els.play.addEventListener('click',handlePlay);
async function loadModule(a,b){try{return await import(a)}catch(e){return await import(b)}}
try{[maplibregl,THREE]=await Promise.all([loadModule('https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.mjs','https://cdn.jsdelivr.net/npm/maplibre-gl@6.0.0/dist/maplibre-gl.mjs'),loadModule('https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js','https://unpkg.com/three@0.184.0/build/three.module.js')]);start()}catch(e){console.error(e);els.status.textContent='Renderer modules failed to load.';els.status.classList.add('error')}
function style(){return{version:8,projection:{type:'globe'},sources:{world:{type:'vector',url:'https://demotiles.maplibre.org/tiles/tiles.json'}},layers:[{id:'background',type:'background',paint:{'background-color':'#06111e'}},{id:'land',type:'fill',source:'world','source-layer':'countries',paint:{'fill-color':'#25585a'}},{id:'coast',type:'line',source:'world','source-layer':'countries',paint:{'line-color':'#78c9cf','line-width':['interpolate',['linear'],['zoom'],0,.55,3,1.15,6,2.5],'line-opacity':.83}},{id:'borders',type:'line',source:'world','source-layer':'countries',paint:{'line-color':'#b6d9d1','line-width':['interpolate',['linear'],['zoom'],0,.22,4,.68],'line-opacity':['interpolate',['linear'],['zoom'],0,.18,2,.31,5,.54]}}],sky:{'atmosphere-blend':['interpolate',['linear'],['zoom'],0,.88,4,.74,7,0]}}}
function start(){try{map=new maplibregl.Map({container:'map',style:style(),center:[18,14],zoom:.64,minZoom:.18,maxZoom:5,pitch:0,maxPitch:0,bearing:0,renderWorldCopies:false,dragRotate:false,touchPitch:false,touchZoomRotate:{around:'center'},cooperativeGestures:false,attributionControl:true,canvasContextAttributes:{antialias:true,powerPreference:'high-performance'}});map.touchZoomRotate.disableRotation();map.touchZoomRotate.setZoomRate(1.3);map.touchZoomRotate.setZoomThreshold(.04)}catch(e){console.error(e);els.status.textContent='Could not create the globe.';els.status.classList.add('error');return}
map.on('load',()=>{try{addLayers();effects=makeEffects();map.addLayer(effects);mapReady=true;els.status.classList.add('hidden');syncIntro();map.resize();window.__WORLDTAP_TEST__={get state(){return loadDay(DAILY_KEY)},get index(){return index},get total(){return total},get map(){return map},tapGuard};if(startQueued){startQueued=false;startGame()}}catch(e){console.error('Map setup failed',e);els.status.textContent='Globe setup failed: '+(e?.message||'unknown error');els.status.classList.remove('hidden');els.status.classList.add('error')}});
map.on('error',e=>{console.warn('MapLibre',e.error||e);if(!mapReady){els.status.textContent='Globe is still loading map data…';els.status.classList.remove('hidden')}});
map.on('click',e=>{if(locked||animating||isSummary())return;if(!tapGuard.canSubmit()){els.sub.textContent='Globe still moving… tap once it settles.';return}guess([e.lngLat.lng,e.lngLat.lat])});
const beginMove=()=>{tapGuard.interaction();els.tip.classList.add('hide')},endMove=()=>{tapGuard.interaction();tapGuard.settled()};map.on('dragstart',beginMove);map.on('zoomstart',beginMove);map.on('dragend',endMove);map.on('zoomend',endMove);window.addEventListener('resize',()=>map.resize());fps()}
function addLayers(){map.addSource('guess',{type:'geojson',data:fc([])});map.addLayer({id:'guess',type:'circle',source:'guess',paint:{'circle-radius':6,'circle-color':'#ff7d8a','circle-stroke-color':'#fff','circle-stroke-width':2}});map.addSource('route',{type:'geojson',data:fc([])});map.addLayer({id:'routeGlow',type:'line',source:'route',paint:{'line-color':'#54e7ff','line-width':6,'line-opacity':.18,'line-blur':5}});map.addLayer({id:'routeCore',type:'line',source:'route',paint:{'line-color':'#c6f9ff','line-width':2,'line-opacity':.97}});map.addSource('answer',{type:'geojson',data:fc([])});map.addLayer({id:'answer',type:'circle',source:'answer',paint:{'circle-radius':6,'circle-color':'#7cf0a5','circle-stroke-color':'#fff','circle-stroke-width':2}})}
function makeEffects(){return{id:'effects',type:'custom',renderingMode:'3d',onAdd(m,gl){this.map=m;this.camera=new THREE.Camera();this.renderer=new THREE.WebGLRenderer({canvas:m.getCanvas(),context:gl,antialias:true});this.renderer.autoClear=false;this.gScene=new THREE.Scene();this.tScene=new THREE.Scene();this.vScene=new THREE.Scene();this.g=pulse(0xff7d8a);this.t=beacon();this.v=traveler();this.gScene.add(this.g.group);this.tScene.add(this.t.group);this.vScene.add(this.v.group);this.gCoord=null;this.tCoord=[0,0];this.tOn=false;this.vCoord=[0,0];this.vOn=false},fire(c){this.gCoord=c;this.born=performance.now();this.map.triggerRepaint()},target(c,v){this.tCoord=c;this.tOn=v;this.map.triggerRepaint()},travel(c,v=true){this.vCoord=c;this.vOn=v;this.map.triggerRepaint()},clear(){this.gCoord=null;this.tOn=false;this.vOn=false},render(gl,args){const n=performance.now();this.renderer.resetState();if(this.gCoord&&n-this.born<1100){const a=(n-this.born)/1000;this.g.ring.scale.setScalar(1+a*2.7);this.g.ring.material.opacity=Math.max(0,.75-a*.65);renderAt(this,this.gScene,this.gCoord,args,52000);this.map.triggerRepaint()}if(this.vOn){renderAt(this,this.vScene,this.vCoord,args,61000);this.map.triggerRepaint()}if(this.tOn){const p=.95+.11*Math.sin(n*.006);this.t.ring.scale.setScalar(p);renderAt(this,this.tScene,this.tCoord,args,50000);this.map.triggerRepaint()}}}}
function pulse(color){const group=new THREE.Group(),ring=new THREE.Mesh(new THREE.TorusGeometry(.45,.055,14,64),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.75,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));ring.position.z=.03;group.add(ring);return{group,ring}}
function beacon(){const group=new THREE.Group(),ring=new THREE.Mesh(new THREE.TorusGeometry(.52,.06,16,64),new THREE.MeshBasicMaterial({color:0x7cf0a5,transparent:true,opacity:.7,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));ring.position.z=.04;group.add(ring);const beam=new THREE.Mesh(new THREE.CylinderGeometry(.055,.17,2.9,18,1,true),new THREE.MeshBasicMaterial({color:0x7cf0a5,transparent:true,opacity:.24,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));beam.rotation.x=Math.PI/2;beam.position.z=1.45;group.add(beam);return{group,ring}}
function traveler(){const group=new THREE.Group();group.add(new THREE.Mesh(new THREE.SphereGeometry(.2,18,14),new THREE.MeshBasicMaterial({color:0xdffcff,transparent:true,opacity:.98,blending:THREE.AdditiveBlending,depthWrite:false})));return{group}}
function renderAt(l,s,o,args,scale){const mm=l.map.transform.getMatrixForModel(o,0),p=new THREE.Matrix4().fromArray(args.defaultProjectionData.mainMatrix),local=new THREE.Matrix4().fromArray(mm).scale(new THREE.Vector3(scale,scale,scale));l.camera.projectionMatrix=p.multiply(local);l.camera.projectionMatrixInverse.copy(l.camera.projectionMatrix).invert();l.renderer.resetState();l.renderer.render(s,l.camera)}
function current(){return reviewing?reviewQuestion:QUESTIONS[index]}
function startGame(){if(!mapReady){handlePlay();return}try{dayState=loadDay(DAILY_KEY)||initialState(DAILY_KEY);if(dayState.completed&&!practiceMode){results=hydrated();total=dayState.total||0;index=5;els.intro.classList.add('hidden');summary();return}if(practiceMode){index=0;results=[];total=0}else{results=hydrated();total=dayState.total||0;index=Math.min(dayState.results?.length||0,4)}reviewing=false;els.intro.classList.add('hidden');els.summary.classList.add('hidden');els.topbar.classList.add('show');els.controls.classList.add('show');els.zoompad.classList.add('show');question(true)}catch(e){console.error('Start game failed',e);els.status.textContent='Game startup failed: '+(e?.message||'unknown error');els.status.classList.remove('hidden');els.status.classList.add('error')}}
function question(reset=false){const q=current();locked=false;animating=false;hinted=false;clear();els.result.classList.remove('show');els.tip.classList.remove('hide');els.round.textContent=reviewing?'MEMORY CHECK':`ROUND ${index+1} / 5`;els.category.textContent=reviewing?'NO POINTS':q.category.toUpperCase();els.question.innerHTML=`${q.symbol?q.symbol+' ':''}${reviewing?'One more time: where is '+q.name+'?':q.prompt}`;els.sub.textContent=reviewing?'Use the correction you just saw.':'Spin the globe and tap your best guess.';els.hint.style.display=reviewing?'none':'';els.hint.disabled=false;els.hint.classList.remove('used');els.hint.textContent='💡 HINT · MAX 160';els.running.textContent=total;if(reset)map.easeTo({center:[18,14],zoom:.64,duration:550})}
async function guess(g){const q=current();locked=true;animating=true;els.tip.classList.add('hide');els.hint.disabled=true;src('guess',fc([pt(g)]));src('answer',fc([]));src('route',fc([]));effects.fire(g);effects.target(q.coords,false);els.flash.classList.remove('show');void els.flash.offsetWidth;els.flash.classList.add('show');navigator.vibrate?.(14);const km=dist(g,q.coords);let score=scoreFor(km);if(hinted)score=Math.min(score,160);await wait(260);const mid=great(g,q.coords,2)[1],z=km<400?3.5:km<1400?2.8:km<4000?2.05:1.2;map.easeTo({center:mid,zoom:z,duration:720,easing:easeOut});await wait(200);const route=great(g,q.coords,100),dur=Math.max(720,Math.min(1750,620+km*.095)),t0=performance.now();effects.travel(g,true);await new Promise(done=>{const tick=n=>{const t=Math.min(1,(n-t0)/dur),e=easeIO(t),i=Math.max(1,Math.floor(e*(route.length-1)));src('route',fc([ln(route.slice(0,i+1))]));effects.travel(route[i],true);if(t<1)raf=requestAnimationFrame(tick);else done()};raf=requestAnimationFrame(tick)});effects.travel(q.coords,false);effects.target(q.coords,true);src('answer',fc([pt(q.coords)]));map.easeTo({center:q.coords,zoom:2.08,duration:780,easing:easeOut});await wait(360);context(q);showResult(q,km,score,g);animating=false}
function showResult(q,km,score,g){els.place.textContent=q.name+(q.flag?' '+q.flag:'');els.distance.textContent=`${fmt(km)} away · ${word(score)}${hinted?' · hint used':''}`;els.roundScore.innerHTML=reviewing?`${km<=650?'✓':'↻'}<small>${km<=650?'REMEMBERED':'ANCHOR IT'}</small>`:`${score}<small>POINTS</small>`;els.fact.textContent=q.fact;els.learning.innerHTML='<strong>Anchor it:</strong> '+q.anchor;els.neighbors.innerHTML=(q.chips||[]).map(x=>`<span class="neighbor">${x}</span>`).join('');els.next.textContent=reviewing?'BACK TO RESULTS':index===4?'SEE RESULTS →':'NEXT →';els.result.classList.add('show');if(reviewing)els.next.onclick=returnReview;else if(practiceMode){results.push({q,g,km,score,hinted});total+=score;els.running.textContent=total;els.next.onclick=next}else{dayState=recordRound(dayState,{qId:q.id,g,km,score,hinted,answeredAt:Date.now()});saveDay(dayState,DAILY_KEY);results=hydrated();total=dayState.total;els.running.textContent=total;els.next.onclick=next}}
function next(){els.result.classList.remove('show');index++;if(index>=5)return setTimeout(summary,160);setTimeout(()=>question(true),150)}
function useHint(){if(locked||hinted||reviewing)return;hinted=true;els.hint.disabled=true;els.hint.classList.add('used');els.hint.textContent='HINT USED · MAX 160';const q=current();map.easeTo({center:REGION_CENTERS[q.region]||q.coords,zoom:1.28,duration:600});els.sub.textContent='Region hint used · max 160 points.'}
function summary(){locked=true;clear();if(!practiceMode){dayState=loadDay(DAILY_KEY)||dayState;results=hydrated();total=dayState.total||total}els.topbar.classList.remove('show');els.controls.classList.remove('show');els.zoompad.classList.remove('show');els.result.classList.remove('show');els.final.textContent=total;els.blocks.innerHTML=results.map(r=>`<div class="block" style="background:${color(r.score)}">${r.score}</div>`).join('');els.summaryText.textContent=practiceMode?'Practice complete — your saved Daily score is unchanged.':total>=800?'Excellent world sense.':total>=550?'Strong start. The corrections are doing the teaching.':'The misses are the useful part — now you have five anchors.';const worst=[...results].sort((a,b)=>a.score-b.score)[0];if(worst){els.memoryTitle.textContent='Remember '+worst.q.name+'?';els.memoryCopy.textContent=`Your toughest round was ${fmt(worst.km)} away. Place it once more while the correction is fresh.`;els.memory.onclick=()=>review(worst.q)}els.summary.classList.remove('hidden');syncIntro()}
function review(q){reviewQuestion=q;reviewing=true;els.summary.classList.add('hidden');els.topbar.classList.add('show');els.controls.classList.add('show');els.zoompad.classList.add('show');question(true)}
function returnReview(){reviewing=false;reviewQuestion=null;els.result.classList.remove('show');clear();els.topbar.classList.remove('show');els.controls.classList.remove('show');els.zoompad.classList.remove('show');els.summary.classList.remove('hidden');els.memoryCard.style.display='none'}
function context(q){clearContext();(q.context||[]).forEach((c,i)=>{const e=document.createElement('div');e.className='context-label'+(c[2]?' target':'');e.textContent=c[0];const m=new maplibregl.Marker({element:e,anchor:'center'}).setLngLat(c[1]).addTo(map);labels.push(m);setTimeout(()=>e.classList.add('show'),70+i*55)})}
function clearContext(){labels.forEach(m=>m.remove());labels=[]}
function clear(){cancelAnimationFrame(raf);clearContext();effects?.clear();src('guess',fc([]));src('answer',fc([]));src('route',fc([]))}
function src(id,data){map?.getSource(id)?.setData(data)}function isSummary(){return !els.summary.classList.contains('hidden')}
function dist(a,b){const R=6371,r=Math.PI/180,p1=a[1]*r,p2=b[1]*r,dp=(b[1]-a[1])*r,dl=(b[0]-a[0])*r,h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function scoreFor(k){return k<25?200:Math.max(0,Math.min(200,Math.round(200*Math.exp(-k/2300))))}function word(s){return s>=190?'bullseye':s>=155?'excellent':s>=115?'close':s>=70?'learning':'discovery'}function fmt(k){return k<10?k.toFixed(1)+' km':Math.round(k).toLocaleString()+' km'}function color(s){return s>=170?'var(--green)':s>=120?'var(--gold)':s>=70?'var(--blue)':'var(--red)'}
function v([lng,lat]){const a=lng*Math.PI/180,b=lat*Math.PI/180,c=Math.cos(b);return[c*Math.cos(a),c*Math.sin(a),Math.sin(b)]}function ll([x,y,z]){return[Math.atan2(y,x)*180/Math.PI,Math.atan2(z,Math.hypot(x,y))*180/Math.PI]}function great(a,b,n=36){const A=v(a),B=v(b),d=Math.max(-1,Math.min(1,A[0]*B[0]+A[1]*B[1]+A[2]*B[2])),o=Math.acos(d);if(o<1e-6)return[a,b];const so=Math.sin(o),out=[];for(let i=0;i<=n;i++){const t=i/n,p=Math.sin((1-t)*o)/so,q=Math.sin(t*o)/so;out.push(ll([A[0]*p+B[0]*q,A[1]*p+B[1]*q,A[2]*p+B[2]*q]))}return out}
function fc(features){return{type:'FeatureCollection',features}}function pt(c){return{type:'Feature',properties:{},geometry:{type:'Point',coordinates:c}}}function ln(c){return{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:c}}}function wait(ms){return new Promise(r=>setTimeout(r,ms))}function easeOut(t){return 1-Math.pow(1-t,3)}function easeIO(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function fps(){let f=0,l=performance.now();function tick(n){f++;if(n-l>700){els.fps.textContent=Math.round(f*1000/(n-l));f=0;l=n}requestAnimationFrame(tick)}requestAnimationFrame(tick)}
els.hint.onclick=useHint;els.again.onclick=()=>{practiceMode=true;els.summary.classList.add('hidden');startGame()};els.share.onclick=()=>{const t=`WorldTap ${total}/1000`;navigator.share?navigator.share({text:t}).catch(()=>{}):navigator.clipboard?.writeText(t)};els.zin.onclick=()=>mapReady&&map.easeTo({zoom:Math.min(map.getZoom()+.7,5),duration:260});els.zout.onclick=()=>mapReady&&map.easeTo({zoom:Math.max(map.getZoom()-.7,.18),duration:260});
'''
          p.write_text(s[:start]+js+s[end:])
          PY
      - name: Commit integration
        run: |
          git config user.name paksue
          git config user.email paksuetablet@gmail.com
          git add worldtap-next/daily-touch.html
          git commit -m "Integrate Daily Engine into WorldTap Gold"
          git push
