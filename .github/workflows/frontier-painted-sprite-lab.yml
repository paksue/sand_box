name: Frontier Painted Sprite Lab

on:
  push:
    paths:
      - 'frontier-painted-sprite-lab/**'
      - '.github/workflows/frontier-painted-sprite-lab.yml'
  pull_request:
    paths:
      - 'frontier-painted-sprite-lab/**'
      - '.github/workflows/frontier-painted-sprite-lab.yml'

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4175 --directory frontier-painted-sprite-lab >/tmp/painted-sprite-http.log 2>&1 &
          sleep 2
      - name: Run painterly sprite regression
        env:
          PAINTED_SPRITE_URL: http://127.0.0.1:4175/
        run: node frontier-painted-sprite-lab/tests/visual.mjs
      - name: Run weighted rig regression
        env:
          PAINTED_SPRITE_URL: http://127.0.0.1:4175/
        run: node frontier-painted-sprite-lab/tests/rig-test.mjs
      - name: Run living illustration regression
        env:
          PAINTED_SPRITE_URL: http://127.0.0.1:4175/
        run: node frontier-painted-sprite-lab/tests/child-light.mjs
      - name: Run cinematic stage regression
        env:
          PAINTED_SPRITE_URL: http://127.0.0.1:4175/
        run: node frontier-painted-sprite-lab/tests/cinematic.mjs
      - name: Run living painting world regression
        env:
          PAINTED_SPRITE_URL: http://127.0.0.1:4175/
        run: node frontier-painted-sprite-lab/tests/painting-world.mjs
      - name: Run Master Animator hero motion regression
        env:
          PAINTED_SPRITE_URL: http://127.0.0.1:4175/
        run: node frontier-painted-sprite-lab/tests/hero-motion.mjs
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-painted-sprite-lab
          path: |
            frontier-painted-sprite-lab/test-results/
            frontier-painted-sprite-lab/test-results-rig/
            frontier-painted-sprite-lab/test-results-child-light/
            frontier-painted-sprite-lab/test-results-cinematic/
            frontier-painted-sprite-lab/test-results-painting-world/
            frontier-painted-sprite-lab/test-results-hero-motion/
          if-no-files-found: ignore
