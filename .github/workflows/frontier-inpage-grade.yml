name: Frontier Journey In-Page Balance Grade

on:
  push:
    branches:
      - agent/inpage-balance-sim
    paths:
      - 'frontier-journey/**'
      - '.github/workflows/frontier-inpage-grade.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balance-grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start static game server
        run: |
          python3 -m http.server 4173 --directory frontier-journey >/tmp/frontier-http.log 2>&1 &
          sleep 2

      - name: Run ten seeded balance simulations in one browser page
        env:
          FRONTIER_URL: http://127.0.0.1:4173/
        run: node frontier-journey/tests/inpage-grade.mjs

      - name: Upload balance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-inpage-grade-results
          path: frontier-journey/test-results-inpage/
          if-no-files-found: ignore
