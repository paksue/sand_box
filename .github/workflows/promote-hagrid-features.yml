name: Promote HaGRID feature asset

on:
  push:
    branches: [gesture-personalized-v1]
    paths:
      - '.github/workflows/promote-hagrid-features.yml'

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gesture-personalized-v1
      - name: Download successful derived feature artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/hagrid-artifact
          gh run download 32087921283 -n hagrid-negative-features-v1 -D /tmp/hagrid-artifact
      - name: Strip source filenames and validate
        shell: bash
        run: |
          python - <<'PY'
          import json, math, os
          src='/tmp/hagrid-artifact/hagrid-negative-features.json'
          out='isometric-timer/assets/models/hagrid-negative-features-v1.json'
          with open(src) as f:
              data=json.load(f)
          samples=[]
          for sample in data.get('samples', []):
              feature=sample.get('f')
              if not isinstance(feature, list) or len(feature) != 63 or not all(isinstance(v,(int,float)) and math.isfinite(v) for v in feature):
                  raise SystemExit('Invalid feature vector in HaGRID artifact')
              samples.append({'f': feature})
          if len(samples) != 300:
              raise SystemExit(f'Expected 300 samples, got {len(samples)}')
          payload={
              'version':1,
              'label':'none',
              'count':300,
              'featureSize':63,
              'normalization':data['normalization'],
              'source':'HaGRIDv2 no_gesture',
              'sourceUrl':'https://github.com/hukenovs/hagrid',
              'license':'CC BY-SA 4.0 (see HaGRID license)',
              'seed':data['seed'],
              'samples':samples,
          }
          os.makedirs(os.path.dirname(out), exist_ok=True)
          with open(out,'w') as f:
              json.dump(payload,f,separators=(',',':'))
          print(f'wrote {out}: {os.path.getsize(out)} bytes')
          PY
      - name: Commit derived asset to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add isometric-timer/assets/models/hagrid-negative-features-v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: add HaGRID negative landmark features'
          git push origin HEAD:gesture-personalized-v1
