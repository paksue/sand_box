name: Build HaGRID negative landmark features

on:
  push:
    branches: [gesture-personalized-v1]
    paths:
      - '.github/workflows/build-hagrid-negative-features.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-hagrid-negative-features.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MediaPipe runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgles2 libegl1 libgl1 libglib2.0-0
          pip install --disable-pip-version-check mediapipe==0.10.35
      - name: Download official HaGRIDv2 no_gesture archive and Google gesture model
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3 -o /tmp/no_gesture.zip \
            https://rndml-team-cv.obs.ru-moscow-1.hc.sbercloud.ru/datasets/hagrid_v2/hagrid_v2_zip/no_gesture.zip
          curl -fL --retry 4 --retry-delay 3 -o /tmp/gesture_recognizer.task \
            https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task
          unzip -t /tmp/no_gesture.zip >/dev/null
      - name: Extract 300 normalized no_gesture hand-landmark samples
        shell: bash
        run: |
          python - <<'PY'
          import json, math, os, random, tempfile, zipfile
          import mediapipe as mp

          ARCHIVE = '/tmp/no_gesture.zip'
          MODEL = '/tmp/gesture_recognizer.task'
          OUT = '/tmp/hagrid-negative-features.json'
          TARGET = 300
          SEED = 20260817

          BaseOptions = mp.tasks.BaseOptions
          GestureRecognizer = mp.tasks.vision.GestureRecognizer
          GestureRecognizerOptions = mp.tasks.vision.GestureRecognizerOptions
          RunningMode = mp.tasks.vision.RunningMode

          def normalize_landmarks(landmarks, handedness):
              pts = [[float(p.x), float(p.y), float(p.z)] for p in landmarks]
              wx, wy, wz = pts[0]
              rel = [[x-wx, y-wy, z-wz] for x,y,z in pts]
              if str(handedness).lower().startswith('left'):
                  for p in rel:
                      p[0] *= -1.0
              vx, vy = rel[9][0], rel[9][1]
              angle = math.atan2(vy, vx)
              delta = -math.pi/2 - angle
              c, s = math.cos(delta), math.sin(delta)
              for p in rel:
                  x, y = p[0], p[1]
                  p[0] = c*x - s*y
                  p[1] = s*x + c*y
              scale = math.sqrt(rel[9][0]**2 + rel[9][1]**2 + rel[9][2]**2)
              if scale < 1e-6:
                  scale = max((math.sqrt(x*x+y*y+z*z) for x,y,z in rel), default=1.0)
              scale = max(scale, 1e-6)
              flat = []
              for x,y,z in rel:
                  flat.extend((round(x/scale, 6), round(y/scale, 6), round(z/scale, 6)))
              return flat

          with zipfile.ZipFile(ARCHIVE) as zf:
              names = [n for n in zf.namelist() if n.lower().endswith(('.jpg','.jpeg','.png','.webp'))]
              random.Random(SEED).shuffle(names)
              samples = []
              attempted = 0
              with tempfile.TemporaryDirectory() as td:
                  options = GestureRecognizerOptions(
                      base_options=BaseOptions(model_asset_path=MODEL),
                      running_mode=RunningMode.IMAGE,
                      num_hands=1,
                      min_hand_detection_confidence=0.4,
                      min_hand_presence_confidence=0.4,
                  )
                  with GestureRecognizer.create_from_options(options) as recognizer:
                      for name in names:
                          if len(samples) >= TARGET:
                              break
                          attempted += 1
                          ext = os.path.splitext(name)[1].lower() or '.jpg'
                          path = os.path.join(td, f'img{ext}')
                          with open(path, 'wb') as f:
                              f.write(zf.read(name))
                          try:
                              result = recognizer.recognize(mp.Image.create_from_file(path))
                          except Exception:
                              continue
                          if not result.hand_landmarks:
                              continue
                          handed = ''
                          try:
                              handed = result.handedness[0][0].category_name or ''
                          except Exception:
                              pass
                          samples.append({
                              'f': normalize_landmarks(result.hand_landmarks[0], handed),
                              'h': handed,
                              'source': os.path.basename(name),
                          })

          payload = {
              'version': 1,
              'label': 'none',
              'count': len(samples),
              'featureSize': 63,
              'normalization': 'wrist-centered; left mirrored; wrist->middle-MCP rotated vertical; scaled by wrist->middle-MCP distance',
              'source': 'HaGRIDv2 no_gesture',
              'sourceUrl': 'https://github.com/hukenovs/hagrid',
              'license': 'CC BY-SA 4.0 (see HaGRID license)',
              'seed': SEED,
              'attempted': attempted,
              'samples': samples,
          }
          if len(samples) != TARGET:
              raise SystemExit(f'Expected {TARGET} detected samples, got {len(samples)} after {attempted} attempts')
          with open(OUT, 'w') as f:
              json.dump(payload, f, separators=(',', ':'))
          print(f'wrote {len(samples)} samples to {OUT}, {os.path.getsize(OUT)} bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hagrid-negative-features-v1
          path: /tmp/hagrid-negative-features.json
          if-no-files-found: error
          retention-days: 7
