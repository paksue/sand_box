name: Run WorldTap Daily Integration
on:
  push:
    paths:
      - '.github/workflows/worldtap-integrate-run.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply integration payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          payload=Path('.github/workflows/worldtap-integrate-daily.yml').read_text()
          js=payload.split("js=r'''",1)[1].split("\n'''",1)[0]
          p=Path('worldtap-next/daily-touch.html')
          s=p.read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script></body></html>',a)
          p.write_text(s[:a]+js+s[b:])
          PY
      - name: Commit integration
        run: |
          git config user.name paksue
          git config user.email paksuetablet@gmail.com
          git add worldtap-next/daily-touch.html
          git commit -m "Integrate Daily Engine into WorldTap Gold"
          git push
