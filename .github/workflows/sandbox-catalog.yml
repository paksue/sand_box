name: Refresh SandBox App Library

on:
  push:
    branches: [main]
    paths:
      - '**/index.html'
      - 'catalog/project-metadata.json'
      - 'scripts/generate-sandbox-catalog.cjs'
      - '.github/workflows/sandbox-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sandbox-library-catalog
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate generator
        run: node --check scripts/generate-sandbox-catalog.cjs
      - name: Refresh the app catalog
        run: node scripts/generate-sandbox-catalog.cjs
      - name: Validate launcher JavaScript
        run: node --check assets/sandbox.js
      - name: Commit changed catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/apps.json
          if git diff --cached --quiet; then
            echo "Catalog already current."
          else
            git commit -m "Refresh SandBox app catalog"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
