name: Publish frontier production spine hero preview

on:
  push:
    branches:
      - agent/frontier-production-spine-hero
    paths:
      - 'frontier-painted-sprite-lab/**'
      - '.github/workflows/publish-frontier-production-spine-hero-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontier-production-spine-hero-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview source
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-production-spine-hero
          path: source

      - name: Check out main Pages tree
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Sync preview files
        shell: bash
        run: |
          set -euo pipefail
          target="site/previews/frontier-production-spine-hero"
          rm -rf "$target"
          mkdir -p "$target"
          cp -a source/frontier-painted-sprite-lab/. "$target/"

      - name: Commit preview to main
        shell: bash
        run: |
          set -euo pipefail
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/frontier-production-spine-hero
          if git diff --cached --quiet; then
            echo "Preview already up to date."
            exit 0
          fi
          git commit -m "Publish frontier production spine hero preview"
          git pull --rebase origin main
          git push origin HEAD:main
