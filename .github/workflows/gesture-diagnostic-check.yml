name: Gesture diagnostic check

on:
  push:
    branches: [gesture-live-diagnostic]
    paths:
      - 'isometric-timer/**'
      - '.github/workflows/gesture-diagnostic-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and pure tests
        shell: bash
        run: |
          set -euo pipefail
          printf '{"type":"module"}\n' > isometric-timer/package.json
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find isometric-timer/js isometric-timer/workers isometric-timer/tests -name '*.js' -print0)
          grep -q 'id="gestureDebug"' isometric-timer/index.html
          grep -q 'gestureDebugText' isometric-timer/js/ui/render.js
          grep -q 'Open Palm ·' isometric-timer/js/hands-free/gesture-adapter.js
          cd isometric-timer
          node --input-type=module <<'NODE'
          const suites = [
            ['./tests/timer-machine.test.js', 'runTimerMachineTests'],
            ['./tests/progression.test.js', 'runProgressionTests'],
            ['./tests/command-router.test.js', 'runCommandRouterTests'],
            ['./tests/persistence.test.js', 'runPersistenceTests']
          ];
          for (const [path, name] of suites) {
            const mod = await import(path);
            await mod[name]();
            console.log(`PASS ${path}`);
          }
          NODE
