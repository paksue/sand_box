name: Frontier Painted Sprite Asset Audition

on:
  push:
    paths:
      - 'frontier-painted-sprite-lab/tools/**'
      - '.github/workflows/frontier-painted-sprite-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image matting tools
        run: python -m pip install --upgrade "rembg[cpu]" pillow
      - name: Generate transparent painterly candidates
        run: python frontier-painted-sprite-lab/tools/build_candidates.py
      - name: Build selected runtime asset
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('frontier-painted-sprite-lab')
          src = Image.open(root / 'candidate-assets' / 'pair-of-oxen.png').convert('RGBA')
          width = 800
          height = round(src.height * width / src.width)
          src = src.resize((width, height), Image.Resampling.LANCZOS)
          out = root / 'assets' / 'rosa-bonheur-pair-of-oxen.webp'
          out.parent.mkdir(parents=True, exist_ok=True)
          src.save(out, 'WEBP', quality=88, method=6)
          print(out, out.stat().st_size, src.size)
          PY
      - name: Commit selected runtime asset to branch
        run: |
          git config user.name "frontier-visual-bot"
          git config user.email "frontier-visual-bot@users.noreply.github.com"
          git add frontier-painted-sprite-lab/assets/rosa-bonheur-pair-of-oxen.webp
          if git diff --cached --quiet; then
            echo "Selected asset unchanged."
          else
            git commit -m "Regenerate selected painterly ox asset"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload candidate sprites
        uses: actions/upload-artifact@v4
        with:
          name: frontier-painted-ox-candidates
          path: frontier-painted-sprite-lab/candidate-assets/
          if-no-files-found: error
