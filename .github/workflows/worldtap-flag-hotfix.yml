name: WorldTap Flag Hotfix
on:
  push:
    paths:
      - '.github/workflows/worldtap-flag-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch flag rendering and bust engine cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worldtap-next/daily-touch.html')
          s=p.read_text()
          old="import {dateKey,dailySet,loadDay,saveDay,initialState,recordRound,TapGuard} from './daily-engine.js';"
          new="import {dateKey,dailySet,loadDay,saveDay,initialState,recordRound,TapGuard} from './daily-engine.js?v=20260814-flagfix2';"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Daily engine import pattern not found')
          oldq="els.question.innerHTML=`${q.symbol?q.symbol+' ':''}${reviewing?'One more time: where is '+q.name+'?':q.prompt}`;"
          newq="const cleanPrompt=q.category==='Flag'&&q.flag?q.prompt.split(q.flag).join('').trim():q.prompt;els.question.textContent=`${q.symbol?q.symbol+' ':''}${reviewing?'One more time: where is '+q.name+'?':cleanPrompt}`;"
          if oldq in s:
              s=s.replace(oldq,newq,1)
          elif newq not in s:
              raise SystemExit('Question render pattern not found')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worldtap-next/daily-touch.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix duplicate flag rendering defensively"
          git push
