name: WorldTap Desktop Flag Link
on:
  push:
    paths:
      - '.github/workflows/worldtap-desktop-flag-link.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link desktop flag stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worldtap-next/daily-touch.html')
          s=p.read_text()
          link='<link rel="stylesheet" href="./desktop-flag.css?v=1" />'
          if link not in s:
              s=s.replace('</head>',link+'\n</head>',1)
          p.write_text(s)
          PY
      - name: Commit link
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worldtap-next/daily-touch.html
          git diff --cached --quiet && exit 0
          git commit -m "Use responsive desktop flag clue styling"
          git push
