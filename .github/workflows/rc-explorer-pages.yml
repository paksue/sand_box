name: RC Explorer GitHub Pages Preview

on:
  push:
    branches: [main]
    paths:
      - 'rc-explorer/**'
      - '.github/workflows/rc-explorer-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc-explorer-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        working-directory: rc-explorer
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publish into sandbox Pages tree
        run: |
          rm -rf previews/rc-explorer
          mkdir -p previews/rc-explorer
          cp -a rc-explorer/dist/. previews/rc-explorer/
          touch previews/rc-explorer/.nojekyll
          test -f previews/rc-explorer/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rc-explorer
          if git diff --cached --quiet; then
            echo 'RC Explorer Pages preview already current.'
          else
            git commit -m 'Publish RC Explorer GitHub Pages preview'
            git push origin HEAD:main
          fi
      - name: Verify live GitHub Pages
        run: |
          URL='https://paksue.github.io/sand_box/previews/rc-explorer/'
          for i in {1..30}; do
            HTML="$(curl -fsSL --max-time 15 "$URL" || true)"
            if printf '%s' "$HTML" | grep -q 'Tiny Trails · RC Explorer'; then
              ASSET="$(printf '%s' "$HTML" | grep -oE './assets/index-[A-Za-z0-9_-]+\.js' | head -1)"
              if [ -n "$ASSET" ] && curl -fsSL --max-time 15 "${URL}${ASSET#./}" >/dev/null; then
                echo "Live RC Explorer verified at $URL"
                exit 0
              fi
            fi
            echo "Waiting for Pages propagation ($i/30)…"
            sleep 4
          done
          echo "Live Pages verification failed for $URL"
          exit 1
