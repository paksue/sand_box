name: WorldTap Responsive Home
on:
  push:
    paths:
      - 'worldtap-next/tools/apply_responsive_home.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 worldtap-next/tools/apply_responsive_home.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worldtap-next/daily-touch.html
          git commit -m "Make WorldTap globe home zoom responsive"
          git push
