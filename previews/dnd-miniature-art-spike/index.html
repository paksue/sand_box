<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17120e" />
  <title>D&D Miniature Art Spike</title>
  <script>
    if (new URLSearchParams(location.search).get('visualCapture') === '1') {
      document.documentElement.classList.add('visual-capture')
    }
    function showFatal(message) {
      const el = document.createElement('pre')
      el.id = 'fatal'
      el.style.cssText = 'position:fixed;inset:12px;z-index:9999;margin:0;padding:16px;white-space:pre-wrap;background:#2b0909;color:#ffd7d7;border:2px solid #ff7878;font:13px/1.4 ui-monospace,monospace;overflow:auto'
      el.textContent = message
      document.addEventListener('DOMContentLoaded', () => document.body.appendChild(el), { once:true })
      if (document.body) document.body.appendChild(el)
    }
    addEventListener('error', e => showFatal('window.error\n' + (e.message || e.error || 'unknown error') + '\n' + (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0)))
    addEventListener('unhandledrejection', e => showFatal('unhandledrejection\n' + (e.reason?.stack || e.reason || 'unknown rejection')))
  </script>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/",
      "three-gpu-pathtracer": "./pathtracer-stub.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <section class="hud">
    <div class="eyebrow">ART SPIKE · REAL PBR ASSETS</div>
    <h1>Miniature Diorama Benchmark</h1>
    <p id="status">Loading scan-quality materials and CC0 assets…</p>
    <div class="row">
      <button id="tabletop" class="active">Tabletop</button>
      <button id="eye">Miniature eye</button>
      <button id="renderMode">Beauty: deferred</button>
    </div>
    <div class="meter"><span id="samples">Raster</span></div>
    <small>Art spike only. Current game remains untouched.</small>
  </section>
  <div class="credit">CC0 source assets: Poly Haven · KayKit</div>
  <script type="module" src="./app.js"></script>
  <script type="module" src="./backdrop-pass.js"></script>
  <script type="module" src="./canopy-pass.js"></script>
  <script type="module" src="./cleanup-pass.js"></script>
  <script type="module" src="./column-pass.js"></script>
  <script type="module" src="./grout-scale-pass.js"></script>
  <script type="module" src="./miniatures-pass.js"></script>
</body>
</html>
